<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Admin - FF Maquininhas</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box
}

body{
  margin:0;
  background:#f4f5f7;
  font-family:Arial,sans-serif;
}

.box{
  max-width:500px;
  margin:30px auto;
  background:#fff;
  padding:22px;
  border-radius:18px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
}

h1{
  margin-top:0;
}

input{
  width:100%;
  padding:14px;
  margin:7px 0;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
}

button{
  width:100%;
  padding:15px;
  margin-top:10px;
  border:0;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.btn-cadastrar{
  background:#111;
  color:#fff;
}

.btn-config{
  background:#08749a;
  color:#fff;
}

.btn-caixa{
  background:#16a34a;
  color:#fff;
}

.btn-editar{
  background:#f59e0b;
  color:#fff;
}

.btn-apagar{
  background:#dc2626;
  color:#fff;
}

.machine{
  background:#f5f5f5;
  padding:15px;
  border-radius:12px;
  margin-top:12px;
}

.machine-title{
  font-size:18px;
  font-weight:bold;
  margin-bottom:5px;
}

.machine-desc{
  color:#555;
  margin-bottom:10px;
}

.link{
  word-break:break-all;
  font-size:12px;
  color:#444;
}

.status{
  margin-top:12px;
  font-weight:bold;
}

.error{
  color:#b42318;
}

.ok{
  color:#027a48;
}

hr{
  border:0;
  border-top:1px solid #eee;
  margin:25px 0;
}

.edit-area{
  display:none;
  margin-top:12px;
  padding:12px;
  background:#fff;
  border:1px solid #ddd;
  border-radius:10px;
}

.edit-area input{
  margin:4px 0;
}

.btn-salvar{
  background:#2563eb;
  color:#fff;
}

.btn-cancelar{
  background:#6b7280;
  color:#fff;
}

.loading{
  color:#666;
}
</style>
</head>

<body>

<div class="box">

<h1>FF MAQUININHAS</h1>

<p>
Cadastre cada maquininha.
O Access Token do Mercado Pago será configurado separadamente depois.
</p>

<input
  id="nome"
  placeholder="Nome da maquininha / operador"
>

<input
  id="descricao"
  placeholder="Descrição (opcional)"
>

<button
  id="btnCadastrar"
  class="btn-cadastrar"
>
CADASTRAR MAQUININHA
</button>

<div
  id="status"
  class="status"
></div>

<hr>

<h3>Maquininhas cadastradas</h3>

<div id="lista">
Carregando...
</div>

</div>

<script>

const SUPABASE_URL =
"https://auzdqapjetmhaokoynzo.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_36kXlyuKU8RMfgSx01h5mw_lOLp1lbX";

const dbMaquininha =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

const nomeInput =
document.getElementById("nome");

const descricaoInput =
document.getElementById("descricao");

const statusEl =
document.getElementById("status");

const listaEl =
document.getElementById("lista");

const btnCadastrar =
document.getElementById("btnCadastrar");


function escapeHtml(valor){

  return String(valor || "")
    .replace(
      /[&<>"']/g,
      function(m){

        return {
          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#039;"
        }[m];

      }
    );

}


function mostrarStatus(
  mensagem,
  erro=false
){

  statusEl.className =
    erro
      ? "status error"
      : "status ok";

  statusEl.textContent =
    mensagem;

}


/* =====================================================
   CADASTRAR
===================================================== */

async function cadastrar(){

  const nome =
    nomeInput.value.trim();

  const descricao =
    descricaoInput.value.trim();


  if(!nome){

    mostrarStatus(
      "Informe o nome da maquininha.",
      true
    );

    nomeInput.focus();

    return;
  }


  btnCadastrar.disabled=true;

  mostrarStatus(
    "Cadastrando..."
  );


  try{

    const resposta =
      await fetch(
        `${SUPABASE_URL}/functions/v1/cadastrar-maquininha`,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json",

            "apikey":
              SUPABASE_ANON_KEY,

            "Authorization":
              `Bearer ${SUPABASE_ANON_KEY}`
          },

          body:JSON.stringify({
            nome,
            descricao
          })
        }
      );


    const texto =
      await resposta.text();

    let dados;

    try{
      dados =
        JSON.parse(texto);
    }catch{
      throw new Error(
        "Resposta inválida da Edge Function: " +
        texto
      );
    }


    if(
      !resposta.ok ||
      !dados.success
    ){

      throw new Error(
        dados.error ||
        "Erro ao cadastrar."
      );

    }


    mostrarStatus(
      "✅ Maquininha cadastrada com sucesso."
    );


    nomeInput.value="";
    descricaoInput.value="";


    await carregarMaquininhas();


  }catch(erro){

    console.error(
      "ERRO CADASTRO:",
      erro
    );

    mostrarStatus(
      erro.message ||
      "Erro ao cadastrar.",
      true
    );

  }finally{

    btnCadastrar.disabled=false;

  }

}


/* =====================================================
   LISTAR
===================================================== */

async function carregarMaquininhas(){

  listaEl.innerHTML =
    `<div class="loading">
      Carregando...
    </div>`;


  const resultado =
    await dbMaquininha
      .from("maquininhas")
      .select(
        "id,app_id,nome,descricao,ativo,criado_em"
      )
      .order(
        "criado_em",
        {
          ascending:false
        }
      );


  if(resultado.error){

    console.error(
      "ERRO LISTA:",
      resultado.error
    );

    listaEl.innerHTML = `
      <div class="error">
        Erro ao carregar:<br>
        ${escapeHtml(
          resultado.error.message
        )}
      </div>
    `;

    return;
  }


  const maquinas =
    resultado.data || [];


  if(!maquinas.length){

    listaEl.innerHTML =
      "Nenhuma maquininha cadastrada.";

    return;

  }


  listaEl.innerHTML =
    maquinas.map(
      function(maquina){

        const configUrl =
          `/config-maquininha.html?app_id=${
            encodeURIComponent(
              maquina.app_id
            )
          }`;

        const caixaUrl =
          `/caixa.html?maquininha_id=${
            encodeURIComponent(
              maquina.id
            )
          }`;


        return `

          <div
            class="machine"
            id="machine-${maquina.id}"
          >

            <div class="machine-title">
              ${escapeHtml(
                maquina.nome
              )}
            </div>

            <div class="machine-desc">
              ${escapeHtml(
                maquina.descricao || ""
              )}
            </div>

            <div class="link">
              ID:<br>
              ${escapeHtml(
                maquina.id
              )}
            </div>

            <br>

            <div class="link">
              APP ID:<br>
              ${escapeHtml(
                maquina.app_id
              )}
            </div>


            <!-- CONFIG -->
            <button
              class="btn-config"
              onclick="
                window.location.href='${configUrl}'
              "
            >
              ⚙️ CONFIGURAR MERCADO PAGO
            </button>


            <!-- CAIXA -->
            <button
              class="btn-caixa"
              onclick="
                window.location.href='${caixaUrl}'
              "
            >
              💰 ABRIR MAQUININHA
            </button>


            <!-- EDITAR -->
            <button
              class="btn-editar"
              onclick="
                abrirEdicao(
                  '${maquina.id}',
                  '${escapeJs(maquina.nome)}',
                  '${escapeJs(maquina.descricao || "")}'
                )
              "
            >
              ✏️ EDITAR
            </button>


            <!-- APAGAR -->
            <button
              class="btn-apagar"
              onclick="
                apagarMaquininha(
                  '${maquina.id}',
                  '${escapeJs(maquina.nome)}'
                )
              "
            >
              🗑️ APAGAR
            </button>


            <!-- ÁREA DE EDIÇÃO -->
            <div
              class="edit-area"
              id="edit-${maquina.id}"
            >

              <input
                id="editNome-${maquina.id}"
                value="${escapeHtml(maquina.nome)}"
                placeholder="Nome"
              >

              <input
                id="editDescricao-${maquina.id}"
                value="${escapeHtml(maquina.descricao || "")}"
                placeholder="Descrição"
              >

              <button
                class="btn-salvar"
                onclick="
                  salvarEdicao(
                    '${maquina.id}'
                  )
                "
              >
                💾 SALVAR ALTERAÇÕES
              </button>

              <button
                class="btn-cancelar"
                onclick="
                  fecharEdicao(
                    '${maquina.id}'
                  )
                "
              >
                CANCELAR
              </button>

            </div>

          </div>

        `;

      }
    ).join("");

}


/* =====================================================
   ESCAPE PARA JAVASCRIPT
===================================================== */

function escapeJs(valor){

  return String(valor || "")
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'")
    .replace(/\r/g,"\\r")
    .replace(/\n/g,"\\n");

}


/* =====================================================
   ABRIR EDIÇÃO
===================================================== */

function abrirEdicao(
  id,
  nome,
  descricao
){

  const area =
    document.getElementById(
      `edit-${id}`
    );

  if(!area) return;

  area.style.display =
    "block";

}


/* =====================================================
   FECHAR EDIÇÃO
===================================================== */

function fecharEdicao(id){

  const area =
    document.getElementById(
      `edit-${id}`
    );

  if(!area) return;

  area.style.display =
    "none";

}


/* =====================================================
   SALVAR EDIÇÃO
===================================================== */

async function salvarEdicao(id){

  const nomeEl =
    document.getElementById(
      `editNome-${id}`
    );

  const descricaoEl =
    document.getElementById(
      `editDescricao-${id}`
    );


  const nome =
    nomeEl.value.trim();

  const descricao =
    descricaoEl.value.trim();


  if(!nome){

    alert(
      "Informe o nome da maquininha."
    );

    return;
  }


  try{

    mostrarStatus(
      "Salvando alterações..."
    );


    const resposta =
      await fetch(
        `${SUPABASE_URL}/functions/v1/editar-maquininha`,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json",

            "apikey":
              SUPABASE_ANON_KEY,

            "Authorization":
              `Bearer ${SUPABASE_ANON_KEY}`
          },

          body:JSON.stringify({

            maquininha_id:id,

            nome,

            descricao

          })
        }
      );


    const texto =
      await resposta.text();

    let dados;

    try{
      dados =
        JSON.parse(texto);
    }catch{
      throw new Error(
        "Resposta inválida da Edge Function."
      );
    }


    if(
      !resposta.ok ||
      !dados.success
    ){

      throw new Error(
        dados.error ||
        "Erro ao editar maquininha."
      );

    }


    mostrarStatus(
      "✅ Maquininha atualizada."
    );


    await carregarMaquininhas();


  }catch(erro){

    console.error(
      "ERRO EDITAR:",
      erro
    );

    mostrarStatus(
      erro.message ||
      "Erro ao editar.",
      true
    );

  }

}


/* =====================================================
   APAGAR
===================================================== */

async function apagarMaquininha(
  id,
  nome
){

  const confirmar =
    confirm(
      `Tem certeza que deseja apagar a maquininha "${nome}"?\n\n` +
      `Isso também removerá o negócio FF Maquininha relacionado.`
    );


  if(!confirmar){

    return;

  }


  try{

    mostrarStatus(
      "Apagando maquininha..."
    );


    const resposta =
      await fetch(
        `${SUPABASE_URL}/functions/v1/excluir-maquininha`,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json",

            "apikey":
              SUPABASE_ANON_KEY,

            "Authorization":
              `Bearer ${SUPABASE_ANON_KEY}`
          },

          body:JSON.stringify({

            maquininha_id:id

          })
        }
      );


    const texto =
      await resposta.text();

    let dados;

    try{
      dados =
        JSON.parse(texto);
    }catch{
      throw new Error(
        "Resposta inválida da Edge Function."
      );
    }


    if(
      !resposta.ok ||
      !dados.success
    ){

      throw new Error(
        dados.error ||
        "Erro ao apagar maquininha."
      );

    }


    mostrarStatus(
      "🗑️ Maquininha apagada com sucesso."
    );


    await carregarMaquininhas();


  }catch(erro){

    console.error(
      "ERRO APAGAR:",
      erro
    );

    mostrarStatus(
      erro.message ||
      "Erro ao apagar.",
      true
    );

  }

}


/* =====================================================
   BOTÃO CADASTRAR
===================================================== */

btnCadastrar.addEventListener(
  "click",
  cadastrar
);


/* =====================================================
   INICIALIZA
===================================================== */

carregarMaquininhas();

</script>

</body>
</html>
