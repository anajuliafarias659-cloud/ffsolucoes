<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Admin - FF Maquininhas</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box
}

body{
  margin:0;
  background:#f4f5f7;
  font-family:Arial,sans-serif;
}

.box{
  max-width:500px;
  margin:30px auto;
  background:#fff;
  padding:22px;
  border-radius:18px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
}

h1{
  margin-top:0;
}

input{
  width:100%;
  padding:14px;
  margin:7px 0;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
}

button{
  width:100%;
  padding:15px;
  margin-top:10px;
  border:0;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.btn-cadastrar{
  background:#111;
  color:#fff;
}

.btn-config{
  background:#08749a;
  color:#fff;
}

.btn-caixa{
  background:#16a34a;
  color:#fff;
}

.machine{
  background:#f5f5f5;
  padding:15px;
  border-radius:12px;
  margin-top:12px;
}

.machine-title{
  font-size:18px;
  font-weight:bold;
  margin-bottom:5px;
}

.link{
  word-break:break-all;
  font-size:12px;
  color:#444;
}

.status{
  margin-top:12px;
  font-weight:bold;
}

.error{
  color:#b42318;
}

.ok{
  color:#027a48;
}

hr{
  border:0;
  border-top:1px solid #eee;
  margin:25px 0;
}
</style>
</head>

<body>

<div class="box">

<h1>FF MAQUININHAS</h1>

<p>
Cadastre cada maquininha.
O Access Token do Mercado Pago será configurado separadamente depois.
</p>

<input
  id="nome"
  placeholder="Nome da maquininha / operador"
>

<input
  id="descricao"
  placeholder="Descrição (opcional)"
>

<button
  id="btnCadastrar"
  class="btn-cadastrar"
>
CADASTRAR MAQUININHA
</button>

<div
  id="status"
  class="status"
></div>

<hr>

<h3>Maquininhas cadastradas</h3>

<div id="lista">
Carregando...
</div>

</div>

<script>

const SUPABASE_URL =
"https://auzdqapjetmhaokoynzo.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_36kXlyuKU8RMfgSx01h5mw_lOLp1lbX";

/*
 * NOME DIFERENTE PARA NÃO COLIDIR
 * COM NENHUM outro "supabase".
 */
const dbMaquininha =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);


const nomeInput =
document.getElementById("nome");

const descricaoInput =
document.getElementById("descricao");

const statusEl =
document.getElementById("status");

const listaEl =
document.getElementById("lista");

const btnCadastrar =
document.getElementById("btnCadastrar");


function escapeHtml(valor){

  return String(valor || "")
    .replace(
      /[&<>"']/g,
      function(m){

        return {
          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#039;"
        }[m];

      }
    );

}


function mostrarStatus(
  mensagem,
  erro=false
){

  statusEl.className =
    erro
      ? "status error"
      : "status ok";

  statusEl.textContent =
    mensagem;

}


/* =====================================================
   CADASTRAR MAQUININHA
===================================================== */

async function cadastrar(){

  const nome =
    nomeInput.value.trim();

  const descricao =
    descricaoInput.value.trim();


  if(!nome){

    mostrarStatus(
      "Informe o nome da maquininha.",
      true
    );

    nomeInput.focus();

    return;
  }


  btnCadastrar.disabled=true;

  mostrarStatus(
    "Cadastrando..."
  );


  try{

    const resposta =
      await fetch(
        `${SUPABASE_URL}/functions/v1/cadastrar-maquininha`,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json",

            "apikey":
              SUPABASE_ANON_KEY,

            "Authorization":
              `Bearer ${SUPABASE_ANON_KEY}`
          },

          body:JSON.stringify({

            nome: nome,

            descricao: descricao

          })
        }
      );


    const texto =
      await resposta.text();


    let dados;

    try{

      dados =
        JSON.parse(texto);

    }catch{

      throw new Error(
        "A Edge Function retornou uma resposta inválida: "
        + texto
      );

    }


    if(
      !resposta.ok ||
      !dados.success
    ){

      throw new Error(
        dados.error ||
        "Erro ao cadastrar maquininha."
      );

    }


    mostrarStatus(
      "✅ Maquininha cadastrada com sucesso."
    );


    nomeInput.value="";
    descricaoInput.value="";


    await carregarMaquininhas();


  }catch(erro){

    console.error(
      "ERRO CADASTRO:",
      erro
    );

    mostrarStatus(
      erro.message ||
      "Erro ao cadastrar.",
      true
    );

  }finally{

    btnCadastrar.disabled=false;

  }

}


/* =====================================================
   LISTAR MAQUININHAS
===================================================== */

async function carregarMaquininhas(){

  listaEl.innerHTML =
    "Carregando...";


  const resultado =
    await dbMaquininha
      .from("maquininhas")
      .select(
        "id,app_id,nome,descricao,ativo,criado_em"
      )
      .order(
        "criado_em",
        {
          ascending:false
        }
      );


  if(resultado.error){

    console.error(
      "ERRO LISTA:",
      resultado.error
    );

    listaEl.innerHTML = `
      <div class="error">
        Erro ao carregar maquininhas:<br>
        ${escapeHtml(
          resultado.error.message
        )}
      </div>
    `;

    return;

  }


  const maquinas =
    resultado.data || [];


  if(!maquinas.length){

    listaEl.innerHTML =
      "Nenhuma maquininha cadastrada.";

    return;

  }


  listaEl.innerHTML =
    maquinas.map(
      function(maquina){

        const configUrl =
          `/config-maquininha.html?app_id=${
            encodeURIComponent(
              maquina.app_id
            )
          }`;

        const caixaUrl =
          `/caixa.html?maquininha_id=${
            encodeURIComponent(
              maquina.id
            )
          }`;


        return `

          <div class="machine">

            <div class="machine-title">
              ${escapeHtml(
                maquina.nome
              )}
            </div>

            <div>
              ${escapeHtml(
                maquina.descricao || ""
              )}
            </div>

            <br>

            <div class="link">
              ID:<br>
              ${escapeHtml(
                maquina.id
              )}
            </div>

            <br>

            <div class="link">
              APP ID:<br>
              ${escapeHtml(
                maquina.app_id
              )}
            </div>

            <button
              class="btn-config"
              onclick="
                window.location.href='${configUrl}'
              "
            >
              ⚙️ CONFIGURAR MERCADO PAGO
            </button>

            <button
              class="btn-caixa"
              onclick="
                window.location.href='${caixaUrl}'
              "
            >
              💰 ABRIR MAQUININHA
            </button>

          </div>

        `;

      }
    ).join("");

}


/* =====================================================
   BOTÃO
===================================================== */

btnCadastrar.addEventListener(
  "click",
  cadastrar
);


/* =====================================================
   INICIALIZA
===================================================== */

carregarMaquininhas();

</script>

</body>
</html>
