<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Admin - FF Maquininhas</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box
}

body{
  margin:0;
  background:#f4f5f7;
  font-family:Arial,sans-serif;
  color:#111;
}

.box{
  max-width:500px;
  margin:30px auto;
  background:#fff;
  padding:22px;
  border-radius:18px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
}

h1{
  margin-top:0;
}

input{
  width:100%;
  padding:14px;
  margin:7px 0;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
}

button{
  width:100%;
  padding:15px;
  margin-top:10px;
  border:0;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.btn-cadastrar{
  background:#111;
  color:#fff;
}

.btn-config{
  background:#08749a;
  color:#fff;
}

.btn-caixa{
  background:#16a34a;
  color:#fff;
}

.machine{
  background:#f5f5f5;
  padding:15px;
  border-radius:12px;
  margin-top:12px;
}

.machine-title{
  font-size:18px;
  font-weight:bold;
  margin-bottom:5px;
}

.link{
  word-break:break-all;
  font-size:12px;
  color:#444;
}

.status{
  margin-top:12px;
  font-weight:bold;
}

.error{
  color:#b42318;
}

.ok{
  color:#027a48;
}

hr{
  border:0;
  border-top:1px solid #eee;
  margin:25px 0;
}
</style>
</head>

<body>

<div class="box">

<h1>FF MAQUININHAS</h1>

<p>
Cadastre cada maquininha.
O Access Token do Mercado Pago será configurado
separadamente depois.
</p>

<input
  id="nome"
  placeholder="Nome da maquininha / operador"
>

<input
  id="descricao"
  placeholder="Descrição (opcional)"
>

<button
  class="btn-cadastrar"
  onclick="cadastrar()"
>
CADASTRAR MAQUININHA
</button>

<div
  id="status"
  class="status"
></div>

<hr>

<h3>Maquininhas cadastradas</h3>

<div id="lista">
Carregando...
</div>

</div>


<script>

const SUPABASE_URL =
"https://auzdqapjetmhaokoynzo.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_36kXlyuKU8RMfgSx01h5mw_lOLp1lbX";

const supabase =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);


function escapeHtml(s){

  return String(s || "")
    .replace(
      /[&<>"']/g,
      m => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[m])
    );

}


/* =====================================================
   CADASTRAR
===================================================== */

async function cadastrar(){

  const nome =
    document
      .getElementById("nome")
      .value
      .trim();

  const descricao =
    document
      .getElementById("descricao")
      .value
      .trim();

  const status =
    document.getElementById("status");


  if(!nome){

    status.className =
      "status error";

    status.textContent =
      "Informe o nome da maquininha.";

    return;
  }


  status.className =
    "status";

  status.textContent =
    "Cadastrando...";


  try{

    const r =
      await fetch(
        `${SUPABASE_URL}/functions/v1/cadastrar-maquininha`,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json",

            "apikey":
              SUPABASE_ANON_KEY,

            "Authorization":
              `Bearer ${SUPABASE_ANON_KEY}`
          },

          body:JSON.stringify({

            nome,

            descricao

          })
        }
      );


    const d =
      await r.json();


    if(!r.ok || !d.success){

      throw new Error(
        d.error ||
        "Erro ao cadastrar maquininha."
      );

    }


    status.className =
      "status ok";

    status.textContent =
      "✅ Maquininha cadastrada com sucesso.";


    document
      .getElementById("nome")
      .value="";

    document
      .getElementById("descricao")
      .value="";


    await carregarMaquininhas();


  }catch(e){

    console.error(e);

    status.className =
      "status error";

    status.textContent =
      e.message ||
      "Erro ao cadastrar.";

  }

}


/* =====================================================
   LISTAR
===================================================== */

async function carregarMaquininhas(){

  const lista =
    document.getElementById("lista");


  const {
    data,
    error
  } =
    await supabase
      .from("maquininhas")
      .select(`
        id,
        app_id,
        nome,
        descricao,
        ativo,
        criado_em
      `)
      .order(
        "criado_em",
        {
          ascending:false
        }
      );


  if(error){

    console.error(error);

    lista.innerHTML =
      `<div class="error">
        Erro ao carregar:
        ${escapeHtml(error.message)}
      </div>`;

    return;

  }


  if(!data || !data.length){

    lista.innerHTML =
      "Nenhuma maquininha cadastrada.";

    return;

  }


  lista.innerHTML =
    data.map(maquina => {

      const config =
        `/config-maquininha.html?app_id=${
          encodeURIComponent(maquina.app_id)
        }`;

      const caixa =
        `/caixa.html?maquininha_id=${
          encodeURIComponent(maquina.id)
        }`;


      return `

        <div class="machine">

          <div class="machine-title">
            ${escapeHtml(maquina.nome)}
          </div>

          <div>
            ${escapeHtml(
              maquina.descricao || ""
            )}
          </div>

          <br>

          <div class="link">
            ID:
            ${escapeHtml(maquina.id)}
          </div>

          <div class="link">
            APP ID:
            ${escapeHtml(maquina.app_id)}
          </div>


          <button
            class="btn-config"
            onclick="location.href='${config}'"
          >
            ⚙️ CONFIGURAR MERCADO PAGO
          </button>


          <button
            class="btn-caixa"
            onclick="location.href='${caixa}'"
          >
            💰 ABRIR MAQUININHA
          </button>

        </div>

      `;

    }).join("");

}


carregarMaquininhas();

</script>

</body>
</html>
