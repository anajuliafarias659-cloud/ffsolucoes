<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>FF Maquininha - Configuração</title>

<style>

*{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  background:#f3f4f6;
  color:#101828;
}

.wrap{
  max-width:520px;
  margin:auto;
  padding:20px;
}

.card{
  background:#fff;
  border-radius:22px;
  padding:22px;
  box-shadow:0 8px 30px rgba(0,0,0,.08);
}

.logo{
  text-align:center;
  font-size:42px;
}

h1{
  text-align:center;
  margin:8px 0 5px;
  font-size:23px;
}

.sub{
  text-align:center;
  color:#667085;
  font-size:14px;
  margin-bottom:22px;
}

label{
  display:block;
  font-size:14px;
  font-weight:700;
  margin:15px 0 7px;
}

input{
  width:100%;
  height:50px;
  border:1px solid #d0d5dd;
  border-radius:12px;
  padding:0 13px;
  font-size:16px;
  outline:none;
}

input:focus{
  border-color:#08749a;
  box-shadow:0 0 0 3px rgba(8,116,154,.12);
}

button{
  width:100%;
  min-height:52px;
  border:0;
  border-radius:13px;
  font-size:16px;
  font-weight:750;
  cursor:pointer;
  margin-top:18px;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.primary{
  background:#08749a;
  color:#fff;
}

.secondary{
  background:#eaf2ff;
  color:#175cd3;
}

.info{
  margin-top:18px;
  background:#f9fafb;
  border-radius:15px;
  padding:15px;
  font-size:14px;
  line-height:1.5;
  color:#475467;
}

.status{
  margin-top:14px;
  padding:12px;
  border-radius:12px;
  background:#ecfdf3;
  color:#027a48;
  font-size:14px;
  text-align:center;
  display:none;
}

.error{
  background:#fef3f2;
  color:#b42318;
}

.maquina{
  margin-top:20px;
  background:#f8fafc;
  border:1px solid #e4e7ec;
  border-radius:15px;
  padding:15px;
}

.maquina h3{
  margin:0 0 8px;
}

.small{
  color:#667085;
  font-size:13px;
  word-break:break-all;
}

</style>
</head>

<body>

<div class="wrap">

  <div class="card">

    <div class="logo">⚙️</div>

    <h1>FF MAQUININHA</h1>

    <div class="sub">
      Configuração da conta Mercado Pago
    </div>


    <div class="maquina">

      <h3 id="nomeMaquininha">
        Carregando...
      </h3>

      <div class="small">
        ID DA MAQUININHA:
        <span id="maquininhaIdTexto">---</span>
      </div>

      <div
        class="small"
        style="margin-top:6px"
      >
        APP ID:
        <span id="appIdTexto">Não vinculado</span>
      </div>

    </div>


    <label for="nome">
      Nome da maquininha
    </label>

    <input
      id="nome"
      placeholder="Ex: FF Maquininha"
    >


    <label for="descricao">
      Descrição
    </label>

    <input
      id="descricao"
      placeholder="Ex: Maquininha principal"
    >


    <label for="token">
      Mercado Pago Access Token
    </label>

    <input
      id="token"
      type="password"
      placeholder="Cole aqui o Access Token"
    >


    <button
      class="primary"
      id="salvar"
    >
      💾 SALVAR CONFIGURAÇÃO
    </button>


    <button
      class="secondary"
      id="abrirCaixa"
    >
      💰 ABRIR MAQUININHA
    </button>


    <div
      id="status"
      class="status"
    ></div>


    <div class="info">

      <b>Importante</b>

      <br><br>

      Este Access Token pertence somente a esta
      maquininha.

      <br><br>

      Ele será salvo em:

      <br>

      <b>maquininhas.mercado_pago_token</b>

      <br><br>

      Ele não altera o token do Hotspot.

    </div>

  </div>

</div>


<script type="module">

import {
  createClient
} from "https://esm.sh/@supabase/supabase-js@2";


/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://auzdqapjetmhaokoynzo.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_36kXlyuKU8RMfgSx01h5mw_lOLp1lbX";

const supabase =
  createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* =====================================================
   PARAMETROS
===================================================== */

const params =
  new URLSearchParams(
    location.search
  );


/*
 * AGORA O IDENTIFICADOR CORRETO
 *
 * config-maquininha.html?maquininha_id=UUID
 */

const MAQUININHA_ID =
  params.get("maquininha_id");


/* =====================================================
   ELEMENTOS
===================================================== */

const nomeEl =
  document.getElementById(
    "nome"
  );

const descricaoEl =
  document.getElementById(
    "descricao"
  );

const tokenEl =
  document.getElementById(
    "token"
  );

const nomeMaquininha =
  document.getElementById(
    "nomeMaquininha"
  );

const maquininhaIdTexto =
  document.getElementById(
    "maquininhaIdTexto"
  );

const appIdTexto =
  document.getElementById(
    "appIdTexto"
  );

const statusEl =
  document.getElementById(
    "status"
  );

const salvarBtn =
  document.getElementById(
    "salvar"
  );

const abrirCaixaBtn =
  document.getElementById(
    "abrirCaixa"
  );


/* =====================================================
   STATUS
===================================================== */

function status(
  mensagem,
  erro = false
){

  statusEl.style.display =
    "block";

  statusEl.className =
    erro
      ? "status error"
      : "status";

  statusEl.textContent =
    mensagem;

}


/* =====================================================
   CARREGAR MAQUININHA
===================================================== */

async function carregar(){

  if(!MAQUININHA_ID){

    nomeMaquininha.textContent =
      "Maquininha não informada";

    status(
      "ID da maquininha não informado.",
      true
    );

    return;
  }


  maquininhaIdTexto.textContent =
    MAQUININHA_ID;


  const {
    data,
    error
  } =
    await supabase

      .from("maquininhas")

      .select(`
        id,
        app_id,
        nome,
        descricao,
        mercado_pago_token,
        ativo
      `)

      .eq(
        "id",
        MAQUININHA_ID
      )

      .maybeSingle();


  if(error){

    console.error(
      "ERRO CARREGAR:",
      error
    );

    status(
      "Erro ao carregar maquininha: "
      + error.message,
      true
    );

    return;
  }


  if(!data){

    nomeMaquininha.textContent =
      "Maquininha não encontrada";

    status(
      "Maquininha não encontrada.",
      true
    );

    return;
  }


  /* ================================================
     DADOS DA MAQUININHA
  ================================================ */

  nomeMaquininha.textContent =
    data.nome ||
    "FF Maquininha";


  nomeEl.value =
    data.nome ||
    "";


  descricaoEl.value =
    data.descricao ||
    "";


  appIdTexto.textContent =
    data.app_id ||
    "Não vinculado";


  /*
   * NUNCA MOSTRA O TOKEN EXISTENTE
   */

  tokenEl.value = "";


  /*
   * Se estiver desativada
   */

  if(data.ativo === false){

    status(
      "⚠️ Esta maquininha está desativada.",
      true
    );

  }

}


/* =====================================================
   SALVAR
===================================================== */

async function salvar(){

  if(!MAQUININHA_ID){

    status(
      "ID da maquininha não informado.",
      true
    );

    return;
  }

  const nome =
    nomeEl.value.trim();

  const descricao =
    descricaoEl.value.trim();

  const token =
    tokenEl.value.trim();

  if(!nome){

    status(
      "Informe o nome da maquininha.",
      true
    );

    nomeEl.focus();

    return;
  }

  salvarBtn.disabled = true;
  salvarBtn.textContent = "SALVANDO...";

  try{

    const resposta =
      await fetch(
        `${SUPABASE_URL}/functions/v1/editar-maquininha`,
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_ANON_KEY
          },

          body: JSON.stringify({

            id:
              MAQUININHA_ID,

            nome:
              nome,

            descricao:
              descricao,

            ativo:
              true,

            mercado_pago_token:
              token

          })
        }
      );

    const resultado =
      await resposta.json();

    console.log(
      "RESPOSTA EDITAR MAQUININHA:",
      resultado
    );

    if(
      !resposta.ok ||
      !resultado.success
    ){

      throw new Error(
        resultado.error ||
        "Erro ao salvar configuração."
      );

    }

    nomeMaquininha.textContent =
      nome;

    tokenEl.value = "";

    status(
      token
        ? "✅ Configuração e Access Token salvos com sucesso."
        : "✅ Configuração salva com sucesso."
    );

  }catch(error){

    console.error(
      "ERRO SALVAR:",
      error
    );

    status(
      "Erro ao salvar: " +
      error.message,
      true
    );

  }finally{

    salvarBtn.disabled =
      false;

    salvarBtn.textContent =
      "💾 SALVAR CONFIGURAÇÃO";

  }

}


/* =====================================================
   ABRIR CAIXA
===================================================== */

abrirCaixaBtn
.addEventListener(
  "click",
  () => {

    if(!MAQUININHA_ID){

      status(
        "ID da maquininha não informado.",
        true
      );

      return;
    }


    location.href =
      "/maquininha/index.html?maquininha_id="
      +
      encodeURIComponent(
        MAQUININHA_ID
      );

  }
);


/* =====================================================
   SALVAR
===================================================== */

salvarBtn
.addEventListener(
  "click",
  salvar
);


/* =====================================================
   INICIAR
===================================================== */

carregar();

</script>

</body>
</html>
