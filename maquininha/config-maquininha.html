<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FF Maquininha - Configuração</title>

<style>
*{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  background:#f3f4f6;
  color:#101828;
}

.wrap{
  max-width:520px;
  margin:auto;
  padding:20px;
}

.card{
  background:#fff;
  border-radius:22px;
  padding:22px;
  box-shadow:0 8px 30px rgba(0,0,0,.08);
}

.logo{
  text-align:center;
  font-size:42px;
}

h1{
  text-align:center;
  margin:8px 0 5px;
  font-size:23px;
}

.sub{
  text-align:center;
  color:#667085;
  font-size:14px;
  margin-bottom:22px;
}

label{
  display:block;
  font-size:14px;
  font-weight:700;
  margin:15px 0 7px;
}

input{
  width:100%;
  height:50px;
  border:1px solid #d0d5dd;
  border-radius:12px;
  padding:0 13px;
  font-size:16px;
  outline:none;
}

input:focus{
  border-color:#08749a;
  box-shadow:0 0 0 3px rgba(8,116,154,.12);
}

button{
  width:100%;
  min-height:52px;
  border:0;
  border-radius:13px;
  font-size:16px;
  font-weight:750;
  cursor:pointer;
  margin-top:18px;
}

.primary{
  background:#08749a;
  color:#fff;
}

.secondary{
  background:#eaf2ff;
  color:#175cd3;
}

.info{
  margin-top:18px;
  background:#f9fafb;
  border-radius:15px;
  padding:15px;
  font-size:14px;
  line-height:1.5;
  color:#475467;
}

.status{
  margin-top:14px;
  padding:12px;
  border-radius:12px;
  background:#ecfdf3;
  color:#027a48;
  font-size:14px;
  text-align:center;
  display:none;
}

.error{
  background:#fef3f2;
  color:#b42318;
}

.maquina{
  margin-top:20px;
  background:#f8fafc;
  border:1px solid #e4e7ec;
  border-radius:15px;
  padding:15px;
}

.maquina h3{
  margin:0 0 8px;
}

.small{
  color:#667085;
  font-size:13px;
  word-break:break-all;
}
</style>
</head>

<body>

<div class="wrap">

  <div class="card">

    <div class="logo">⚙️</div>

    <h1>FF MAQUININHA</h1>

    <div class="sub">
      Configuração da conta Mercado Pago
    </div>

    <div class="maquina">
      <h3 id="nomeMaquininha">
        Carregando...
      </h3>

      <div class="small">
        APP ID:
        <span id="appIdTexto">---</span>
      </div>
    </div>

    <label for="nome">
      Nome da maquininha
    </label>

    <input
      id="nome"
      placeholder="Ex: FF Maquininha"
    >

    <label for="descricao">
      Descrição
    </label>

    <input
      id="descricao"
      placeholder="Ex: Maquininha principal"
    >

    <label for="token">
      Mercado Pago Access Token
    </label>

    <input
      id="token"
      type="password"
      placeholder="Cole aqui o Access Token"
    >

    <button
      class="primary"
      id="salvar"
    >
      💾 SALVAR CONFIGURAÇÃO
    </button>

    <button
      class="secondary"
      id="abrirCaixa"
    >
      💰 ABRIR MAQUININHA
    </button>

    <div
      id="status"
      class="status"
    ></div>

    <div class="info">
      <b>Importante</b><br><br>

      Este Access Token pertence somente a esta
      maquininha.

      <br><br>

      Ele será salvo em:

      <br>

      <b>maquininhas.mercado_pago_token</b>

      <br><br>

      Ele não altera o token do Hotspot.
    </div>

  </div>

</div>

<script type="module">

import { createClient } from
"https://esm.sh/@supabase/supabase-js@2";

const SUPABASE_URL =
"https://auzdqapjetmhaokoynzo.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_36kXlyuKU8RMfgSx01h5mw_lOLp1lbX";

const supabase =
createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

const params =
new URLSearchParams(location.search);

const APP_ID =
params.get("app_id");

const nomeEl =
document.getElementById("nome");

const descricaoEl =
document.getElementById("descricao");

const tokenEl =
document.getElementById("token");

const nomeMaquininha =
document.getElementById("nomeMaquininha");

const appIdTexto =
document.getElementById("appIdTexto");

const statusEl =
document.getElementById("status");

function status(msg, erro=false){

  statusEl.style.display="block";

  statusEl.className =
    erro
    ? "status error"
    : "status";

  statusEl.textContent = msg;
}


async function carregar(){

  if(!APP_ID){

    status(
      "APP ID da maquininha não informado.",
      true
    );

    return;
  }

  appIdTexto.textContent =
    APP_ID;

  const {data,error} =
    await supabase
      .from("maquininhas")
      .select(`
        id,
        app_id,
        nome,
        descricao,
        mercado_pago_token,
        ativo
      `)
      .eq("app_id", APP_ID)
      .maybeSingle();

  if(error){

    console.error(error);

    status(
      "Erro ao carregar maquininha: "
      + error.message,
      true
    );

    return;
  }

  if(!data){

    status(
      "Maquininha não encontrada.",
      true
    );

    return;
  }

  nomeMaquininha.textContent =
    data.nome || "FF Maquininha";

  nomeEl.value =
    data.nome || "";

  descricaoEl.value =
    data.descricao || "";

  /*
   * Por segurança não mostramos o token
   * existente dentro do campo.
   */

  tokenEl.value = "";

}


async function salvar(){

  if(!APP_ID){

    status(
      "APP ID não informado.",
      true
    );

    return;
  }

  const nome =
    nomeEl.value.trim();

  const descricao =
    descricaoEl.value.trim();

  const token =
    tokenEl.value.trim();

  if(!nome){

    status(
      "Informe o nome da maquininha.",
      true
    );

    return;
  }

  /*
   * Se o usuário não digitar token,
   * mantém o token atual.
   */

  const dados = {
    nome,
    descricao,
    ativo:true,
    atualizado_em:
      new Date().toISOString()
  };

  if(token){

    dados.mercado_pago_token =
      token;

  }

  const {error} =
    await supabase
      .from("maquininhas")
      .update(dados)
      .eq("app_id", APP_ID);

  if(error){

    console.error(error);

    status(
      "Erro ao salvar: "
      + error.message,
      true
    );

    return;
  }

  tokenEl.value="";

  status(
    "✅ Configuração salva com sucesso."
  );

}


document
.getElementById("salvar")
.addEventListener(
  "click",
  salvar
);


document
.getElementById("abrirCaixa")
.addEventListener(
  "click",
  ()=>{
    location.href =
      "/caixa.html?maquininha_id="
      + encodeURIComponent(
        APP_ID
      );
  }
);


carregar();

</script>

</body>
</html>
