<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>FF Maquininha</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box
}

body{
  margin:0;
  background:#f4f5f7;
  font-family:Arial,sans-serif;
  color:#171717
}

.app{
  max-width:480px;
  margin:auto;
  min-height:100vh;
  background:#fff;
  padding:18px
}

h1{
  text-align:center;
  margin:4px 0 2px;
  font-size:25px
}

.maquina{
  text-align:center;
  color:#666;
  font-size:13px;
  margin-bottom:15px
}

/* ================================
   VALOR / CALCULADORA / PARCIAL
================================ */
.valor-card,
.partial-card,
.calc-card{
  background:#f7f7f8;
  border:1px solid #e3e3e3;
  border-radius:16px;
  padding:14px;
  margin-bottom:12px
}

.card-title{
  font-size:16px;
  font-weight:bold;
  margin-bottom:8px
}

.valor-input{
  width:100%;
  padding:15px;
  border:1px solid #ccc;
  border-radius:12px;
  font-size:24px;
  font-weight:bold;
  text-align:right;
  background:#fff
}

.hint{
  color:#777;
  font-size:12px;
  margin-top:7px
}

.partial-toggle{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:bold;
  font-size:15px;
  cursor:pointer
}

.partial-toggle input{
  width:20px;
  height:20px
}

.partial-fields{
  display:none;
  margin-top:12px;
  gap:9px
}

.partial-fields.show{
  display:grid
}

.partial-label{
  font-size:12px;
  color:#666;
  margin-bottom:4px
}

.partial-input{
  width:100%;
  padding:12px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:18px;
  font-weight:bold;
  background:#fff
}

.calc-toggle{
  width:100%;
  padding:13px;
  font-size:16px;
  background:#e9e9e9
}

.calc-body{
  display:none;
  margin-top:12px
}

.calc-body.show{
  display:block
}

.display{
  background:#111;
  color:#fff;
  border-radius:18px;
  padding:18px;
  text-align:right;
  min-height:105px
}

.expr{
  font-size:18px;
  color:#aaa;
  min-height:25px;
  word-break:break-all
}

.total{
  font-size:38px;
  font-weight:bold;
  margin-top:5px
}

.desc{
  width:100%;
  margin:12px 0;
  padding:14px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:16px
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px
}

button{
  border:0;
  border-radius:14px;
  padding:19px 8px;
  font-size:21px;
  font-weight:bold;
  background:#eee;
  cursor:pointer
}

button:active{
  transform:scale(.97)
}

button:disabled{
  opacity:.55;
  cursor:not-allowed
}

.op{
  background:#ddd
}

.clear{
  background:#ffdcdc
}

.equal{
  background:#d8e8ff
}

.pix{
  margin-top:15px;
  padding:16px;
  border-radius:16px;
  background:#f5f5f5;
  display:none
}

.pix h2{
  margin:0 0 10px;
  font-size:19px
}

.qr{
  display:block;
  width:230px;
  height:230px;
  margin:10px auto;
  object-fit:contain
}

.copia{
  width:100%;
  padding:11px;
  border:1px solid #ccc;
  border-radius:10px;
  background:#fff;
  word-break:break-all;
  font-size:12px
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:10px
}

.action{
  font-size:16px;
  padding:14px;
  background:#e9e9e9
}

.new{
  background:#111;
  color:#fff;
  width:100%;
  margin-top:10px
}

.status{
  text-align:center;
  font-weight:bold;
  margin:12px 0
}

.ok{
  color:#148a3b
}

.wait{
  color:#b36b00
}

.err{
  color:#c62828
}

.small{
  text-align:center;
  color:#777;
  font-size:12px;
  margin-top:12px
}
</style>

<style id="conta-parcial-css">
.conta-card{
  margin-top:14px;
  padding:15px;
  border:1px solid #e2e2e2;
  border-radius:16px;
  background:#fafafa;
}
.conta-head{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
  font-weight:bold;
}
.conta-row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-top:8px;
  color:#555;
}
.conta-row strong{color:#171717}
.restante{
  font-size:20px;
  font-weight:bold;
  margin-top:10px;
}
.parcial-toggle{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:14px;
  padding:12px;
  border-radius:12px;
  background:#fff;
  border:1px solid #ddd;
  font-weight:bold;
}
.parcial-toggle input{
  width:20px;
  height:20px;
}
.parcial-box{
  display:none;
  margin-top:12px;
  padding:13px;
  border-radius:12px;
  background:#fff;
  border:1px solid #ddd;
}
.parcial-box.show{display:block}
.valor-parcial{
  width:100%;
  padding:14px;
  border:1px solid #ccc;
  border-radius:12px;
  font-size:20px;
  font-weight:bold;
  margin-top:8px;
}
.btn-parcial{
  width:100%;
  margin-top:10px;
  background:#111;
  color:#fff;
}
.conta-fechada{
  margin-top:12px;
  padding:14px;
  border-radius:12px;
  background:#e9f8ee;
  color:#148a3b;
  font-weight:bold;
  text-align:center;
  display:none;
}
.btn-calculadora{
  width:100%;
  margin-top:10px;
  background:#eee;
  font-size:16px;
  padding:13px;
}
.calculadora-area{display:none}
.calculadora-area.show{display:block}
.conta-hint{
  color:#777;
  font-size:12px;
  margin-top:6px;
}
</style>

</head>

<body>

<div class="app">

  <h1>FF MAQUININHA</h1>

  <div class="maquina" id="maquinaNome">
    Carregando...
  </div>

  <div class="valor-card">
    <div class="card-title">💰 Valor da cobrança</div>

    <input
      id="valorDireto"
      class="valor-input"
      inputmode="decimal"
      autocomplete="off"
      placeholder="R$ 0,00"
      oninput="valorDiretoAlterado()"
    >

    <div class="hint">
      Se já souber o valor, digite aqui. Se precisar somar valores, abra a calculadora.
    </div>

    <label class="partial-toggle" style="margin-top:12px">
      <input
        type="checkbox"
        id="pagamentoParcial"
        onchange="alternarParcial()"
      >
      Pagamento parcial
    </label>

    <div id="partialFields" class="partial-fields">
      <div>
        <div class="partial-label">Valor total da venda</div>
        <input
          id="valorTotal"
          class="partial-input"
          inputmode="decimal"
          placeholder="R$ 0,00"
        >
      </div>

      <div>
        <div class="partial-label">Valor pago agora</div>
        <input
          id="valorParcial"
          class="partial-input"
          inputmode="decimal"
          placeholder="R$ 0,00"
          oninput="valorParcialAlterado()"
        >
      </div>
    </div>
  </div>

  <div class="calc-card">
    <button
      type="button"
      class="calc-toggle"
      id="calcToggle"
      onclick="toggleCalculadora()"
    >
      🧮 ABRIR CALCULADORA
    </button>

    <div id="calcBody" class="calc-body">
      <div class="display">
        <div class="expr" id="expr"></div>
        <div class="total" id="total">R$ 0,00</div>
      </div>

      <div class="grid" style="margin-top:12px">
        <button onclick="dig('7')">7</button>
        <button onclick="dig('8')">8</button>
        <button onclick="dig('9')">9</button>
        <button class="op" onclick="oper('/')">÷</button>

        <button onclick="dig('4')">4</button>
        <button onclick="dig('5')">5</button>
        <button onclick="dig('6')">6</button>
        <button class="op" onclick="oper('*')">×</button>

        <button onclick="dig('1')">1</button>
        <button onclick="dig('2')">2</button>
        <button onclick="dig('3')">3</button>
        <button class="op" onclick="oper('-')">−</button>

        <button class="clear" onclick="limpar()">C</button>
        <button onclick="dig('0')">0</button>
        <button onclick="dig(',')">,</button>
        <button class="op" onclick="oper('+')">+</button>

        <button onclick="backspace()">⌫</button>

        <button
          class="equal"
          style="grid-column:span 3"
          onclick="igual()"
        >=</button>
      </div>
    </div>
  </div>

  <input
    id="descricao"
    class="desc"
    placeholder="Descrição da cobrança (opcional)"
    maxlength="120"
  >

  <button
    class="new"
    id="gerarBtn"
    onclick="gerarPix()"
  >
    GERAR PIX DA CONTA — R$ 0,00
  </button>

  <div id="status" class="status"></div>

  <div class="pix" id="pixBox">

    <h2>PIX — aguardando pagamento</h2>

    <img
      id="qr"
      class="qr"
      alt="QR Code PIX"
    >

    <div
      id="copia"
      class="copia"
    ></div>

    <div class="actions">

      <button
        class="action"
        onclick="copiarPix()"
      >
        COPIAR PIX
      </button>

      <button
        class="action"
        onclick="verificarAgora()"
      >
        VERIFICAR
      </button>

    </div>

  </div>

  <button
    class="new"
    onclick="novaCobranca()"
  >
    NOVA COBRANÇA
  </button>

  <div class="small">
    Pagamento PIX independente do Hotspot.
  </div>

</div>

<script>

const SUPABASE_URL =
  "https://auzdqapjetmhaokoynzo.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_36kXlyuKU8RMfgSx01h5mw_lOLp1lbX";

const sb =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


// =====================================================
// MAQUININHA
// =====================================================

const params =
  new URLSearchParams(location.search);

const MAQUININHA_ID =
  params.get("maquininha_id");


// =====================================================
// VARIÁVEIS
// =====================================================

let expr = "";
let current = "";
let paymentId = null;
let poll = null;

let contaTotal = 0;
let totalPago = 0;
let pagamentoAtual = 0;
let modoParcial = false;
let descricaoBase = "";
let calculadoraAberta = false;


// =====================================================
// HELPERS
// =====================================================

const $ = id =>
  document.getElementById(id);

const money = n =>
  Number(n || 0).toLocaleString(
    "pt-BR",
    {
      style:"currency",
      currency:"BRL"
    }
  );


// =====================================================
// VALOR DIRETO / PAGAMENTO PARCIAL
// =====================================================

function numeroValor(v){
  if(v === null || v === undefined) return 0;

  let s = String(v).trim();

  if(!s) return 0;

  s = s.replace(/R\$/gi, "").replace(/\s/g, "");

  // Aceita 1.234,56 e 1234,56
  if(s.includes(",") && s.includes(".")){
    s = s.replace(/\./g, "").replace(",", ".");
  }else{
    s = s.replace(",", ".");
  }

  const n = Number(s);
  return Number.isFinite(n) ? n : 0;
}

function valorDaCobranca(){
  // PAGAMENTO PARCIAL É TOTALMENTE INDEPENDENTE DA CALCULADORA.
  // Quando estiver ativo, somente "Valor pago agora" pode virar o PIX.
  if($("pagamentoParcial").checked){
    return numeroValor($("valorParcial").value);
  }

  const direto =
    numeroValor($("valorDireto").value);

  if(direto > 0){
    return direto;
  }

  try{
    return Number(calcular()) || 0;
  }catch(e){
    return 0;
  }
}

function atualizarBotaoGerar(){
  const valor = valorDaCobranca();

  $("gerarBtn").textContent =
    "GERAR PIX — " + money(valor);
}

function valorDiretoAlterado(){
  // No modo parcial este campo não participa da cobrança.
  if($("pagamentoParcial").checked){
    return;
  }

  if($("valorDireto").value){
    expr = "";
    current = "";
  }

  atualizarBotaoGerar();
}

function valorParcialAlterado(){
  // Valor parcial nunca pega resultado da calculadora.
  // O operador sempre digita o valor pago agora manualmente.
  atualizarBotaoGerar();
}

function alternarParcial(){
  const ativo =
    $("pagamentoParcial").checked;

  $("partialFields")
    .classList.toggle("show", ativo);

  if(ativo){
    // Limpa qualquer valor da cobrança direta e qualquer cálculo anterior.
    $("valorDireto").value = "";
    expr = "";
    current = "";

    // A calculadora fica fora do fluxo de pagamento parcial.
    calculadoraAberta = false;
    $("calcBody").classList.remove("show");
    $("calcToggle").textContent = "🧮 CALCULADORA (não usada no parcial)";
  }else{
    $("calcToggle").textContent = "🧮 ABRIR CALCULADORA";
  }

  atualizarBotaoGerar();
}

function toggleCalculadora(){
  // Nunca abrir/usuar a calculadora durante pagamento parcial.
  if($("pagamentoParcial").checked){
    return;
  }

  calculadoraAberta =
    !calculadoraAberta;

  $("calcBody")
    .classList.toggle("show", calculadoraAberta);

  $("calcToggle").textContent =
    calculadoraAberta
      ? "🧮 FECHAR CALCULADORA"
      : "🧮 ABRIR CALCULADORA";
}

// =====================================================
// RENDER
// =====================================================

function render(){

  let v = 0;

  try{
    v = Number(calcular());
  }catch(e){
    v = Number(current.replace(",", ".")) || 0;
  }

  if(!Number.isFinite(v)) v = 0;

  if(!modoParcial && v > 0){
    contaTotal = v;
  }

  if(contaTotal < 0) contaTotal = 0;
  if(totalPago < 0) totalPago = 0;
  if(totalPago > contaTotal) totalPago = contaTotal;

  const restante = Math.max(0, contaTotal - totalPago);

  $("total").textContent = money(v);
  $("gerarBtn").textContent =
    "GERAR PIX DA CONTA — " + money(contaTotal);

  const totalEl = $("contaTotal");
  const pagoEl = $("contaPago");
  const restanteEl = $("contaRestante");

  if(totalEl) totalEl.textContent = money(contaTotal);
  if(pagoEl) pagoEl.textContent = money(totalPago);
  if(restanteEl) restanteEl.textContent = money(restante);

  const parcialBtn = $("gerarParcialBtn");
  if(parcialBtn){
    const parcial = parseValor($("valorParcial")?.value);
    parcialBtn.textContent =
      "GERAR PIX — " + money(parcial);
    parcialBtn.disabled =
      restante <= 0 || !Number.isFinite(parcial) || parcial <= 0 || parcial > restante;
  }

  const fechada = $("contaFechada");
  if(fechada){
    fechada.style.display =
      contaTotal > 0 && restante <= 0 ? "block" : "none";
  }
}


function parseValor(v){
  if(v === null || v === undefined) return 0;
  let s = String(v).trim().replace(/[R$\s]/g,"");
  if(!s) return 0;

  if(s.includes(",")){
    s = s.replace(/\./g,"").replace(",",".");
  }else{
    s = s.replace(/,/g,"");
  }

  const n = Number(s);
  return Number.isFinite(n) ? n : 0;
}

function formatarInputMoeda(input){
  if(!input) return;
  let n = parseValor(input.value);
  if(!n){
    input.value = "";
    renderConta();
    return;
  }
  input.value = n.toLocaleString("pt-BR",{
    minimumFractionDigits:2,
    maximumFractionDigits:2
  });
  renderConta();
}

function alternarCalculadora(){
  const area = $("calculadoraArea");
  if(!area) return;
  area.classList.toggle("show");
  if(area.classList.contains("show")){
    $("abrirCalcBtn").textContent = "🧮 FECHAR CALCULADORA";
  }else{
    $("abrirCalcBtn").textContent = "🧮 ABRIR CALCULADORA";
  }
}

function alternarParcial(){
  modoParcial = $("modoParcial")?.checked === true;
  const box = $("parcialBox");
  if(box) box.classList.toggle("show", modoParcial);

  if(modoParcial){
    // The calculated/typed amount remains the account total.
    // Only the "Valor que vai pagar agora" field controls the partial PIX.
    $("valorParcial").value = "";
    $("status").textContent = "";
    $("status").className = "status";
  }else{
    $("valorParcial").value = "";
  }

  renderConta();
}

function renderConta(){
  render();
}


// =====================================================
// DIGITAR
// =====================================================

function dig(v){

  if(
    v === "," &&
    current.includes(",")
  ){
    return;
  }

  if(
    v === "," &&
    !current
  ){
    current = "0";
  }

  current += v;

  render();
}


// =====================================================
// OPERADOR
// =====================================================

function oper(op){

  if(!current && !expr){
    return;
  }

  if(current){

    expr += current;

    current = "";
  }

  if(/[+\-*\/]$/.test(expr)){

    expr =
      expr.slice(0,-1);
  }

  expr += op;

  render();
}


// =====================================================
// IGUAL
// =====================================================

function igual(){

  if(current){
    expr += current;
  }

  if(!expr){
    return;
  }

  try{

    const v =
      calcular();

    current =
      String(
        v.toFixed(2)
      ).replace(".", ",");

    expr = "";

    if(!$("pagamentoParcial").checked){
      $("valorDireto").value =
        current.replace(".", ",");
    }

    render();

  }catch(e){

    $("status").textContent =
      "Expressão inválida.";

    $("status").className =
      "status err";
  }
}


// =====================================================
// CALCULAR
// =====================================================

function calcular(){

  let s =
    (expr + current)
      .replace(/,/g, ".")
      .replace(/×/g, "*")
      .replace(/÷/g, "/");

  if(!s){
    return 0;
  }

  if(
    !/^[0-9+\-*/. ()]+$/.test(s)
  ){
    throw new Error("inválida");
  }

  return Function(
    '"use strict";return (' +
    s +
    ')'
  )();
}


// =====================================================
// LIMPAR
// =====================================================

function limpar(){

  expr = "";
  current = "";

  $("status").textContent = "";

  $("status").className =
    "status";

  render();
}


// =====================================================
// BACKSPACE
// =====================================================

function backspace(){

  if(current){

    current =
      current.slice(0,-1);

  }else{

    expr =
      expr.slice(0,-1);
  }

  render();
}


// =====================================================
// CARREGAR MAQUININHA
// =====================================================

async function carregarMaquininha(){

  if(!MAQUININHA_ID){

    $("maquinaNome").textContent =
      "ERRO: maquininha_id não informado";

    $("gerarBtn").disabled =
      true;

    return;
  }

  const {
    data,
    error
  } =
    await sb
      .from("maquininhas")
      .select("nome,ativo")
      .eq("id", MAQUININHA_ID)
      .maybeSingle();

  if(error || !data){

    console.error(
      "ERRO MAQUININHA:",
      error
    );

    $("maquinaNome").textContent =
      "Maquininha não encontrada";

    $("gerarBtn").disabled =
      true;

    return;
  }

  if(!data.ativo){

    $("maquinaNome").textContent =
      "Maquininha desativada";

    $("gerarBtn").disabled =
      true;

    return;
  }

  $("maquinaNome").textContent =
    data.nome;
}


// =====================================================
// GERAR PIX
// =====================================================

async function gerarPix(){

  // Normal PIX = the complete account total.
  if(modoParcial){
    return gerarPagamentoParcial();
  }

  let valor = 0;

  try{
    valor = Number(calcular());
  }catch(e){
    valor = Number(current.replace(",", ".")) || 0;
  }

  if(!Number.isFinite(valor) || valor <= 0){
    alert("Digite ou calcule um valor válido.");
    return;
  }

  contaTotal = valor;

  if(totalPago >= contaTotal){
    alert("Essa conta já está paga.");
    return;
  }

  pagamentoAtual = contaTotal - totalPago;

  await criarPix(pagamentoAtual, "total");
}


async function gerarPagamentoParcial(){

  const restante = Math.max(0, contaTotal - totalPago);
  const valor = parseValor($("valorParcial")?.value);

  if(contaTotal <= 0){
    alert("Primeiro informe ou calcule o valor total da conta.");
    return;
  }

  if(restante <= 0){
    alert("Essa conta já está totalmente paga.");
    return;
  }

  if(!Number.isFinite(valor) || valor <= 0){
    alert("Informe quanto o cliente vai pagar agora.");
    return;
  }

  if(valor > restante){
    alert("O pagamento não pode ser maior que o valor restante.");
    return;
  }

  pagamentoAtual = valor;
  await criarPix(valor, "parcial");
}

async function criarPix(valor, tipo){

  if(!MAQUININHA_ID){
    $("status").textContent = "Maquininha não identificada.";
    $("status").className = "status err";
    return;
  }

  $("gerarBtn").disabled = true;
  const parcialBtn = $("gerarParcialBtn");
  if(parcialBtn) parcialBtn.disabled = true;

  $("status").textContent =
    "Gerando PIX de " + money(valor) + "...";
  $("status").className = "status wait";
  $("pixBox").style.display = "none";

  const descricaoDigitada = $("descricao").value.trim();
  let descricao = descricaoDigitada;

  if(!descricao){
    if(tipo === "parcial"){
      descricao =
        `Pagamento parcial — ${money(valor)} de ${money(contaTotal)}`;
    }else{
      descricao = `Pagamento da conta — ${money(valor)}`;
    }
  }

  try{

    const r = await fetch(
      `${SUPABASE_URL}/functions/v1/gerar-pix-caixa`,
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          "apikey":SUPABASE_ANON_KEY,
          "Authorization":`Bearer ${SUPABASE_ANON_KEY}`
        },
        body:JSON.stringify({
          maquininha_id:MAQUININHA_ID,
          valor:Number(valor.toFixed(2)),
          descricao
        })
      }
    );

    const texto = await r.text();
    let d = {};

    try{
      d = JSON.parse(texto);
    }catch(e){
      console.error("RESPOSTA NÃO JSON:", texto);
    }

    if(!r.ok || !d.success){
      console.error("ERRO GERAR PIX:", d);
      $("status").textContent =
        d.error || "Erro ao gerar PIX.";
      $("status").className = "status err";
      $("gerarBtn").disabled = false;
      renderConta();
      return;
    }

    paymentId = d.payment_id;

    if(d.qr_code_base64){
      $("qr").src =
        "data:image/png;base64," + d.qr_code_base64;
    }else{
      $("qr").src = "";
    }

    $("copia").textContent = d.qr_code || "";
    $("pixBox").style.display = "block";

    $("status").textContent =
      "Aguardando pagamento de " + money(valor) + "...";
    $("status").className = "status wait";

    iniciarPolling();

  }catch(error){

    console.error("ERRO DE CONEXÃO:", error);

    $("status").textContent =
      error?.message ||
      "Erro de conexão ao gerar PIX.";

    $("status").className = "status err";
    $("gerarBtn").disabled = false;
    renderConta();
  }
}


// =====================================================
// POLLING
// =====================================================

function iniciarPolling(){

  clearInterval(poll);

  verificarAgora();

  poll =
    setInterval(
      verificarAgora,
      4000
    );
}


// =====================================================
// VERIFICAR PAGAMENTO
// =====================================================

async function verificarAgora(){

  if(!paymentId){
    return;
  }

  const {
    data,
    error
  } =
    await sb
      .from("maquininha_pagamentos")
      .select(
        "status,payment_status"
      )
      .eq(
        "payment_id",
        String(paymentId)
      )
      .maybeSingle();

  if(error){

    console.error(
      "ERRO AO VERIFICAR:",
      error
    );

    return;
  }

  const st =
    String(
      data?.status ||
      data?.payment_status ||
      ""
    ).toLowerCase();


  if(
    st === "approved"
  ){

    clearInterval(poll);

    totalPago = Math.min(
      contaTotal,
      totalPago + pagamentoAtual
    );

    const restante = Math.max(
      0,
      contaTotal - totalPago
    );

    $("status").textContent =
      restante <= 0
        ? "PAGAMENTO APROVADO ✓ — CONTA PAGA"
        : "PAGAMENTO APROVADO ✓ — RESTANTE " + money(restante);

    $("status").className = "status ok";

    paymentId = null;
    pagamentoAtual = 0;

    $("pixBox").style.display = "none";
    $("gerarBtn").disabled = false;

    if($("valorParcial")){
      $("valorParcial").value = "";
    }

    // If the account still has a balance, keep the partial mode ready
    // for the next PIX. The total remains unchanged.
    if(restante > 0){
      $("modoParcial").checked = true;
      modoParcial = true;
      $("parcialBox").classList.add("show");
    }else{
      $("modoParcial").checked = false;
      modoParcial = false;
      $("parcialBox").classList.remove("show");
    }

    renderConta();
  }
}


// =====================================================
// COPIAR PIX
// =====================================================

async function copiarPix(){

  const t =
    $("copia").textContent;

  if(!t){
    return;
  }

  try{

    await navigator.clipboard.writeText(t);

    $("status").textContent =
      "PIX copiado.";

    $("status").className =
      "status ok";

  }catch(e){

    alert(
      "Não foi possível copiar automaticamente."
    );
  }
}


// =====================================================
// NOVA COBRANÇA
// =====================================================

function novaCobranca(){

  clearInterval(poll);

  paymentId = null;

  expr = "";

  current = "";

  $("descricao").value = "";
  $("valorDireto").value = "";
  $("valorTotal").value = "";
  $("valorParcial").value = "";
  $("pagamentoParcial").checked = false;
  $("partialFields").classList.remove("show");

  expr = "";
  current = "";

  $("pixBox").style.display =
    "none";

  $("status").textContent =
    "";

  $("status").className =
    "status";

  $("gerarBtn").disabled = false;

  renderConta();
}


// =====================================================
// INICIAR
// =====================================================

carregarMaquininha();

render();

</script>
