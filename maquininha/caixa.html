<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>FF Maquininha</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box
}

body{
  margin:0;
  background:#f4f5f7;
  font-family:Arial,sans-serif;
  color:#171717
}

.app{
  max-width:480px;
  margin:auto;
  min-height:100vh;
  background:#fff;
  padding:18px
}

h1{
  text-align:center;
  margin:4px 0 2px;
  font-size:25px
}

.maquina{
  text-align:center;
  color:#666;
  font-size:13px;
  margin-bottom:15px
}

.display{
  background:#111;
  color:#fff;
  border-radius:18px;
  padding:18px;
  text-align:right;
  min-height:105px
}

.expr{
  font-size:18px;
  color:#aaa;
  min-height:25px;
  word-break:break-all
}

.total{
  font-size:38px;
  font-weight:bold;
  margin-top:5px
}

.desc{
  width:100%;
  margin:12px 0;
  padding:14px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:16px
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px
}

button{
  border:0;
  border-radius:14px;
  padding:19px 8px;
  font-size:21px;
  font-weight:bold;
  background:#eee;
  cursor:pointer
}

button:active{
  transform:scale(.97)
}

button:disabled{
  opacity:.55;
  cursor:not-allowed
}

.op{
  background:#ddd
}

.clear{
  background:#ffdcdc
}

.equal{
  background:#d8e8ff
}

.pix{
  margin-top:15px;
  padding:16px;
  border-radius:16px;
  background:#f5f5f5;
  display:none
}

.pix h2{
  margin:0 0 10px;
  font-size:19px
}

.qr{
  display:block;
  width:230px;
  height:230px;
  margin:10px auto;
  object-fit:contain
}

.copia{
  width:100%;
  padding:11px;
  border:1px solid #ccc;
  border-radius:10px;
  background:#fff;
  word-break:break-all;
  font-size:12px
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:10px
}

.action{
  font-size:16px;
  padding:14px;
  background:#e9e9e9
}

.new{
  background:#111;
  color:#fff;
  width:100%;
  margin-top:10px
}

.status{
  text-align:center;
  font-weight:bold;
  margin:12px 0
}

.ok{
  color:#148a3b
}

.wait{
  color:#b36b00
}

.err{
  color:#c62828
}

.small{
  text-align:center;
  color:#777;
  font-size:12px;
  margin-top:12px
}

.conta-card{
  margin-top:14px;
  padding:15px;
  border:1px solid #ddd;
  border-radius:16px;
  background:#fafafa;
}
.conta-total-label{
  text-align:center;
  font-size:12px;
  color:#777;
  font-weight:bold;
}
.conta-total{
  text-align:center;
  font-size:30px;
  font-weight:bold;
  margin-top:3px;
}
.parcial-check{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:14px;
  padding:12px;
  background:#fff;
  border:1px solid #ddd;
  border-radius:12px;
  font-weight:bold;
}
.parcial-check input{
  width:20px;
  height:20px;
}
.parcial-area{
  display:none;
  margin-top:12px;
}
.parcial-area.show{
  display:block;
}
.parcial-info{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:7px;
}
.parcial-info > div{
  padding:9px;
  border-radius:10px;
  background:#fff;
  border:1px solid #eee;
}
.parcial-info span{
  display:block;
  font-size:11px;
  color:#777;
}
.parcial-info strong{
  display:block;
  margin-top:3px;
  font-size:15px;
}
.parcial-label{
  display:block;
  margin-top:12px;
  font-size:13px;
  font-weight:bold;
}
.valor-parcial{
  width:100%;
  margin-top:6px;
  padding:14px;
  border:1px solid #ccc;
  border-radius:12px;
  font-size:20px;
  font-weight:bold;
}
.parcial-btn{
  width:100%;
  margin-top:9px;
  background:#111;
  color:#fff;
}
.calc-card{
  margin-top:14px;
  padding:12px;
  border:1px solid #ddd;
  border-radius:16px;
  background:#fafafa;
}
.calc-title{
  text-align:center;
  font-size:13px;
  font-weight:bold;
  color:#666;
  margin-bottom:10px;
}
.calc-total-hint{
  text-align:center;
  font-size:13px;
  color:#777;
  margin-top:7px;
}


.valor-digitado{
  width:100%;
  padding:14px;
  margin-bottom:10px;
  border:1px solid #ccc;
  border-radius:12px;
  font-size:19px;
  font-weight:bold;
}


.calc-open{
  width:100%;
  padding:13px;
  border:0;
  border-radius:12px;
  background:#111;
  color:#fff;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}
.calc-conteudo{
  display:none;
  margin-top:12px;
}
.calc-conteudo.show{
  display:block;
}

</style>
</head>

<body>

<div class="app">

  <h1>FF MAQUININHA</h1>

  <div class="maquina" id="maquinaNome">
    Carregando...
  </div>

  <div class="display">
    <div class="expr" id="expr"></div>
    <div class="total" id="total">
      R$ 0,00
    </div>
  </div>

  <input
    id="descricao"
    class="desc"
    placeholder="Descrição da cobrança (opcional)"
    maxlength="120"
  >

  <div class="conta-card">
    <div class="conta-total-label">TOTAL DA CONTA</div>
    <div class="conta-total" id="contaTotal">R$ 0,00</div>

    <label class="parcial-check">
      <input type="checkbox" id="pagamentoParcial" onchange="alternarParcial()">
      <span>Pagamento parcial</span>
    </label>

    <div id="parcialArea" class="parcial-area">
      <div class="parcial-info">
        <div>
          <span>Total da conta</span>
          <strong id="parcialTotal">R$ 0,00</strong>
        </div>
        <div>
          <span>Total pago</span>
          <strong id="totalPago">R$ 0,00</strong>
        </div>
        <div>
          <span>Restante</span>
          <strong id="totalRestante">R$ 0,00</strong>
        </div>
      </div>

      <label class="parcial-label" for="valorParcial">
        Quanto vai pagar agora?
      </label>

      <input
        id="valorParcial"
        class="valor-parcial"
        inputmode="decimal"
        placeholder="R$ 0,00"
        oninput="atualizarTela()"
      >

      <button
        type="button"
        class="parcial-btn"
        id="gerarParcialBtn"
        onclick="gerarPixParcial()"
      >
        GERAR PIX — R$ 0,00
      </button>
    </div>
  </div>

  <div class="calc-card">
    <button type="button" class="calc-open" onclick="abrirCalculadora()">
      🧮 ABRIR CALCULADORA
    </button>

    <div id="calculadoraConteudo" class="calc-conteudo">
      <div class="calc-title">🧮 CALCULADORA DA CONTA</div>
      <input
        id="valorDigitado"
        class="valor-digitado"
        inputmode="decimal"
        autocomplete="off"
        placeholder="Ou digite o valor total: R$ 0,00"
        oninput="usarValorDigitado()"
      >

      <div class="grid">

    <button onclick="dig('7')">7</button>
    <button onclick="dig('8')">8</button>
    <button onclick="dig('9')">9</button>
    <button class="op" onclick="oper('/')">÷</button>

    <button onclick="dig('4')">4</button>
    <button onclick="dig('5')">5</button>
    <button onclick="dig('6')">6</button>
    <button class="op" onclick="oper('*')">×</button>

    <button onclick="dig('1')">1</button>
    <button onclick="dig('2')">2</button>
    <button onclick="dig('3')">3</button>
    <button class="op" onclick="oper('-')">−</button>

    <button class="clear" onclick="limpar()">C</button>
    <button onclick="dig('0')">0</button>
    <button onclick="dig(',')">,</button>
    <button class="op" onclick="oper('+')">+</button>

    <button onclick="backspace()">⌫</button>

    <button
      class="equal"
      style="grid-column:span 3"
      onclick="igual()"
    >=</button>

    </div>
  </div>

  <div class="calc-total-hint" id="calcTotalHint">Total calculado: R$ 0,00</div>

  <button
    class="new"
    id="gerarBtn"
    onclick="gerarPix()"
  >
    GERAR PIX — R$ 0,00
  </button>

  <div id="status" class="status"></div>

  <div class="pix" id="pixBox">

    <h2>PIX — aguardando pagamento</h2>

    <img
      id="qr"
      class="qr"
      alt="QR Code PIX"
    >

    <div
      id="copia"
      class="copia"
    ></div>

    <div class="actions">

      <button
        class="action"
        onclick="copiarPix()"
      >
        COPIAR PIX
      </button>

      <button
        class="action"
        onclick="verificarAgora()"
      >
        VERIFICAR
      </button>

    </div>

  </div>

  <button
    class="new"
    onclick="novaCobranca()"
  >
    NOVA COBRANÇA
  </button>

  <div class="small">
    Pagamento PIX independente do Hotspot.
  </div>

</div>

<script>

const SUPABASE_URL =
  "https://auzdqapjetmhaokoynzo.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_36kXlyuKU8RMfgSx01h5mw_lOLp1lbX";

const sb =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


// =====================================================
// MAQUININHA
// =====================================================

const params =
  new URLSearchParams(location.search);

const MAQUININHA_ID =
  params.get("maquininha_id");


// =====================================================
// VARIÁVEIS
// =====================================================

let expr = "";
let current = "";
let paymentId = null;
let poll = null;

let contaTotal = 0;
let totalPago = 0;
let pagamentoAtual = 0;
let modoParcial = false;


// =====================================================
// HELPERS
// =====================================================

const $ = id => document.getElementById(id);

const money = n =>
  Number(n || 0).toLocaleString("pt-BR", {
    style:"currency",
    currency:"BRL"
  });

function numeroValor(v){
  if(v === null || v === undefined) return 0;

  let s = String(v)
    .trim()
    .replace(/R\$/gi,"")
    .replace(/\s/g,"");

  if(!s) return 0;

  if(s.includes(",") && s.includes(".")){
    s = s.replace(/\./g,"").replace(",",".");
  }else{
    s = s.replace(",",".");
  }

  const n = Number(s);
  return Number.isFinite(n) ? n : 0;
}


// =====================================================
// RENDER DA CALCULADORA / CONTA
// =====================================================

function render(){

  let v = 0;

  try{
    v = Number(calcular());
  }catch(e){
    v =
      Number(
        String(current || "").replace(",",".")
      ) || 0;
  }

  if(!Number.isFinite(v)) v = 0;

  $("expr").textContent =
    expr || current || "";

  $("total").textContent =
    money(v);

  // A calculadora define o TOTAL DA CONTA.
  if(!modoParcial && v > 0){
    contaTotal = v;
  }

  atualizarTela();
}

function atualizarTela(){

  const restante =
    Math.max(
      0,
      contaTotal - totalPago
    );

  $("contaTotal").textContent =
    money(contaTotal);

  $("parcialTotal").textContent =
    money(contaTotal);

  $("totalPago").textContent =
    money(totalPago);

  $("totalRestante").textContent =
    money(restante);

  $("calcTotalHint").textContent =
    "Total calculado: " + money(contaTotal);

  $("gerarBtn").textContent =
    "GERAR PIX — " + money(contaTotal);

  // O botão normal sempre fica disponível quando existe um total.
  $("gerarBtn").disabled =
    contaTotal <= 0;

  const valorParcial =
    numeroValor(
      $("valorParcial").value
    );

  $("gerarParcialBtn").textContent =
    "GERAR PIX — " + money(valorParcial);

  $("gerarParcialBtn").disabled =
    !modoParcial ||
    contaTotal <= 0 ||
    valorParcial <= 0 ||
    valorParcial > restante;
}


// =====================================================
// VALOR DIGITADO
// =====================================================

function usarValorDigitado(){

  const valor =
    numeroValor(
      $("valorDigitado").value
    );

  if(valor > 0){

    expr = "";
    current = "";

    if(!modoParcial){
      contaTotal = valor;
    }

  }else if(!modoParcial){

    contaTotal = 0;
  }

  atualizarTela();
}


// =====================================================
// ABRIR / FECHAR CALCULADORA
// =====================================================

function abrirCalculadora(){

  const area =
    $("calculadoraConteudo");

  const botao =
    document.querySelector(".calc-open");

  const aberta =
    area.classList.toggle("show");

  botao.textContent =
    aberta
      ? "✕ FECHAR CALCULADORA"
      : "🧮 ABRIR CALCULADORA";
}


// =====================================================
// CALCULADORA
// =====================================================

function dig(v){

  if(
    v === "," &&
    current.includes(",")
  ){
    return;
  }

  if(
    v === "," &&
    !current
  ){
    current = "0";
  }

  current += v;

  render();
}

function oper(op){

  if(!current && !expr){
    return;
  }

  if(current){
    expr += current;
    current = "";
  }

  if(/[+\-*\/]$/.test(expr)){
    expr = expr.slice(0,-1);
  }

  expr += op;

  render();
}

function igual(){

  if(current){
    expr += current;
  }

  if(!expr){
    return;
  }

  try{

    const v = calcular();

    current =
      String(
        v.toFixed(2)
      ).replace(".",",");

    expr = "";

    contaTotal = Number(v) || 0;
    atualizarTela();

  }catch(e){

    $("status").textContent =
      "Expressão inválida.";

    $("status").className =
      "status err";
  }
}

function calcular(){

  let s =
    (expr + current)
      .replace(/,/g,".")
      .replace(/×/g,"*")
      .replace(/÷/g,"/");

  if(!s){
    return 0;
  }

  if(
    !/^[0-9+\-*/. ()]+$/.test(s)
  ){
    throw new Error("inválida");
  }

  return Function(
    '"use strict";return (' +
    s +
    ')'
  )();
}

function limpar(){

  expr = "";
  current = "";

  $("status").textContent = "";
  $("status").className = "status";

  render();
}

function backspace(){

  if(current){
    current =
      current.slice(0,-1);
  }else{
    expr =
      expr.slice(0,-1);
  }

  render();
}


// =====================================================
// PAGAMENTO PARCIAL
// =====================================================

function alternarParcial(){

  modoParcial =
    $("pagamentoParcial").checked;

  $("parcialArea")
    .classList.toggle(
      "show",
      modoParcial
    );

  if(modoParcial){

    // NÃO apaga o total calculado.
    // O parcial só pergunta quanto será pago agora.
    if(contaTotal <= 0){
      try{
        contaTotal =
          Number(calcular()) || 0;
      }catch(e){
        contaTotal = 0;
      }
    }

    $("valorParcial").value = "";

  }else{

    $("valorParcial").value = "";
  }

  atualizarTela();
}

async function gerarPixParcial(){

  const restante =
    Math.max(
      0,
      contaTotal - totalPago
    );

  const valor =
    numeroValor(
      $("valorParcial").value
    );

  if(contaTotal <= 0){
    alert(
      "Primeiro monte o valor total da conta."
    );
    return;
  }

  if(restante <= 0){
    alert(
      "Essa conta já está paga."
    );
    return;
  }

  if(valor <= 0){
    alert(
      "Digite quanto a pessoa vai pagar agora."
    );
    return;
  }

  if(valor > restante){
    alert(
      "O valor não pode ser maior que o restante: " +
      money(restante)
    );
    return;
  }

  pagamentoAtual = valor;

  await criarPix(
    valor,
    "parcial"
  );
}


// =====================================================
// GERAR PIX DA CONTA
// =====================================================

async function gerarPix(){

  if(modoParcial){
    return gerarPixParcial();
  }

  let valor = 0;

  try{
    valor = Number(calcular());
  }catch(e){
    valor =
      Number(
        String(current || "").replace(",",".")
      ) || 0;
  }

  if(!Number.isFinite(valor) || valor <= 0){

    alert(
      "Digite ou calcule o valor da conta."
    );

    return;
  }

  contaTotal = valor;

  const restante =
    Math.max(
      0,
      contaTotal - totalPago
    );

  if(restante <= 0){
    alert(
      "Essa conta já está paga."
    );
    return;
  }

  pagamentoAtual = restante;

  await criarPix(
    restante,
    "total"
  );
}


// =====================================================
// CRIAR PIX
// =====================================================

async function criarPix(valor,tipo){

  if(!MAQUININHA_ID){

    $("status").textContent =
      "Maquininha não identificada.";

    $("status").className =
      "status err";

    return;
  }

  $("gerarBtn").disabled = true;
  $("gerarParcialBtn").disabled = true;

  $("status").textContent =
    "Gerando PIX de " +
    money(valor) +
    "...";

  $("status").className =
    "status wait";

  $("pixBox").style.display =
    "none";

  const descricao =
    $("descricao").value.trim() ||
    (
      tipo === "parcial"
        ? `Pagamento parcial — ${money(valor)}`
        : `Pagamento da conta — ${money(valor)}`
    );

  try{

    const r =
      await fetch(
        `${SUPABASE_URL}/functions/v1/gerar-pix-caixa`,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json",

            "apikey":
              SUPABASE_ANON_KEY,

            "Authorization":
              `Bearer ${SUPABASE_ANON_KEY}`
          },

          body:
            JSON.stringify({
              maquininha_id:
                MAQUININHA_ID,

              valor:
                Number(
                  valor.toFixed(2)
                ),

              descricao
            })
        }
      );

    const texto =
      await r.text();

    let d = {};

    try{
      d = JSON.parse(texto);
    }catch(e){
      console.error(
        "RESPOSTA NÃO JSON:",
        texto
      );
    }

    if(!r.ok || !d.success){

      $("status").textContent =
        d.error ||
        "Erro ao gerar PIX.";

      $("status").className =
        "status err";

      $("gerarBtn").disabled =
        false;

      atualizarTela();

      return;
    }

    paymentId =
      d.payment_id;

    if(d.qr_code_base64){

      $("qr").src =
        "data:image/png;base64," +
        d.qr_code_base64;

    }else{

      $("qr").src = "";
    }

    $("copia").textContent =
      d.qr_code || "";

    $("pixBox").style.display =
      "block";

    $("status").textContent =
      "Aguardando pagamento de " +
      money(valor) +
      "...";

    $("status").className =
      "status wait";

    iniciarPolling();

  }catch(error){

    console.error(
      "ERRO DE CONEXÃO:",
      error
    );

    $("status").textContent =
      error?.message ||
      "Erro de conexão ao gerar PIX.";

    $("status").className =
      "status err";

    $("gerarBtn").disabled =
      false;

    atualizarTela();
  }
}

// =====================================================
// CARREGAR MAQUININHA
// =====================================================

async function carregarMaquininha(){

  if(!MAQUININHA_ID){

    $("maquinaNome").textContent =
      "ERRO: maquininha_id não informado";

    $("gerarBtn").disabled =
      true;

    return;
  }

  const {
    data,
    error
  } =
    await sb
      .from("maquininhas")
      .select("nome,ativo")
      .eq("id", MAQUININHA_ID)
      .maybeSingle();

  if(error || !data){

    console.error(
      "ERRO MAQUININHA:",
      error
    );

    $("maquinaNome").textContent =
      "Maquininha não encontrada";

    $("gerarBtn").disabled =
      true;

    return;
  }

  if(!data.ativo){

    $("maquinaNome").textContent =
      "Maquininha desativada";

    $("gerarBtn").disabled =
      true;

    return;
  }

  $("maquinaNome").textContent =
    data.nome;
}


// =====================================================
// GERAR PIX
// =====================================================

async function gerarPix(){

  let valor = 0;

  try{

    valor =
      Number(calcular());

  }catch(e){

    valor = 0;
  }

  if(
    !Number.isFinite(valor) ||
    valor <= 0
  ){

    alert(
      "Digite um valor válido."
    );

    return;
  }

  if(!MAQUININHA_ID){

    $("status").textContent =
      "Maquininha não identificada.";

    $("status").className =
      "status err";

    return;
  }

  $("gerarBtn").disabled =
    true;

  $("status").textContent =
    "Gerando PIX...";

  $("status").className =
    "status wait";

  $("pixBox").style.display =
    "none";

  const descricao =
    $("descricao").value.trim();


  // ===================================================
  // CHAMADA EDGE FUNCTION
  // ===================================================

  try{

    const r =
      await fetch(
        `${SUPABASE_URL}/functions/v1/gerar-pix-caixa`,
        {
          method:"POST",

          headers:{

            "Content-Type":
              "application/json",

            "apikey":
              SUPABASE_ANON_KEY,

            "Authorization":
              `Bearer ${SUPABASE_ANON_KEY}`

          },

          body:
            JSON.stringify({

              maquininha_id:
                MAQUININHA_ID,

              valor:
                valor,

              descricao:
                descricao

            })
        }
      );


    // ================================================
    // LER RESPOSTA
    // ================================================

    const texto =
      await r.text();

    let d = {};

    try{

      d =
        JSON.parse(texto);

    }catch(e){

      console.error(
        "RESPOSTA NÃO JSON:",
        texto
      );
    }


    // ================================================
    // ERRO
    // ================================================

    if(
      !r.ok ||
      !d.success
    ){

      console.error(
        "ERRO GERAR PIX:",
        d
      );

      $("status").textContent =
        d.error ||
        "Erro ao gerar PIX.";

      $("status").className =
        "status err";

      $("gerarBtn").disabled =
        false;

      return;
    }


    // ================================================
    // SUCESSO
    // ================================================

    paymentId =
      d.payment_id;


    // ================================================
    // QR CODE
    // ================================================

    if(d.qr_code_base64){

      $("qr").src =
        "data:image/png;base64," +
        d.qr_code_base64;

    }else{

      $("qr").src = "";
    }


    // ================================================
    // COPIA E COLA
    // ================================================

    $("copia").textContent =
      d.qr_code || "";


    // ================================================
    // MOSTRAR PIX
    // ================================================

    $("pixBox").style.display =
      "block";

    $("status").textContent =
      "Aguardando pagamento...";

    $("status").className =
      "status wait";


    // ================================================
    // INICIAR POLLING
    // ================================================

    iniciarPolling();

  }catch(error){

    console.error(
      "ERRO DE CONEXÃO:",
      error
    );

    $("status").textContent =
      error?.message ||
      "Erro de conexão ao gerar PIX.";

    $("status").className =
      "status err";

    $("gerarBtn").disabled =
      false;
  }
}


// =====================================================
// POLLING
// =====================================================

function iniciarPolling(){

  clearInterval(poll);

  verificarAgora();

  poll =
    setInterval(
      verificarAgora,
      4000
    );
}


// =====================================================
// VERIFICAR PAGAMENTO
// =====================================================

async function verificarAgora(){

  if(!paymentId){
    return;
  }

  const {
    data,
    error
  } =
    await sb
      .from("maquininha_pagamentos")
      .select(
        "status,payment_status"
      )
      .eq(
        "payment_id",
        String(paymentId)
      )
      .maybeSingle();

  if(error){

    console.error(
      "ERRO AO VERIFICAR:",
      error
    );

    return;
  }

  const st =
    String(
      data?.status ||
      data?.payment_status ||
      ""
    ).toLowerCase();


  if(
    st === "approved"
  ){

    clearInterval(poll);

    totalPago =
      Math.min(
        contaTotal,
        totalPago + pagamentoAtual
      );

    const restante =
      Math.max(
        0,
        contaTotal - totalPago
      );

    paymentId = null;
    pagamentoAtual = 0;

    $("pixBox").style.display =
      "none";

    $("gerarBtn").disabled =
      false;

    $("valorParcial").value = "";

    if(restante <= 0){

      $("status").textContent =
        "PAGAMENTO APROVADO ✓ — CONTA PAGA";

      $("status").className =
        "status ok";

      $("pagamentoParcial").checked =
        false;

      modoParcial = false;

      $("parcialArea")
        .classList.remove("show");

    }else{

      $("status").textContent =
        "PAGAMENTO APROVADO ✓ — RESTANTE " +
        money(restante);

      $("status").className =
        "status ok";

      // Continua no modo parcial para a próxima pessoa.
      $("pagamentoParcial").checked =
        true;

      modoParcial = true;

      $("parcialArea")
        .classList.add("show");
    }

    atualizarTela();
  }
}


// =====================================================
// COPIAR PIX
// =====================================================

async function copiarPix(){

  const t =
    $("copia").textContent;

  if(!t){
    return;
  }

  try{

    await navigator.clipboard.writeText(t);

    $("status").textContent =
      "PIX copiado.";

    $("status").className =
      "status ok";

  }catch(e){

    alert(
      "Não foi possível copiar automaticamente."
    );
  }
}


// =====================================================
// NOVA COBRANÇA
// =====================================================

function novaCobranca(){

  clearInterval(poll);

  paymentId = null;
  pagamentoAtual = 0;

  contaTotal = 0;
  totalPago = 0;
  modoParcial = false;

  expr = "";
  current = "";

  $("descricao").value = "";
  $("valorDigitado").value = "";
  $("valorParcial").value = "";

  $("pagamentoParcial").checked =
    false;

  $("parcialArea")
    .classList.remove("show");

  $("pixBox").style.display =
    "none";

  $("status").textContent =
    "";

  $("status").className =
    "status";

  $("gerarBtn").disabled =
    false;

  render();
}


// =====================================================
// INICIAR
// =====================================================

carregarMaquininha();

render();

</script>
