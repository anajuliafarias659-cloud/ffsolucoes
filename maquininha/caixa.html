<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>FF Maquininha</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f7;font-family:Arial,sans-serif;color:#171717}
.app{max-width:480px;margin:auto;min-height:100vh;background:#fff;padding:18px}
h1{text-align:center;margin:4px 0 2px;font-size:25px}.maquina{text-align:center;color:#666;font-size:13px;margin-bottom:15px}
.display{background:#111;color:#fff;border-radius:18px;padding:18px;text-align:right;min-height:105px}
.expr{font-size:18px;color:#aaa;min-height:25px;word-break:break-all}.total{font-size:38px;font-weight:bold;margin-top:5px}
.desc{width:100%;margin:12px 0;padding:14px;border:1px solid #ddd;border-radius:12px;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
button{border:0;border-radius:14px;padding:19px 8px;font-size:21px;font-weight:bold;background:#eee;cursor:pointer}
button:active{transform:scale(.97)}.op{background:#ddd}.clear{background:#ffdcdc}.equal{background:#d8e8ff}
.pix{margin-top:15px;padding:16px;border-radius:16px;background:#f5f5f5;display:none}
.pix h2{margin:0 0 10px;font-size:19px}.qr{display:block;width:230px;height:230px;margin:10px auto;object-fit:contain}
.copia{width:100%;padding:11px;border:1px solid #ccc;border-radius:10px;background:#fff;word-break:break-all;font-size:12px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
.action{font-size:16px;padding:14px;background:#e9e9e9}.new{background:#111;color:#fff;width:100%;margin-top:10px}
.status{text-align:center;font-weight:bold;margin:12px 0}.ok{color:#148a3b}.wait{color:#b36b00}.err{color:#c62828}
.small{text-align:center;color:#777;font-size:12px;margin-top:12px}
</style>
</head>
<body>
<div class="app">
  <h1>FF MAQUININHA</h1>
  <div class="maquina" id="maquinaNome">Carregando...</div>

  <div class="display">
    <div class="expr" id="expr"></div>
    <div class="total" id="total">R$ 0,00</div>
  </div>

  <input id="descricao" class="desc" placeholder="Descrição da cobrança (opcional)" maxlength="120">

  <div class="grid">
    <button onclick="dig('7')">7</button><button onclick="dig('8')">8</button><button onclick="dig('9')">9</button><button class="op" onclick="oper('/')">÷</button>
    <button onclick="dig('4')">4</button><button onclick="dig('5')">5</button><button onclick="dig('6')">6</button><button class="op" onclick="oper('*')">×</button>
    <button onclick="dig('1')">1</button><button onclick="dig('2')">2</button><button onclick="dig('3')">3</button><button class="op" onclick="oper('-')">−</button>
    <button class="clear" onclick="limpar()">C</button><button onclick="dig('0')">0</button><button onclick="dig(',')">,</button><button class="op" onclick="oper('+')">+</button>
    <button onclick="backspace()">⌫</button><button class="equal" style="grid-column:span 3" onclick="igual()">=</button>
  </div>

  <button class="new" id="gerarBtn" onclick="gerarPix()">GERAR PIX — R$ 0,00</button>

  <div id="status" class="status"></div>

  <div class="pix" id="pixBox">
    <h2>PIX — aguardando pagamento</h2>
    <img id="qr" class="qr" alt="QR Code PIX">
    <div id="copia" class="copia"></div>
    <div class="actions">
      <button class="action" onclick="copiarPix()">COPIAR PIX</button>
      <button class="action" onclick="verificarAgora()">VERIFICAR</button>
    </div>
  </div>

  <button class="new" onclick="novaCobranca()">NOVA COBRANÇA</button>
  <div class="small">Pagamento PIX independente do Hotspot.</div>
</div>

<script>
const SUPABASE_URL = "https://auzdqapjetmhaokoynzo.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_36kXlyuKU8RMfgSx01h5mw_lOLp1lbX";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const params = new URLSearchParams(location.search);
const MAQUININHA_ID = params.get("maquininha_id");

let expr = "";
let current = "";
let paymentId = null;
let poll = null;

const $ = id => document.getElementById(id);
const money = n => Number(n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});

function render(){
  $("expr").textContent = expr || current || "";
  let v = 0;
  try { v = calcular(); } catch(e) { v = Number(current.replace(",",".")) || 0; }
  $("total").textContent = money(v);
  $("gerarBtn").textContent = "GERAR PIX — " + money(v);
}
function dig(v){
  if(v === "," && current.includes(",")) return;
  if(v === "," && !current) current = "0";
  current += v;
  render();
}
function oper(op){
  if(!current && !expr) return;
  if(current){ expr += current; current = ""; }
  if(/[+\-*\/]$/.test(expr)) expr = expr.slice(0,-1);
  expr += op;
  render();
}
function igual(){
  if(current) expr += current;
  if(!expr) return;
  try{
    const v = calcular();
    current = String(v.toFixed(2)).replace(".",",");
    expr = "";
    render();
  }catch(e){ $("status").textContent="Expressão inválida."; $("status").className="status err"; }
}
function calcular(){
  let s = (expr + current).replace(/,/g,".").replace(/×/g,"*").replace(/÷/g,"/");
  if(!s) return 0;
  if(!/^[0-9+\-*/. ()]+$/.test(s)) throw new Error("inválida");
  return Function('"use strict";return ('+s+')')();
}
function limpar(){expr="";current="";$("status").textContent="";$("status").className="status";render()}
function backspace(){if(current)current=current.slice(0,-1);else expr=expr.slice(0,-1);render()}

async function carregarMaquininha(){
  if(!MAQUININHA_ID){
    $("maquinaNome").textContent="ERRO: maquininha_id não informado";
    $("gerarBtn").disabled=true;
    return;
  }
  const {data,error}=await sb.from("maquininhas").select("nome,ativo").eq("id",MAQUININHA_ID).maybeSingle();
  if(error || !data){
    $("maquinaNome").textContent="Maquininha não encontrada";
    $("gerarBtn").disabled=true;
    return;
  }
  if(!data.ativo){
    $("maquinaNome").textContent="Maquininha desativada";
    $("gerarBtn").disabled=true;
    return;
  }
  $("maquinaNome").textContent=data.nome;
}
async function gerarPix(){
  let valor=0;
  try{valor=Number(calcular());}catch(e){}
  if(!Number.isFinite(valor)||valor<=0){alert("Digite um valor válido.");return}
  $("gerarBtn").disabled=true;
  $("status").textContent="Gerando PIX...";
  $("status").className="status wait";
  $("pixBox").style.display="none";

  const descricao=$("descricao").value.trim();
  const r=await fetch(`${SUPABASE_URL}/functions/v1/gerar-pix-caixa`,{
    method:"POST",
    headers:{"Content-Type":"application/json","apikey":SUPABASE_ANON_KEY},
    body:JSON.stringify({maquininha_id:MAQUININHA_ID,valor,descricao})
  });
  const d=await r.json();
  if(!r.ok||!d.success){
    $("status").textContent=d.error||"Erro ao gerar PIX.";
    $("status").className="status err";
    $("gerarBtn").disabled=false;
    return;
  }

  paymentId=d.payment_id;
  $("qr").src=d.qr_code_base64 ? "data:image/png;base64,"+d.qr_code_base64 : "";
  $("copia").textContent=d.qr_code||"";
  $("pixBox").style.display="block";
  $("status").textContent="Aguardando pagamento...";
  $("status").className="status wait";
  iniciarPolling();
}
function iniciarPolling(){
  clearInterval(poll);
  verificarAgora();
  poll=setInterval(verificarAgora,4000);
}
async function verificarAgora(){
  if(!paymentId)return;
  const {data,error}=await sb.from("maquininha_pagamentos")
    .select("status,payment_status")
    .eq("payment_id",String(paymentId))
    .maybeSingle();
  if(error)return;
  const st=String(data?.status||data?.payment_status||"").toLowerCase();
  if(st==="approved"){
    clearInterval(poll);
    $("status").textContent="PAGAMENTO APROVADO ✓";
    $("status").className="status ok";
  }
}
async function copiarPix(){
  const t=$("copia").textContent;
  if(!t)return;
  await navigator.clipboard.writeText(t);
  $("status").textContent="PIX copiado.";
  $("status").className="status ok";
}
function novaCobranca(){
  clearInterval(poll);paymentId=null;expr="";current="";
  $("descricao").value="";
  $("pixBox").style.display="none";
  $("status").textContent="";
  $("status").className="status";
  $("gerarBtn").disabled=false;
  render();
}
carregarMaquininha();render();
</script>
</body>
</html>
