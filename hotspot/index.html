<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>FF Hotspot</title>

<script src="js/supabase.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

html{
    font-size:16px;
}

body{
    background:#f3f4f6;
    color:#222;
    min-height:100vh;
}

/* =========================================
   TOPO
========================================= */

.topo{
    background:linear-gradient(
        135deg,
        #0d8db8,
        #08749a
    );

    color:#fff;

    padding:18px 15px 22px;

    text-align:center;

    box-shadow:
        0 3px 12px rgba(0,0,0,.15);
}

.logo{
    width:82px;
    height:82px;

    border-radius:18px;

    object-fit:cover;

    background:#fff;

    padding:4px;

    box-shadow:
        0 3px 10px rgba(0,0,0,.18);

    margin-bottom:8px;
}

.topo h1{
    font-size:22px;
    line-height:1.25;

    margin:4px 0 6px;

    font-weight:700;
}

.topo p{
    font-size:14px;
    line-height:1.4;

    opacity:.95;
}


/* =========================================
   CONTAINER
========================================= */

.container{
    width:100%;

    max-width:520px;

    margin:0 auto;

    padding:14px 12px 30px;
}


/* =========================================
   PLANOS
========================================= */

#planos{

    display:flex;

    flex-direction:column;

    gap:12px;
}


/* =========================================
   CARD DO PLANO
========================================= */

.plano{

    background:#fff;

    border-radius:16px;

    padding:17px 16px;

    text-align:center;

    box-shadow:
        0 3px 12px rgba(0,0,0,.08);

    border:1px solid #e5e7eb;
}

.plano h3{

    font-size:19px;

    line-height:1.3;

    margin-bottom:8px;

    color:#222;
}


/* =========================================
   VALOR
========================================= */

.valor{

    font-size:30px;

    font-weight:800;

    color:#0d8db8;

    line-height:1.1;

    margin:5px 0 12px;
}


/* =========================================
   INFORMAÇÕES
========================================= */

.plano p{

    font-size:15px;

    line-height:1.5;

    margin-top:6px;

    color:#444;
}

.plano p strong{

    color:#222;
}


/* =========================================
   DESCRIÇÃO
========================================= */

.plano p:last-of-type{

    font-size:14px;

    color:#666;

    padding:8px 5px 0;

    line-height:1.5;
}


/* =========================================
   BOTÃO
========================================= */

.btn{

    margin-top:14px;

    width:100%;

    min-height:50px;

    padding:13px 16px;

    border:none;

    border-radius:11px;

    background:
        linear-gradient(
            135deg,
            #0d8db8,
            #08749a
        );

    color:#fff;

    font-size:17px;

    font-weight:700;

    cursor:pointer;

    box-shadow:
        0 3px 8px rgba(
            13,
            141,
            184,
            .25
        );

    transition:.15s;
}

.btn:active{

    transform:scale(.98);
}


/* =========================================
   CARD GENÉRICO
========================================= */

.card{

    background:#fff;

    padding:18px;

    border-radius:14px;

    margin-bottom:12px;

    box-shadow:
        0 3px 10px rgba(0,0,0,.08);
}


/* =========================================
   CELULARES PEQUENOS
========================================= */

@media(max-width:380px){

    .topo{

        padding:
            15px
            12px
            18px;
    }

    .logo{

        width:72px;
        height:72px;

        border-radius:16px;
    }

    .topo h1{

        font-size:19px;
    }

    .topo p{

        font-size:13px;
    }

    .container{

        padding:
            10px
            9px
            25px;
    }

    .plano{

        padding:
            15px
            13px;

        border-radius:14px;
    }

    .plano h3{

        font-size:18px;
    }

    .valor{

        font-size:27px;
    }

    .plano p{

        font-size:14px;
    }

    .btn{

        min-height:48px;

        font-size:16px;
    }

}


/* =========================================
   CELULAR NORMAL
========================================= */

@media(
    min-width:381px
) and (
    max-width:600px
){

    .container{

        padding-left:14px;

        padding-right:14px;
    }

}


/* =========================================
   DESKTOP
========================================= */

@media(min-width:601px){

    .container{

        padding-top:20px;
    }

    .plano{

        padding:20px;

        transition:
            transform .15s,
            box-shadow .15s;
    }

    .plano:hover{

        transform:
            translateY(-2px);

        box-shadow:
            0 7px 18px rgba(0,0,0,.10);
    }

    .btn:hover{

        filter:brightness(1.05);
    }

}

</style>

</head>


<body>


<!-- =========================================
     EMPRESA / TOPO
========================================= -->

<div id="empresa"></div>


<!-- =========================================
     PLANOS
========================================= -->

<div class="container">

    <div id="planos">

        <div
            style="
                text-align:center;
                padding:35px 10px;
                color:#666;
            "
        >

            Carregando...

        </div>

    </div>

</div>


<script>


// =====================================================
// SUPABASE
// =====================================================

const db = window.supabase.createClient(

    "https://pdajixsoowcyhnjwhgpc.supabase.co",

    "sb_publishable_LatlFlcxk6IchHe3RNmfwA_9Oq4EsZw"

);


// =====================================================
// DADOS DO MIKROTIK
// =====================================================

const params = new URLSearchParams(
    window.location.search
);


const MAC =
    params.get("mac") || "";


const IP =
    params.get("ip") || "";


const LINK_LOGIN =

    params.get("link-login") ||

    params.get("link_login") ||

    "";


const LINK_ORIG =

    params.get("link-orig") ||

    params.get("link_orig") ||

    "";


const CHAP_ID =

    params.get("chap-id") ||

    params.get("chap_id") ||

    "";


const CHAP =

    params.get("chap-challenge") ||

    params.get("chap") ||

    "";


const APP_ID =

    params.get("app_id") || "";


const PAGINA_ATUAL =

    location.pathname
        .split("/")
        .pop();


// =====================================================
// VERIFICA APP ID
// =====================================================

if(!APP_ID){

    document.body.innerHTML = `

        <div
            style="
                min-height:100vh;
                display:flex;
                align-items:center;
                justify-content:center;
                padding:25px;
                text-align:center;
            "
        >

            <div
                style="
                    background:#fff;
                    padding:30px 22px;
                    border-radius:16px;
                    box-shadow:
                        0 4px 15px rgba(0,0,0,.08);
                    max-width:400px;
                    width:100%;
                "
            >

                <h2
                    style="
                        margin-bottom:10px;
                        color:#333;
                    "
                >
                    Hotspot não encontrado
                </h2>

                <p
                    style="
                        color:#666;
                        line-height:1.5;
                    "
                >
                    APP_ID não informado.
                </p>

            </div>

        </div>

    `;

    throw new Error(
        "APP_ID não informado"
    );

}


// =====================================================
// CARREGAR EMPRESA
// =====================================================

async function carregarEmpresa(){

    const {

        data,

        error

    } = await db

        .from("hotspot_config")

        .select("*")

        .eq(
            "app_id",
            APP_ID
        )

        .single();


    console.log(
        "EMPRESA:",
        data
    );


    console.log(
        "ERRO EMPRESA:",
        error
    );


    if(error){

        document.getElementById(
            "empresa"
        ).innerHTML = `

            <div
                class="topo"
            >

                <h2>
                    Hotspot não encontrado
                </h2>

            </div>

        `;

        return;

    }


    document.getElementById(
        "empresa"
    ).innerHTML = `

        <div class="topo">

            <img

                class="logo"

                src="${
                    data.logo ||
                    '/hotspot/img/logo.png'
                }"

                alt="Logo"

            >

            <h1>

                ${
                    data.nome_hotspot ||
                    "FF Hotspot"
                }

            </h1>

            <p>

                ${
                    data.descricao ||
                    "Internet Wi-Fi Oficial"
                }

            </p>

        </div>

    `;

}


// =====================================================
// CARREGAR PLANOS
// =====================================================

async function carregarPlanos(){

    const {

        data,

        error

    } = await db

        .from("hotspot_planos")

        .select("*")

        .eq(
            "app_id",
            APP_ID
        )

        .eq(
            "ativo",
            true
        )

        .order("valor");


    console.log(
        "PLANOS:",
        data
    );


    console.log(
        "ERRO PLANOS:",
        error
    );


    if(error){

        document.getElementById(
            "planos"
        ).innerHTML = `

            <div
                class="card"
                style="
                    text-align:center;
                    color:#b91c1c;
                "
            >

                ${error.message}

            </div>

        `;

        return;

    }


    if(
        !data ||
        data.length === 0
    ){

        document.getElementById(
            "planos"
        ).innerHTML = `

            <div
                class="card"
                style="
                    text-align:center;
                    color:#666;
                "
            >

                Nenhum plano encontrado.

            </div>

        `;

        return;

    }


    let html = "";


    data.forEach(

        plano => {

            html += `

                <div class="plano">

                    <h3>

                        ${
                            plano.nome
                        }

                    </h3>


                    <div class="valor">

                        R$

                        ${
                            Number(
                                plano.valor
                            ).toFixed(2)
                        }

                    </div>


                    <p>

                        <strong>
                            ⏱ Tempo:
                        </strong>

                        ${
                            plano.tempo_minutos
                        }

                        minutos

                    </p>


                    <p>

                        <strong>
                            📶 Velocidade:
                        </strong>

                        ${
                            plano.velocidade_download ||
                            "10 Mbps"
                        }

                    </p>


                    ${
                        plano.descricao
                        ?
                        `
                            <p>

                                ${
                                    plano.descricao
                                }

                            </p>
                        `
                        :
                        ""
                    }


                    <button

                        class="btn"

                        onclick="
                            comprar('${plano.id}')
                        "

                    >

                        📶 Conectar

                    </button>

                </div>

            `;

        }

    );


    document.getElementById(
        "planos"
    ).innerHTML = html;

}


// =====================================================
// COMPRAR PLANO
// =====================================================

function comprar(id){

    console.log(
        "================================"
    );


    console.log(
        "PLANO ESCOLHIDO:",
        id
    );


    console.log(
        "APP ID:",
        APP_ID
    );


    console.log(
        "MAC:",
        MAC
    );


    console.log(
        "IP:",
        IP
    );


    console.log(
        "================================"
    );


    const url =

        "https://hotspot.ffsolucoes.com.br/pagamentos.html" +

        "?app_id=" +

        encodeURIComponent(
            APP_ID
        ) +

        "&plano=" +

        encodeURIComponent(
            id
        ) +

        "&mac=" +

        encodeURIComponent(
            MAC
        ) +

        "&ip=" +

        encodeURIComponent(
            IP
        ) +

        "&link_login=" +

        encodeURIComponent(
            LINK_LOGIN
        ) +

        "&link_orig=" +

        encodeURIComponent(
            LINK_ORIG
        ) +

        "&chap_id=" +

        encodeURIComponent(
            CHAP_ID
        ) +

        "&chap=" +

        encodeURIComponent(
            CHAP
        );


    console.log(
        "REDIRECIONANDO PARA:",
        url
    );


    window.location.href =
        url;

}


// =====================================================
// INICIAR
// =====================================================

async function iniciar(){

    const {

        data,

        error

    } = await db

        .from("hotspot_config")

        .select("modelo")

        .eq(
            "app_id",
            APP_ID
        )

        .single();


    if(error){

        console.error(
            error
        );

        return;

    }


    if(

        data?.modelo &&

        data.modelo !==
        PAGINA_ATUAL

    ){

        location.replace(

            data.modelo +

            location.search

        );

        return;

    }


    await carregarEmpresa();


    await carregarPlanos();

}


// =====================================================
// START
// =====================================================

iniciar();


console.log(
    "FF HOTSPOT - INDEX CARREGADO"
);


</script>


</body>

</html>
