<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>FF Hotspot</title>

<script src="js/supabase.js"></script>

<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

html{
    font-size:16px;
}

body{
    background:#f3f4f6;
    color:#222;
    min-height:100vh;
}


/* =====================================================
   TOPO FIXO
===================================================== */

.topo{
    position:fixed;

    top:0;
    left:0;
    right:0;

    z-index:9999;

    background:
        linear-gradient(
            135deg,
            #0d8db8,
            #08749a
        );

    color:#fff;

    padding:
        20px
        15px
        24px;

    text-align:center;

    box-shadow:
        0 5px 16px
        rgba(0,0,0,.24);
}


/* =====================================================
   LOGO GRANDE E FIXO
===================================================== */

.logo{
    width:150px;
    height:150px;

    border-radius:28px;

    object-fit:cover;

    background:#fff;

    padding:5px;

    border:
        3px solid
        rgba(255,255,255,.95);

    box-shadow:
        0 6px 18px
        rgba(0,0,0,.30);

    margin-bottom:10px;
}


/* =====================================================
   TITULO
===================================================== */

.topo h1{
    font-size:23px;

    line-height:1.25;

    margin:
        3px 0
        6px;

    font-weight:700;
}


/* =====================================================
   DESCRICAO
===================================================== */

.topo p{
    font-size:15px;

    line-height:1.4;

    opacity:.96;

    max-width:420px;

    margin:auto;
}


/* =====================================================
   CONTAINER
===================================================== */

.container{
    width:100%;

    max-width:520px;

    margin:0 auto;

    padding:
        225px
        12px
        35px;
}


/* =====================================================
   TITULO DOS PLANOS
===================================================== */

.titulo-planos{
    text-align:center;

    font-size:19px;

    font-weight:700;

    color:#333;

    margin:
        0 0
        14px;
}


/* =====================================================
   LISTA DE PLANOS
===================================================== */

#planos{
    display:flex;

    flex-direction:column;

    gap:13px;
}


/* =====================================================
   CARD DO PLANO
===================================================== */

.plano{
    background:#fff;

    border-radius:17px;

    padding:
        18px
        16px;

    text-align:center;

    border:
        1px solid
        #e5e7eb;

    box-shadow:
        0 4px 13px
        rgba(0,0,0,.08);
}


/* =====================================================
   NOME DO PLANO
===================================================== */

.plano h3{
    font-size:20px;

    line-height:1.3;

    margin-bottom:8px;

    color:#222;

    font-weight:700;
}


/* =====================================================
   PRECO
===================================================== */

.valor{
    font-size:32px;

    font-weight:800;

    color:#0d8db8;

    line-height:1.1;

    margin:
        5px 0
        13px;
}


/* =====================================================
   INFORMACOES
===================================================== */

.plano p{
    font-size:15px;

    line-height:1.5;

    margin-top:6px;

    color:#444;
}

.plano p strong{
    color:#222;
}


/* =====================================================
   DESCRICAO
===================================================== */

.plano p:last-of-type{
    font-size:14px;

    color:#666;

    line-height:1.5;

    padding:
        7px 4px
        0;
}


/* =====================================================
   BOTAO
===================================================== */

.btn{
    margin-top:15px;

    width:100%;

    min-height:52px;

    padding:
        13px 16px;

    border:none;

    border-radius:12px;

    background:
        linear-gradient(
            135deg,
            #0d8db8,
            #08749a
        );

    color:#fff;

    font-size:18px;

    font-weight:700;

    cursor:pointer;

    box-shadow:
        0 4px 9px
        rgba(
            13,
            141,
            184,
            .28
        );

    transition:.15s;
}

.btn:active{
    transform:scale(.98);
}


/* =====================================================
   CARD GENERICO
===================================================== */

.card{
    background:#fff;

    padding:20px;

    border-radius:15px;

    margin-bottom:13px;

    box-shadow:
        0 4px 12px
        rgba(0,0,0,.08);
}


/* =====================================================
   CELULAR PEQUENO
===================================================== */

@media(max-width:380px){

    .topo{
        padding:
            16px
            10px
            20px;
    }


    .logo{
        width:135px;
        height:135px;

        border-radius:25px;

        padding:4px;

        margin-bottom:8px;
    }


    .topo h1{
        font-size:20px;

        margin:
            3px 0
            5px;
    }


    .topo p{
        font-size:13px;
    }


    .container{
        padding:
            205px
            9px
            28px;
    }


    .titulo-planos{
        font-size:17px;

        margin-bottom:11px;
    }


    .plano{
        padding:
            16px
            13px;

        border-radius:15px;
    }


    .plano h3{
        font-size:18px;
    }


    .valor{
        font-size:29px;
    }


    .plano p{
        font-size:14px;
    }


    .btn{
        min-height:50px;

        font-size:17px;
    }

}


/* =====================================================
   CELULAR NORMAL
===================================================== */

@media(
    min-width:381px
) and (
    max-width:600px
){

    .container{
        padding-left:14px;
        padding-right:14px;
    }

}


/* =====================================================
   DESKTOP
===================================================== */

@media(min-width:601px){

    .container{
        padding-top:225px;
    }


    .plano{
        transition:
            transform .15s,
            box-shadow .15s;
    }


    .plano:hover{
        transform:
            translateY(-2px);

        box-shadow:
            0 8px 20px
            rgba(0,0,0,.11);
    }


    .btn:hover{
        filter:brightness(1.06);
    }

}

</style>

</head>


<body>


<!-- =====================================================
     EMPRESA / TOPO FIXO
===================================================== -->

<div id="empresa"></div>


<!-- =====================================================
     PLANOS
===================================================== -->

<div class="container">

    <div class="titulo-planos">

        Escolha seu plano

    </div>


    <div id="planos">

        <div
            style="
                text-align:center;
                padding:35px 10px;
                color:#666;
            "
        >

            Carregando...

        </div>

    </div>

</div>


<script>


// =====================================================
// SUPABASE
// =====================================================

const db = window.supabase.createClient(

    "https://pdajixsoowcyhnjwhgpc.supabase.co",

    "sb_publishable_LatlFlcxk6IchHe3RNmfwA_9Oq4EsZw"

);


// =====================================================
// DADOS DO MIKROTIK
// =====================================================

const params = new URLSearchParams(
    window.location.search
);


const MAC =
    params.get("mac") || "";


const IP =
    params.get("ip") || "";


const LINK_LOGIN =
    params.get("link-login") ||
    params.get("link_login") ||
    "";


const LINK_ORIG =
    params.get("link-orig") ||
    params.get("link_orig") ||
    "";


const CHAP_ID =
    params.get("chap-id") ||
    params.get("chap_id") ||
    "";


const CHAP =
    params.get("chap-challenge") ||
    params.get("chap") ||
    "";


const APP_ID =
    params.get("app_id") || "";


const PAGINA_ATUAL =
    location.pathname
        .split("/")
        .pop();


// =====================================================
// VERIFICA APP ID
// =====================================================

if(!APP_ID){

    document.body.innerHTML = `

        <div
            style="
                min-height:100vh;
                display:flex;
                align-items:center;
                justify-content:center;
                padding:25px;
                text-align:center;
            "
        >

            <div
                style="
                    background:#fff;
                    padding:30px 22px;
                    border-radius:16px;
                    box-shadow:
                        0 4px 15px
                        rgba(0,0,0,.08);
                    max-width:400px;
                    width:100%;
                "
            >

                <h2
                    style="
                        margin-bottom:10px;
                        color:#333;
                    "
                >
                    Hotspot não encontrado
                </h2>

                <p
                    style="
                        color:#666;
                        line-height:1.5;
                    "
                >
                    APP_ID não informado.
                </p>

            </div>

        </div>

    `;

    throw new Error(
        "APP_ID não informado"
    );

}


// =====================================================
// CARREGAR EMPRESA
// =====================================================

async function carregarEmpresa(){

    const {
        data,
        error
    } = await db

        .from("hotspot_config")

        .select("*")

        .eq(
            "app_id",
            APP_ID
        )

        .single();


    console.log(
        "EMPRESA:",
        data
    );


    console.log(
        "ERRO EMPRESA:",
        error
    );


    if(error){

        document.getElementById(
            "empresa"
        ).innerHTML = `

            <div class="topo">

                <h2>
                    Hotspot não encontrado
                </h2>

            </div>

        `;

        return;

    }


    document.getElementById(
        "empresa"
    ).innerHTML = `

        <div class="topo">

            <img
                class="logo"
                src="${
                    data.logo ||
                    '/hotspot/img/logo.png'
                }"
                alt="Logo"
            >

            <h1>
                ${
                    data.nome_hotspot ||
                    "FF Hotspot"
                }
            </h1>

            <p>
                ${
                    data.descricao ||
                    "Internet Wi-Fi Oficial"
                }
            </p>

        </div>

    `;

}


// =====================================================
// CARREGAR PLANOS
// =====================================================

async function carregarPlanos(){

    const {
        data,
        error
    } = await db

        .from("hotspot_planos")

        .select("*")

        .eq(
            "app_id",
            APP_ID
        )

        .eq(
            "ativo",
            true
        )

        .order("valor");


    console.log(
        "PLANOS:",
        data
    );


    console.log(
        "ERRO PLANOS:",
        error
    );


    if(error){

        document.getElementById(
            "planos"
        ).innerHTML = `

            <div
                class="card"
                style="
                    text-align:center;
                    color:#b91c1c;
                "
            >

                ${error.message}

            </div>

        `;

        return;

    }


    if(
        !data ||
        data.length === 0
    ){

        document.getElementById(
            "planos"
        ).innerHTML = `

            <div
                class="card"
                style="
                    text-align:center;
                    color:#666;
                "
            >

                Nenhum plano encontrado.

            </div>

        `;

        return;

    }


    let html = "";


    data.forEach(
        plano => {

            html += `

                <div class="plano">

                    <h3>
                        ${plano.nome}
                    </h3>

                    <div class="valor">

                        R$
                        ${
                            Number(
                                plano.valor
                            ).toFixed(2)
                        }

                    </div>

                    <p>

                        <strong>
                            ⏱ Tempo:
                        </strong>

                        ${
                            plano.tempo_minutos
                        }

                        minutos

                    </p>

                    <p>

                        <strong>
                            📶 Velocidade:
                        </strong>

                        ${
                            plano.velocidade_download ||
                            "10 Mbps"
                        }

                    </p>

                    ${
                        plano.descricao
                        ?
                        `
                            <p>
                                ${plano.descricao}
                            </p>
                        `
                        :
                        ""
                    }

                    <button
                        class="btn"
                        onclick="
                            comprar('${plano.id}')
                        "
                    >

                        📶 Conectar

                    </button>

                </div>

            `;

        }
    );


    document.getElementById(
        "planos"
    ).innerHTML = html;

}


// =====================================================
// COMPRAR PLANO
// =====================================================

function comprar(id){

    console.log(
        "================================"
    );

    console.log(
        "PLANO ESCOLHIDO:",
        id
    );

    console.log(
        "APP ID:",
        APP_ID
    );

    console.log(
        "MAC:",
        MAC
    );

    console.log(
        "IP:",
        IP
    );

    console.log(
        "================================"
    );


    const url =

        "https://hotspot.ffsolucoes.com.br/pagamentos.html" +

        "?app_id=" +
        encodeURIComponent(APP_ID) +

        "&plano=" +
        encodeURIComponent(id) +

        "&mac=" +
        encodeURIComponent(MAC) +

        "&ip=" +
        encodeURIComponent(IP) +

        "&link_login=" +
        encodeURIComponent(LINK_LOGIN) +

        "&link_orig=" +
        encodeURIComponent(LINK_ORIG) +

        "&chap_id=" +
        encodeURIComponent(CHAP_ID) +

        "&chap=" +
        encodeURIComponent(CHAP);


    console.log(
        "REDIRECIONANDO PARA:",
        url
    );


    window.location.href = url;

}


// =====================================================
// INICIAR
// =====================================================

async function iniciar(){

    const {
        data,
        error
    } = await db

        .from("hotspot_config")

        .select("modelo")

        .eq(
            "app_id",
            APP_ID
        )

        .single();


    if(error){

        console.error(
            error
        );

        return;

    }


    if(
        data?.modelo &&
        data.modelo !== PAGINA_ATUAL
    ){

        location.replace(
            data.modelo +
            location.search
        );

        return;

    }


    await carregarEmpresa();

    await carregarPlanos();

}


// =====================================================
// INICIAR SISTEMA
// =====================================================

iniciar();


console.log(
    "FF HOTSPOT - INDEX CARREGADO"
);

</script>


</body>

</html>
