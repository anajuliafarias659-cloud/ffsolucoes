<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Configurações Hotspot Patrocinado</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f3f4f6;
}

.topo{
background:#0d8db8;
color:#fff;
padding:18px;
font-size:24px;
font-weight:bold;
}

.container{
max-width:900px;
margin:30px auto;
padding: 0 15px;
}

.card{
background:#fff;
padding:20px;
margin-bottom:20px;
border-radius:12px;
box-shadow:0 4px 12px rgba(0,0,0,.08);
}

h2{
margin-bottom:15px;
color:#0d8db8;
}

input,
textarea,
select{
width:100%;
padding:12px;
margin-top:8px;
margin-bottom:15px;
border:1px solid #ddd;
border-radius:8px;
}

textarea{
height:90px;
}

button{
padding:15px;
border:none;
background:#0d8db8;
color:#fff;
font-size:18px;
border-radius:10px;
cursor:pointer;
width:100%;
transition: background 0.2s;
}

button:hover{
background:#0a7296;
}

label{
font-weight:bold;
}

.check{
display:flex;
gap:10px;
align-items:center;
margin-bottom:10px;
}

.check input{
width:auto;
margin: 0;
}

.switch{
position:relative;
display:inline-block;
width:60px;
height:34px;
}

.switch input{
opacity:0;
width:0;
height:0;
}

.slider{
position:absolute;
cursor:pointer;
top:0;
left:0;
right:0;
bottom:0;
background:#ccc;
transition:.3s;
border-radius:34px;
}

.slider:before{
content:"";
position:absolute;
height:26px;
width:26px;
left:4px;
bottom:4px;
background:white;
transition:.3s;
border-radius:50%;
}

.switch input:checked + .slider{
background:#0d8db8;
}

.switch input:checked + .slider:before{
transform:translateX(26px);
}

.modal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.55);
z-index:9999;
justify-content:center;
align-items:center;
}

.janela{
background:#fff;
width:95%;
max-width:550px;
border-radius:12px;
padding:20px;
max-height:90vh;
overflow:auto;
box-shadow:0 10px 30px rgba(0,0,0,.35);
}

.img-preview {
max-width:150px;
max-height: 150px;
border-radius:12px;
margin-top:10px;
display: block;
object-fit: cover;
background: #eee;
}

.banner-preview {
width:100%;
max-height: 200px;
margin-top:10px;
border-radius:12px;
display: block;
object-fit: cover;
background: #eee;
}

.btn-group {
display:flex;
gap:10px;
margin-top:10px;
margin-bottom:20px;
}
</style>

</head>

<body>

    <!-- CARD OPÇÕES DO SISTEMA -->
    <div class="card">
        <h2>Opções de Conexão</h2>

        </div>

        <div class="check">
            <input type="checkbox" id="ativo">
            <label for="ativo">Wi-Fi Liberado e Ativo</label>
        </div>
    </div>

    <button onclick="salvar()">💾 Salvar Todas as Configurações</button>

</div>

<!-- MODAL MIKROTIK -->

</div>

<script>
const db = window.supabase.createClient(
    "https://pdajixsoowcyhnjwhgpc.supabase.co",

const APP_ID = new URLSearchParams(location.search).get("app_id");

if (!APP_ID) {
    alert("Erro: O parâmetro ?app_id= seu_id está ausente na URL.");
    throw new Error("APP_ID ausente");
}

let mikrotikEditando = null;

// Pré-visualização local de imagens carregadas pelo input file
function previewImagem(input, idPreview) {
    if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
            document.getElementById(idPreview).src = e.target.result;
        }
        reader.readAsDataURL(input.files[0]);
    }
}

function excluirImagem(idPreview, idInput) {
    document.getElementById(idPreview).src = "";
    document.getElementById(idInput).value = "";
}

// Upload direto para o Bucket do Supabase Storage
async function uploadStorage(fileInput, pathName) {
    if (!fileInput.files || fileInput.files.length === 0) return null;
    const file = fileInput.files[0];
    const fileExt = file.name.split('.').pop();
    const fileName = `${APP_ID}_${pathName}_${Date.now()}.${fileExt}`;
    
    const { data, error } = await db.storage
        .from('hotspots')
        .upload(fileName, file, { upsert: true });

    if (error) {
        console.error("Erro upload:", error.message);
        return null;
    }
    
    const { data: publicUrlData } = db.storage.from('hotspots').getPublicUrl(fileName);
    return publicUrlData.publicUrl;
}
