<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1"
>

<title>FF Hotspot</title>

<script src="js/supabase.js"></script>


<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

html{
    font-size:16px;
}

body{
    background:#f3f4f6;
    color:#222;
    min-height:100vh;
}


/* =====================================================
   TOPO FIXO
===================================================== */

.topo{

    position:fixed;

    top:0;
    left:0;
    right:0;

    z-index:9999;

    background:
        linear-gradient(
            135deg,
            #0d8db8,
            #08749a
        );

    color:#fff;

    padding:
        14px
        12px
        16px;

    text-align:center;

    box-shadow:
        0 4px 14px
        rgba(0,0,0,.20);
}


/* =====================================================
   LOGO
===================================================== */

.logo{

    width:100px;
    height:100px;

    object-fit:cover;

    border-radius:22px;

    background:#fff;

    padding:4px;

    border:
        2px solid
        rgba(255,255,255,.9);

    box-shadow:
        0 5px 15px
        rgba(0,0,0,.25);

    margin-bottom:7px;
}


/* =====================================================
   NOME
===================================================== */

.topo h1{

    font-size:21px;

    line-height:1.25;

    margin:
        3px 0
        5px;

    font-weight:700;
}


/* =====================================================
   DESCRIÇÃO
===================================================== */

.topo p{

    font-size:13px;

    line-height:1.4;

    opacity:.95;

    max-width:420px;

    margin:auto;
}


/* =====================================================
   CONTAINER PRINCIPAL
===================================================== */

.container{

    width:100%;

    max-width:520px;

    margin:0 auto;

    padding:
        165px
        12px
        30px;
}


/* =====================================================
   BANNER
===================================================== */

.banner{

    display:block;

    width:100%;

    max-height:180px;

    object-fit:cover;

    border-radius:15px;

    margin:
        0
        0
        14px;

    box-shadow:
        0 3px 12px
        rgba(0,0,0,.10);
}


/* =====================================================
   CARD PRINCIPAL
===================================================== */

.card{

    background:#fff;

    border-radius:17px;

    padding:
        18px
        16px;

    margin-bottom:14px;

    border:
        1px solid
        #e5e7eb;

    box-shadow:
        0 4px 13px
        rgba(0,0,0,.07);
}


/* =====================================================
   TITULOS
===================================================== */

.card h2{

    font-size:20px;

    color:#222;

    text-align:center;

    margin-bottom:8px;
}

.card h3{

    font-size:18px;

    text-align:center;

    color:#333;

    margin-bottom:10px;
}


/* =====================================================
   PLANO
===================================================== */

.valor{

    font-size:32px;

    font-weight:800;

    color:#0d8db8;

    text-align:center;

    margin:
        8px 0
        12px;
}

.info-plano{

    text-align:center;

    color:#555;

    font-size:15px;

    line-height:1.6;

    margin-bottom:12px;
}


/* =====================================================
   INPUT
===================================================== */

label{

    display:block;

    font-size:15px;

    font-weight:700;

    color:#333;

    margin-bottom:7px;
}

input[type="text"]{

    width:100%;

    height:50px;

    padding:
        0
        14px;

    border:
        1px solid
        #d1d5db;

    border-radius:11px;

    background:#fff;

    color:#222;

    font-size:17px;

    outline:none;

    text-align:center;
}

input[type="text"]:focus{

    border-color:#0d8db8;

    box-shadow:
        0 0 0 3px
        rgba(13,141,184,.12);
}

input[type="tel"]{

    width:100%;

    height:50px;

    padding:
        0
        14px;

    border:
        1px solid
        #d1d5db;

    border-radius:11px;

    background:#fff;

    color:#222;

    font-size:17px;

    outline:none;

    text-align:center;
}

input[type="tel"]:focus{

    border-color:#0d8db8;

    box-shadow:
        0 0 0 3px
        rgba(
            13,
            141,
            184,
            .12
        );
}


/* =====================================================
   AJUDA CELULAR
===================================================== */

.celular-ajuda{

    font-size:12px;

    color:#777;

    line-height:1.4;

    text-align:center;

    margin-top:7px;
}


/* =====================================================
   BOTÕES
===================================================== */

button{

    width:100%;

    min-height:50px;

    border:none;

    border-radius:11px;

    background:#0d8db8;

    color:#fff;

    font-size:17px;

    font-weight:700;

    cursor:pointer;

    padding:
        12px
        15px;

    transition:.15s;

    box-shadow:
        0 3px 8px
        rgba(
            13,
            141,
            184,
            .22
        );
}

button:active{

    transform:scale(.98);
}

button:disabled{

    opacity:.65;

    cursor:not-allowed;
}


/* =====================================================
   PIX
===================================================== */

#pix{

    display:none;

    margin-top:14px;
}

#pix h3{

    font-size:19px;

    text-align:center;

    margin-bottom:13px;
}

#qrcode{

    display:block;

    width:220px;
    height:220px;

    max-width:100%;

    margin:
        0 auto
        15px;

    border-radius:10px;

    background:#fff;

    border:
        1px solid
        #e5e7eb;

    padding:6px;
}

#copiacola{

    display:block;

    width:100%;

    min-height:95px;

    resize:none;

    padding:11px;

    border:
        1px solid
        #d1d5db;

    border-radius:10px;

    background:#f9fafb;

    color:#333;

    font-size:12px;

    line-height:1.4;

    outline:none;
}


/* =====================================================
   STATUS PAGAMENTO
===================================================== */

.status{

    display:none;

    background:#f8fafc;

    border:
        1px solid
        #e2e8f0;

    border-radius:13px;

    padding:15px;

    margin-top:14px;

    text-align:center;

    color:#444;

    font-size:15px;

    line-height:1.5;
}

.status strong{

    font-size:20px;

    color:#0d8db8;
}


/* =====================================================
   SUCESSO
===================================================== */

.sucesso{

    display:none;

    background:#fff;

    border-radius:16px;

    padding:22px;

    text-align:center;

    margin-top:14px;

    box-shadow:
        0 4px 13px
        rgba(0,0,0,.08);
}

.sucesso h2{

    color:#16803c;

    margin-bottom:8px;
}

.sucesso p{

    color:#555;

    line-height:1.5;
}


/* =====================================================
   RODAPÉ
===================================================== */

.rodape{

    text-align:center;

    color:#888;

    font-size:12px;

    padding:
        10px
        0
        25px;
}


/* =====================================================
   CELULAR PEQUENO
===================================================== */

@media(max-width:380px){

    .topo{

        padding:
            10px
            9px
            12px;
    }

    .logo{

        width:82px;
        height:82px;

        border-radius:18px;
    }

    .topo h1{

        font-size:19px;
    }

    .topo p{

        font-size:12px;
    }

    .container{

        padding:
            137px
            9px
            25px;
    }

    .banner{

        max-height:145px;

        border-radius:13px;
    }

    .card{

        padding:
            16px
            13px;

        border-radius:15px;
    }

    .valor{

        font-size:29px;
    }

    #qrcode{

        width:200px;
        height:200px;
    }

}


/* =====================================================
   DESKTOP
===================================================== */

@media(min-width:601px){

    .container{

        padding-top:175px;
    }

    .banner{

        max-height:220px;
    }

}

</style>

<body>


<!-- =====================================================
     EMPRESA
===================================================== -->

<div id="empresa"></div>


<!-- =====================================================
     CONTEÚDO
===================================================== -->

<div class="container">


    <!-- BANNER SERÁ INSERIDO PELO JS -->


    <!-- =================================================
         PLANO / CELULAR
    ================================================== -->

    <div class="card">

        <h2>
            Seu plano
        </h2>


        <h3 id="nome">
            Carregando...
        </h3>


        <div
            class="valor"
            id="valor"
        >
            R$ 0,00
        </div>


        <div
            class="info-plano"
        >

            <div>
                ⏱
                <strong>Tempo:</strong>
                <span id="tempo">
                    -
                </span>
            </div>


            <div>
                📶
                <strong>Internet:</strong>
                <span id="descricao">
                    -
                </span>

        </div>

            placeholder="(89) 99999-9999"

            onclick="gerarPix()"

        </button>

    <!-- =================================================

        id="pix"
        class="card"
    >

            Pagamento via PIX

            alt="QR Code PIX"
        >

            id="copiacola"
            readonly
        ></textarea>

        <br>


        <button
            onclick="copiarPix()"
        >

            Copiar Código PIX

        </button>

         STATUS
    ================================================== -->

        class="status"
        id="statusPagamento"
    >

        Aguardando pagamento...

    </div>


    <!-- =================================================
         SUCESSO
    ================================================== -->

    <div
        class="sucesso"
        id="sucesso"
    >

        <h2>
            Pagamento Aprovado
        </h2>

        <p>
            Seu acesso foi liberado.
        </p>

    </div>

    <div
        class="sucesso"
        id="boasVindas"
    >

        <h2>
            Seja bem-vindo!
        </h2>

        <p id="textoBoasVindas">
            Seu acesso está ativo.
        </p>

        <br>

        <button onclick="continuarAcesso()">
            Entrar na internet
        </button>

    </div>

         RODAPÉ
    ================================================== -->

    <div
        class="rodape"
        id="rodape"
    >

        FF Hotspot

    </div>

<script>


// =====================================================
// SUPABASE
// =====================================================

const SUPABASE_URL =
    "https://pdajixsoowcyhnjwhgpc.supabase.co";


const SUPABASE_ANON_KEY =
    "sb_publishable_LatlFlcxk6IchHe3RNmfwA_9Oq4EsZw";


const db =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


// =====================================================
// PARÂMETROS
// =====================================================

const params =
    new URLSearchParams(
        location.search
    );


const APP_ID =
    params.get("app_id");


const planoId =
    params.get("plano");


const MAC =
    params.get("mac") || "";


const IP =
    params.get("ip") || "";


const LINK_LOGIN =
    params.get("link_login") || "";


const LINK_ORIG =
    params.get("link_orig") || "";


const CHAP_ID =
    params.get("chap_id") || "";


const CHAP =
    params.get("chap") || "";


// =====================================================
// VALIDAÇÃO
// =====================================================

if(
    !APP_ID ||
    !planoId
){

    alert(
        "APP_ID ou Plano inválido."
    );

    throw new Error(
        "APP_ID inválido"
    );

}


let planoAtual = null;

let pagamentoId = null;
let clienteAtual = null;


// =====================================================
// MÁSCARA CELULAR
// =====================================================

const campoCelular =
    document.getElementById(
        "celular"
    );

const campoNome =
    document.getElementById("nomeCliente");

const nomeSalvo =
    localStorage.getItem("hotspot_nome") || "";

if(campoNome && nomeSalvo){
    campoNome.value = nomeSalvo;
}


campoCelular.addEventListener(
    "input",
    function(){

        let valor =
            this.value.replace(
                /\D/g,
                ""
            );


        if(
            valor.length > 11
        ){

            valor =
                valor.substring(
                    0,
                    11
                );

        }


        if(
            valor.length <= 10
        ){

            valor =
                valor.replace(
                    /^(\d{2})(\d)/,
                    "($1) $2"
                );


            valor =
                valor.replace(
                    /(\d{4})(\d)/,
                    "$1-$2"
                );

        }else{

            valor =
                valor.replace(
                    /^(\d{2})(\d)/,
                    "($1) $2"
                );


            valor =
                valor.replace(
                    /(\d{5})(\d)/,
                    "$1-$2"
                );

        }


        this.value =
            valor;

    }
);


// =====================================================
// CARREGA EMPRESA
// =====================================================

async function carregarEmpresa(){

    const {
        data,
        error
    } = await db

        .from("hotspot_config")

        .select("*")

        .eq(
            "app_id",
            APP_ID
        )

        .single();


    if(error){

        console.error(
            error
        );


        document.getElementById(
            "empresa"
        ).innerHTML =
            "<h2>Hotspot não encontrado.</h2>";


        return;

    }


    // =================================================
    // TOPO
    // =================================================

    document.getElementById(
        "empresa"
    ).innerHTML = `

        <div class="topo">

            <img
                class="logo"

                src="${
                    data.logo ||
                    "/hotspot/img/logo.png"
                }"

                alt="Logo"
            >

            <h1>

                ${
                    data.nome_hotspot
                }

            </h1>

            <p>

                ${
                    data.descricao || ""
                }

            </p>

        </div>


        ${
            data.banner

            ?

            `

                <div
                    style="
                        display:none;
                    "
                ></div>

            `

            :

            ""
        }

    `;


    // =================================================
    // INSERE BANNER ANTES DO PRIMEIRO CARD
    // =================================================

    if(data.banner){

        const banner =
            document.createElement(
                "img"
            );


        banner.className =
            "banner";


        banner.src =
            data.banner;


        banner.alt =
            "Banner";


        const container =
            document.querySelector(
                ".container"
            );


        container.insertBefore(
            banner,
            container.firstElementChild
        );

    }


    // =================================================
    // COR PRIMÁRIA
    // =================================================

    if(
        data.cor_primaria
    ){

        const topo =
            document.querySelector(
                ".topo"
            );


        if(topo){

            topo.style.background =
                data.cor_primaria;

        }


        const botoes =
            document.querySelectorAll(
                "button"
            );


        botoes.forEach(
            botao => {

                botao.style.background =
                    data.cor_primaria;

            }
        );


        const valor =
            document.querySelector(
                ".valor"
            );


        if(valor){

            valor.style.color =
                data.cor_primaria;

        }

    }

}


// =====================================================
// CARREGA PLANO
// =====================================================

async function carregarPlano(){

    const {
        data,
        error
    } = await db

        .from("hotspot_planos")

        .select("*")

        .eq(
            "app_id",
            APP_ID
        )

        .eq(
            "id",
            planoId
        )

        .single();


    if(error){

        alert(
            error.message
        );

        return;

    }


    planoAtual =
        data;


    document.getElementById(
        "nome"
    ).innerHTML =
        data.nome;


    document.getElementById(
        "descricao"
    ).innerHTML =
        data.descricao ||
        "Internet Wi-Fi";


    document.getElementById(
        "tempo"
    ).innerHTML =
        data.tempo_minutos +
        " minutos";


    document.getElementById(
        "valor"
    ).innerHTML =
        "R$ " +
        Number(
            data.valor
        ).toFixed(2);

}


carregarEmpresa();

carregarPlano();


// =====================================================
// NORMALIZA CELULAR
// =====================================================

function obterCelular(){

    return String(

        document
            .getElementById(
                "celular"
            )
            .value || ""

    )
    .replace(
        /\D/g,
        ""
    );

}


// =====================================================
// CLIENTE / CREDITO EXISTENTE
// =====================================================

function obterNome(){

    return String(
        document.getElementById("nomeCliente")?.value || ""
    ).trim().replace(/\s+/g," ");
}

function esconderPagamento(){

    document.querySelector(".card").style.display = "none";

    document.getElementById("pix").style.display = "none";
    document.getElementById("statusPagamento").style.display = "none";
    document.getElementById("sucesso").style.display = "none";
    document.getElementById("boasVindas").style.display = "block";
}

function mostrarBoasVindas(nome, pagamento){

    clienteAtual = pagamento || null;

    const nomeFinal = nome || pagamento?.nome || "cliente";

    document.getElementById("textoBoasVindas").innerHTML =
        `Olá, <strong>${nomeFinal}</strong>!<br><br>Seu acesso está ativo.`;

    esconderPagamento();
}

function creditoValido(pagamento){

    if(!pagamento) return false;

    const status = String(
        pagamento.status || pagamento.payment_status || ""
    ).toLowerCase();

    if(status !== "approved") return false;

    // Se o banco possuir uma data de fim, respeita a validade do crédito.
    const camposFim = [
        "fim_acesso",
        "data_fim",
        "data_expiracao",
        "expires_at",
        "expira_em",
        "valid_until"
    ];

    for(const campo of camposFim){
        if(pagamento[campo]){
            const fim = new Date(pagamento[campo]);
            if(!Number.isNaN(fim.getTime())){
                return fim.getTime() > Date.now();
            }
        }
    }

    // Se não existir campo de expiração, mantém a compatibilidade com
    // a estrutura atual e considera o pagamento aprovado como crédito.
    return true;
}

async function verificarCreditoExistente(celular){

    try{

        const {data, error} = await db
            .from("hotspot_pagamentos")
            .select("*")
            .eq("app_id", APP_ID)
            .eq("celular", celular)
            .limit(20);

        if(error){
            console.warn("Não foi possível consultar crédito existente:", error);
            return null;
        }

        const lista = Array.isArray(data) ? data : [];

        const aprovado = lista
            .filter(creditoValido)
            .sort((a,b)=>{
                const da = new Date(a.created_at || a.updated_at || a.data_pagamento || 0).getTime();
                const db = new Date(b.created_at || b.updated_at || b.data_pagamento || 0).getTime();
                return db - da;
            })[0];

        return aprovado || null;

    }catch(e){
        console.warn("Erro consultando crédito existente:", e);
        return null;
    }
}

function continuarAcesso(){

    // Se houver uma página de sucesso/liberação já existente, reutiliza o
    // mesmo fluxo que o pagamento aprovado utiliza.
    if(clienteAtual?.payment_id || clienteAtual?.id){

        const id = clienteAtual.payment_id || clienteAtual.id;

        const celular = obterCelular();

        window.location.href =
            `sucesso.html?` +
            `app_id=${encodeURIComponent(APP_ID)}` +
            `&mac=${encodeURIComponent(MAC)}` +
            `&ip=${encodeURIComponent(IP)}` +
            `&celular=${encodeURIComponent(celular)}` +
            `&nome=${encodeURIComponent(obterNome() || clienteAtual.nome || "")}` +
            `&pagamento_id=${encodeURIComponent(id)}` +
            `&link_login=${encodeURIComponent(LINK_LOGIN)}` +
            `&link_orig=${encodeURIComponent(LINK_ORIG)}` +
            `&chap_id=${encodeURIComponent(CHAP_ID)}` +
            `&chap=${encodeURIComponent(CHAP)}`;
    }
}

// =====================================================
// GERA PIX
// =====================================================

async function gerarPix(){

    const celular =
        obterCelular();


    if(
        celular.length < 10 ||
        celular.length > 11
    ){

        alert(
            "Digite um celular válido."
        );


        document
            .getElementById(
                "celular"
            )
            .focus();


        return;

    }

    const nome = obterNome();

    if(nome.length < 2){

        alert("Digite seu nome.");

        document.getElementById("nomeCliente").focus();

        return;
    }

    // Antes de gerar outro PIX, procura se este celular já possui
    // um crédito aprovado e ainda válido.
    const creditoExistente = await verificarCreditoExistente(celular);

    if(creditoExistente){

        const nomeBanco = String(
            creditoExistente.nome ||
            creditoExistente.nome_cliente ||
            nome
        ).trim();

        document.getElementById("nomeCliente").value = nomeBanco;

        localStorage.setItem("hotspot_nome", nomeBanco);
        localStorage.setItem("hotspot_celular", celular);

        mostrarBoasVindas(nomeBanco, creditoExistente);

        return;
    }


    if(
        !APP_ID ||
        !planoId ||
        !MAC
    ){

        alert(
            "Dados do Hotspot incompletos."
        );


        return;

    }


    const btnPix =
        document.getElementById(
            "btnPix"
        );


    btnPix.disabled =
        true;


    btnPix.innerHTML =
        "Gerando PIX...";


    try{

        console.log(
            "GERANDO PIX"
        );


        console.log({

            app_id:
                APP_ID,

            plano_id:
                planoId,

            mac:
                MAC,

            ip:
                IP,

            celular:
                celular,

            nome:
                nome

        });


        const resposta =
            await fetch(

                `${SUPABASE_URL}/functions/v1/gerar-pix-hotspot`,

                {

                    method:
                        "POST",

                    headers:{

                        "Content-Type":
                            "application/json",

                        "apikey":
                            SUPABASE_ANON_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_ANON_KEY

                    },


                    body:
                        JSON.stringify({

                            app_id:
                                APP_ID,

                            plano_id:
                                planoId,

                            mac:
                                MAC,

                            ip:
                                IP,

                            hostname:
                                "",

                            celular:
                                celular,

                            nome:
                                nome

                        })

                }

            );


        const retorno =
            await resposta.json();


        console.log(
            "RETORNO PIX:",
            retorno
        );


        if(
            !resposta.ok
        ){

            alert(

                retorno.error ||

                retorno.erro ||

                "Erro ao gerar PIX."

            );


            btnPix.disabled =
                false;


            btnPix.innerHTML =
                "Gerar PIX";


            return;

        }


        if(
            !retorno.payment_id
        ){

            console.error(
                "Resposta sem payment_id:",
                retorno
            );


            alert(
                "PIX criado, mas o ID do pagamento não foi retornado."
            );


            btnPix.disabled =
                false;


            btnPix.innerHTML =
                "Gerar PIX";


            return;

        }


        pagamentoId =
            String(
                retorno.payment_id
            ).trim();


        console.log(
            "Payment ID:",
            pagamentoId
        );


        document
            .getElementById(
                "pix"
            )
            .style
            .display =
            "block";


        document
            .getElementById(
                "statusPagamento"
            )
            .style
            .display =
            "block";


        document
            .getElementById(
                "statusPagamento"
            )
            .innerHTML =
            "Aguardando confirmação do pagamento...";


        document
            .getElementById(
                "qrcode"
            )
            .src =
            "data:image/png;base64," +
            retorno.qr_code_base64;


        document
            .getElementById(
                "copiacola"
            )
            .value =
            retorno.qr_code;


        btnPix.innerHTML =
            "PIX Gerado";


        campoCelular.disabled =
            true;


        iniciarVerificacao();

        iniciarContador();


    }catch(e){

        console.error(
            e
        );


        alert(
            "Erro ao conectar ao servidor."
        );


        btnPix.disabled =
            false;


        btnPix.innerHTML =
            "Gerar PIX";

    }

}


// =====================================================
// COPIAR PIX
// =====================================================

async function copiarPix(){

    try{

        await navigator
            .clipboard
            .writeText(
                document
                    .getElementById(
                        "copiacola"
                    )
                    .value
            );


        alert(
            "Código PIX copiado."
        );


    }catch{

        const campo =
            document.getElementById(
                "copiacola"
            );


        campo.select();


        document.execCommand(
            "copy"
        );


        alert(
            "Código PIX copiado."
        );

    }

}


// =====================================================
// VERIFICA PAGAMENTO
// =====================================================

let timerPagamento =
    null;


function iniciarVerificacao(){

    if(
        timerPagamento
    ){

        clearInterval(
            timerPagamento
        );

    }


    timerPagamento =
        setInterval(
            verificarPagamento,
            5000
        );

}


async function verificarPagamento(){

    if(
        !pagamentoId
    ){

        return;

    }


    const {
        data,
        error
    } = await db

        .from("hotspot_pagamentos")

        .select("*")

        .eq(
            "payment_id",
            String(
                pagamentoId
            )
        )

        .maybeSingle();


    console.log(
        "Payment ID:",
        pagamentoId
    );


    console.log(
        "DATA:",
        data
    );


    console.log(
        "ERROR:",
        error
    );


    if(error){

        console.error(
            error
        );


        return;

    }


    if(!data){

        console.log(
            "Pagamento ainda não encontrado:",
            pagamentoId
        );


        return;

    }


    console.log(
        "STATUS:",
        data.status
    );


    if(

        data.status ===
        "approved"

        ||

        data.payment_status ===
        "approved"

    ){

        clearInterval(
            timerPagamento
        );


        clearInterval(
            timerPix
        );


        localStorage.setItem(
            "nomePlano",
            planoAtual.nome
        );


        localStorage.setItem(
            "tempoPlano",
            planoAtual.tempo_minutos +
            " minutos"
        );


        /*
         * Guarda o celular localmente.
         * Isso NÃO substitui o banco.
         * Serve apenas para manter o número
         * disponível durante o fluxo.
         */

        const celular =
            obterCelular();


        localStorage.setItem(
            "hotspot_celular",
            celular
        );

        localStorage.setItem(
            "hotspot_nome",
            nome
        );


        localStorage.setItem(
            "hotspot_pagamento_id",
            String(
                pagamentoId
            )
        );


        window.location.href =

            `sucesso.html?` +

            `app_id=${
                encodeURIComponent(
                    APP_ID
                )
            }` +

            `&mac=${
                encodeURIComponent(
                    MAC
                )
            }` +

            `&ip=${
                encodeURIComponent(
                    IP
                )
            }` +

            `&celular=${
                encodeURIComponent(
                    celular
                )
            }` +

            `&nome=${
                encodeURIComponent(
                    nome
                )
            }` +

            `&pagamento_id=${
                encodeURIComponent(
                    pagamentoId
                )
            }` +

            `&link_login=${
                encodeURIComponent(
                    LINK_LOGIN
                )
            }` +

            `&link_orig=${
                encodeURIComponent(
                    LINK_ORIG
                )
            }` +

            `&chap_id=${
                encodeURIComponent(
                    CHAP_ID
                )
            }` +

            `&chap=${
                encodeURIComponent(
                    CHAP
                )
            }`;


        return;

    }


    console.log(
        "Ainda pendente..."
    );

}


// =====================================================
// CONTADOR DO PIX
// =====================================================

let tempoRestante =
    30 * 60;


let timerPix =
    null;


function iniciarContador(){

    if(
        timerPix
    ){

        clearInterval(
            timerPix
        );

    }


    tempoRestante =
        30 * 60;


    atualizarContador();


    timerPix =
        setInterval(

            ()=>{

                tempoRestante--;


                atualizarContador();


                if(
                    tempoRestante <= 0
                ){

                    clearInterval(
                        timerPix
                    );


                    clearInterval(
                        timerPagamento
                    );


                    document
                        .getElementById(
                            "statusPagamento"
                        )
                        .innerHTML = `

                            ⌛ PIX expirado

                            <br><br>

                            <button
                                onclick="novoPix()"
                            >

                                Gerar Novo PIX

                            </button>

                        `;

                }

            },

            1000

        );

}


function atualizarContador(){

    const min =
        Math.floor(
            tempoRestante /
            60
        );


    const seg =
        tempoRestante %
        60;


    document
        .getElementById(
            "statusPagamento"
        )
        .innerHTML = `

            ⏳ Aguardando pagamento...

            <br><br>

            Tempo restante:

            <strong>

                ${
                    String(min)
                    .padStart(2,"0")
                }:

                ${
                    String(seg)
                    .padStart(2,"0")
                }

            </strong>

        `;

}


// =====================================================
// NOVO PIX
// =====================================================

function novoPix(){

    clearInterval(
        timerPix
    );


    clearInterval(
        timerPagamento
    );


    document
        .getElementById(
            "pix"
        )
        .style
        .display =
        "none";


    document
        .getElementById(
            "btnPix"
        )
        .disabled =
        false;


    document
        .getElementById(
            "btnPix"
        )
        .innerHTML =
        "Gerar PIX";


    campoCelular.disabled =
        false;


    gerarPix();

}
