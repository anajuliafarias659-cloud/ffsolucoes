<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Festejos - Wi-Fi Gratuito Patrocinado</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f3f4f6;color:#333}
.topo{background:linear-gradient(135deg,#0d8db8,#055570);color:#fff;padding:25px 20px;text-align:center;border-bottom-left-radius:20px;border-bottom-right-radius:20px;box-shadow:0 4px 10px rgba(0,0,0,.15)}
.logo{width:90px;height:90px;border-radius:50%;object-fit:contain;background:#fff;padding:5px;margin-bottom:10px;box-shadow:0 2px 5px rgba(0,0,0,.2)}
.topo h1{font-size:22px;margin-bottom:5px}
.topo p{font-size:14px;opacity:.9}
.container{max-width:420px;margin:0 auto;padding:20px 15px}
.patrocinador-master{background:#fff;border:2px solid #ffd700;border-radius:12px;padding:15px;margin-bottom:20px;text-align:center;box-shadow:0 4px 12px rgba(255,215,0,.15);position:relative}
.tag-master{position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:#ffd700;color:#333;font-size:10px;font-weight:bold;padding:3px 12px;border-radius:10px;text-transform:uppercase}
.banner-patrocinio{width:100%;height:140px;object-fit:cover;border-radius:8px;margin-top:5px;background:#e5e7eb}
.nome-master{font-weight:bold;margin-top:8px;color:#555}
.card-login{background:#fff;padding:20px;border-radius:12px;box-shadow:0 3px 8px rgba(0,0,0,.08);text-align:center}
.card-login h2{font-size:18px;margin-bottom:15px;color:#0d8db8}
.input-group{margin-bottom:12px;text-align:left}
.input-group label{font-size:12px;font-weight:bold;color:#666;display:block;margin-bottom:4px}
.input-group input{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;font-size:15px;outline:none}
.termos{font-size:11px;color:#666;margin:15px 0;line-height:1.4;text-align:left}
.termos input{margin-right:6px}
.btn-conectar{width:100%;padding:14px;border:none;border-radius:8px;background:#25d366;color:#fff;font-size:16px;font-weight:bold;cursor:pointer;box-shadow:0 3px 6px rgba(37,211,102,.3)}
.btn-conectar:disabled{background:#aaa;cursor:not-allowed}
.rodape-patrocinadores{margin-top:25px;text-align:center}
.rodape-patrocinadores h4{font-size:12px;color:#888;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px}
.logos-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.logo-parceiro{background:#fff;padding:8px;border-radius:8px;min-height:75px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 4px rgba(0,0,0,.05)}
.logo-parceiro img{max-width:100%;max-height:60px;object-fit:contain}
#mensagem-erro{color:#dc2626;font-size:13px;margin-bottom:10px;display:none}
@media(max-width:350px){.logos-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<div id="loading-screen" style="padding:40px;text-align:center;display:none">
<h3>Carregando Wi-Fi Oficial...</h3>
</div>

<div id="app-content">
<div id="empresa">
<div class="topo">
<img id="logo-cidade" class="logo"
src=""
alt="Logo do evento"
style="display:none">
<h1 id="nome-festa">Festejos de São Raimundo Nonato</h1>
<p id="descricao-festa">Conecte-se gratuitamente oferecido por nossos patrocinadores.</p>
</div>
</div>

<div class="container">

<div class="patrocinador-master" id="bloco-master" style="display:none">
<div class="tag-master">Patrocinador Master</div>
<a id="link-master" href="#" target="_blank" rel="noopener noreferrer">
<img class="banner-patrocinio" id="banner-master" alt="Patrocinador Master">
</a>
<div class="nome-master" id="nome-master"></div>
</div>

<div class="card-login">
<h2>Acesso Gratuito à Internet</h2>
<div id="mensagem-erro"></div>

<form id="form-hotspot" onsubmit="liberarInternet(event)">
<div class="input-group">
<label for="txt-nome">Nome Completo</label>
<input type="text" id="txt-nome" placeholder="Digite seu nome" required>
</div>

<div class="input-group">
<label for="txt-whatsapp">WhatsApp (com DDD)</label>
<input type="tel" id="txt-whatsapp" placeholder="(00) 99999-9999" required>
</div>

<div class="termos">
<label>
<input type="checkbox" id="chk-termos" required>
Aceito os termos de uso e autorizo o recebimento de novidades e promoções dos patrocinadores.
</label>
</div>

<button type="submit" class="btn-conectar" id="btn-entrar">
📶 LIBERAR WI-FI GRÁTIS
</button>
</form>
</div>

<div class="rodape-patrocinadores" id="bloco-apoio" style="display:none">
<h4>Apoio Local</h4>
<div class="logos-grid" id="grid-apoio"></div>
</div>

</div>
</div>

<script>
const db = window.supabase.createClient(
    "https://pdajixsoowcyhnjwhgpc.supabase.co",
    "sb_publishable_LatlFlcxk6IchHe3RNmfwA_9Oq4EsZw"
);

const params = new URLSearchParams(window.location.search);

/*
 * O MikroTik envia estes parâmetros para a página:
 * mac, ip, link-login e link-orig.
 */
const MAC = params.get("mac") || "";
const IP = params.get("ip") || "";
const LINK_LOGIN = params.get("link-login") || "";
const LINK_ORIG = params.get("link-orig") || "";

/*
 * O APP_ID precisa ser o mesmo usado no hotspot_config
 * e em hotspot_patrocinadores.
 */
const APP_ID =
    params.get("app_id") ||
    "e56fa5a4-0d73-4299-9d3c-b671d191ffba";


function mostrarErro(mensagem) {

    const el = document.getElementById("mensagem-erro");

    el.textContent = mensagem || "";

    el.style.display =
        mensagem ? "block" : "none";
}


/* =========================================================
   CONFIGURAÇÃO DO EVENTO
========================================================= */

async function carregarConfiguracoes() {

    try {

        const { data, error } = await db
            .from("hotspot_config")
            .select(`
                nome_hotspot,
                descricao,
                logo,
                evento_nome,
                evento_descricao,
                patrocinador_master_nome,
                patrocinador_master_url,
                patrocinador_master_banner,
                exibir_patrocinadores
            `)
            .eq("app_id", APP_ID)
            .maybeSingle();


        if (error) {

            console.error(
                "Erro ao carregar hotspot_config:",
                error
            );

            return;
        }


        if (!data) {

            console.warn(
                "Nenhuma configuração encontrada para APP_ID:",
                APP_ID
            );

            return;
        }


        /* NOME DO EVENTO */

        document.getElementById("nome-festa").textContent =
            data.evento_nome ||
            data.nome_hotspot ||
            "Festejos de São Raimundo Nonato";


        /* DESCRIÇÃO */

        document.getElementById("descricao-festa").textContent =
            data.evento_descricao ||
            data.descricao ||
            "Conecte-se gratuitamente oferecido por nossos patrocinadores.";


        /* LOGO */

        const logoCidade =
            document.getElementById("logo-cidade");

        if (data.logo) {

            logoCidade.src = data.logo;
            logoCidade.style.display = "block";

            logoCidade.onerror = function () {
                console.warn("Não foi possível carregar o logo salvo no banco:", data.logo);
                this.style.display = "none";
            };

        } else {

            logoCidade.style.display = "none";

        }


        /*
         * Se estiver desativado, não mostra patrocinadores.
         */

        if (data.exibir_patrocinadores === false) {

            document.getElementById(
                "bloco-master"
            ).style.display = "none";

            document.getElementById(
                "bloco-apoio"
            ).style.display = "none";

            return;
        }


        /* =====================================================
           PATROCINADOR MASTER
        ===================================================== */

        const blocoMaster =
            document.getElementById("bloco-master");

        const bannerMaster =
            document.getElementById("banner-master");

        const nomeMaster =
            document.getElementById("nome-master");

        const linkMaster =
            document.getElementById("link-master");


        if (data.patrocinador_master_banner) {

            bannerMaster.src =
                data.patrocinador_master_banner;

            blocoMaster.style.display =
                "block";

        } else {

            blocoMaster.style.display =
                "none";

        }


        if (data.patrocinador_master_nome) {

            nomeMaster.textContent =
                data.patrocinador_master_nome;

        } else {

            nomeMaster.textContent = "";

        }


        if (data.patrocinador_master_url) {

            linkMaster.href =
                data.patrocinador_master_url;

            linkMaster.target =
                "_blank";

            linkMaster.rel =
                "noopener noreferrer";

        } else {

            linkMaster.removeAttribute("href");

        }

    } catch (erro) {

        console.error(
            "Erro inesperado ao carregar configuração:",
            erro
        );

    }
}


/* =========================================================
   PATROCINADORES / APOIO
========================================================= */

async function carregarPatrocinadores() {

    try {

        /*
         * IMPORTANTE:
         *
         * A tabela atual usa:
         * id
         * app_id
         * nome
         * url
         * banner
         * ordem
         *
         * Não usar:
         * ativo
         * tipo
         * url_imagem
         * url_destino
         */

        const { data, error } = await db
            .from("hotspot_patrocinadores")
            .select(`
                id,
                app_id,
                nome,
                url,
                banner,
                ordem
            `)
            .eq("app_id", APP_ID)
            .order("ordem", {
                ascending: true
            });


        if (error) {

            console.error(
                "Erro ao carregar hotspot_patrocinadores:",
                error
            );

            return;
        }


        const blocoApoio =
            document.getElementById(
                "bloco-apoio"
            );

        const grid =
            document.getElementById(
                "grid-apoio"
            );


        grid.innerHTML = "";


        if (!data || data.length === 0) {

            blocoApoio.style.display =
                "none";

            return;
        }


        data.forEach(patrocinador => {

            /*
             * Sem imagem não cria o card.
             */

            if (!patrocinador.banner) {
                return;
            }


            const box =
                document.createElement("div");

            box.className =
                "logo-parceiro";


            const img =
                document.createElement("img");

            img.src =
                patrocinador.banner;

            img.alt =
                patrocinador.nome ||
                "Patrocinador";

            img.loading =
                "lazy";


            box.appendChild(img);


            /*
             * Se tiver URL, o logo fica clicável.
             */

            if (patrocinador.url) {

                box.style.cursor =
                    "pointer";

                box.title =
                    patrocinador.nome ||
                    "Abrir patrocinador";


                box.addEventListener(
                    "click",
                    function () {

                        window.open(
                            patrocinador.url,
                            "_blank",
                            "noopener,noreferrer"
                        );

                    }
                );

            }


            grid.appendChild(box);

        });


        if (grid.children.length > 0) {

            blocoApoio.style.display =
                "block";

        } else {

            blocoApoio.style.display =
                "none";

        }

    } catch (erro) {

        console.error(
            "Erro inesperado ao carregar patrocinadores:",
            erro
        );

    }
}


/* =========================================================
   REGISTRAR CLIENTE
========================================================= */

async function registrarLead(
    nome,
    whatsapp
) {

    /*
     * Não deixamos a conexão do cliente depender
     * da tabela de leads.
     */

    try {

        const { error } = await db
            .from("hotspot_leads")
            .insert([{

                app_id: APP_ID,

                nome: nome,

                whatsapp: whatsapp,

                mac: MAC,

                ip: IP,

                criado_em:
                    new Date().toISOString()

            }]);


        if (error) {

            console.warn(
                "Lead não registrado:",
                error.message
            );

        }

    } catch (erro) {

        console.warn(
            "Tabela de leads indisponível:",
            erro
        );

    }
}


/* =========================================================
   LIBERAR INTERNET
========================================================= */

async function liberarInternet(event) {

    event.preventDefault();


    const nome =
        document.getElementById(
            "txt-nome"
        ).value.trim();


    const whatsapp =
        document.getElementById(
            "txt-whatsapp"
        ).value.trim();


    const termos =
        document.getElementById(
            "chk-termos"
        ).checked;


    const btn =
        document.getElementById(
            "btn-entrar"
        );


    mostrarErro("");


    if (!nome) {

        mostrarErro(
            "Informe seu nome."
        );

        return;
    }


    if (!whatsapp) {

        mostrarErro(
            "Informe seu WhatsApp."
        );

        return;
    }


    if (!termos) {

        mostrarErro(
            "Aceite os termos para continuar."
        );

        return;
    }


    btn.disabled =
        true;

    btn.textContent =
        "CONECTANDO...";


    /*
     * Registro é secundário.
     * Mesmo se falhar, tentamos liberar.
     */

    await registrarLead(
        nome,
        whatsapp
    );


    /*
     * Modo Hotspot MikroTik.
     */

    if (LINK_LOGIN) {

        try {

            const form =
                document.createElement(
                    "form"
                );

            form.method =
                "POST";

            form.action =
                LINK_LOGIN;


            /*
             * Usuário especial usado
             * pelo fluxo gratuito patrocinado.
             */

            const campos = {

                username:
                    "GRATUITO_PATROCINADO",

                password:
                    "",

                dst:
                    LINK_ORIG,

                popup:
                    "true"

            };


            Object.keys(campos)
                .forEach(nomeCampo => {

                    const input =
                        document.createElement(
                            "input"
                        );

                    input.type =
                        "hidden";

                    input.name =
                        nomeCampo;

                    input.value =
                        campos[nomeCampo];

                    form.appendChild(
                        input
                    );

                });


            document.body.appendChild(
                form
            );


            form.submit();

            return;

        } catch (erro) {

            console.error(
                "Erro ao enviar login MikroTik:",
                erro
            );

            mostrarErro(
                "Não foi possível liberar o Wi-Fi. Tente novamente."
            );

        }

    } else {

        /*
         * Quando aberto fora do portal do MikroTik.
         */

        mostrarErro(
            "Página aberta fora do portal do Wi-Fi."
        );

    }


    btn.disabled =
        false;

    btn.textContent =
        "📶 LIBERAR WI-FI GRÁTIS";
}


/* =========================================================
   INICIALIZAÇÃO
========================================================= */

async function iniciar() {

    await carregarConfiguracoes();

    await carregarPatrocinadores();

}


iniciar();

</script>
</body>
</html>
