<script>

const db = window.supabase.createClient(
    "https://pdajixsoowcyhnjwhgpc.supabase.co",
    "sb_publishable_LatlFlcxk6IchHe3RNmfwA_9Oq4EsZw"
);

const params = new URLSearchParams(location.search);

const APP_ID = params.get("app_id");

const PAGINA_ATUAL = location.pathname.split("/").pop();

const LINK_LOGIN =
    params.get("link-login-only") ||
    params.get("link-login") ||
    "";

const LINK_ORIG = params.get("link-orig") || "";

async function verificarModelo(){

    if(!APP_ID){
        document.body.innerHTML = `
            <div style="padding:40px;text-align:center">
                <h2>APP_ID não informado</h2>
            </div>
        `;
        return;
    }

    const { data, error } = await db
        .from("hotspot_config")
        .select("modelo")
        .eq("app_id", APP_ID)
        .single();

    if(error){
        console.error(error);
        return;
    }

    if(
        data?.modelo &&
        data.modelo !== PAGINA_ATUAL
    ){
        location.replace(
            data.modelo + location.search
        );
        return;
    }

}

verificarModelo();

function login(usuario, senha){

    const form = document.createElement("form");

    form.method = "POST";
    form.action = LINK_LOGIN;

    form.innerHTML = `
        <input type="hidden" name="username" value="${usuario}">
        <input type="hidden" name="password" value="${senha}">
        <input type="hidden" name="dst" value="${LINK_ORIG}">
        <input type="hidden" name="popup" value="true">
    `;

    document.body.appendChild(form);
    form.submit();

}

</script>
