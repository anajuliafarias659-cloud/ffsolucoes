<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1b29">
<title>Acompanhar Serviço | FF Soluções</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:radial-gradient(circle at top left,#15394a 0,transparent 38%),#0b1b29;color:#fff;padding:20px}
h1{text-align:center;color:#1de9b6;margin:18px 0 8px}
.subtitulo{text-align:center;color:#c0d0dc;line-height:1.5;margin:0 auto 24px;max-width:520px}
.container{max-width:560px;margin:0 auto;background:linear-gradient(135deg,#205c43,#432477);padding:25px;border:1px solid rgba(255,255,255,.12);border-radius:20px;box-shadow:0 18px 45px rgba(0,0,0,.25)}
label{display:block;margin:4px 0 8px;font-weight:bold;font-size:14px}
input,button{width:100%;padding:14px;border-radius:12px;margin-top:10px;font-size:16px}
input{border:1px solid #78909c;background:#0b1b29;color:#fff;outline:none}
input:focus{border-color:#1de9b6;box-shadow:0 0 0 3px rgba(29,233,182,.13)}
button{border:none;background:#fff;color:#153329;font-weight:bold;cursor:pointer}
button:disabled{opacity:.65;cursor:wait}
.resultado{margin-top:20px;padding:0;border-radius:12px;font-size:15px;line-height:1.55;overflow-wrap:anywhere}
.resultado:empty{display:none}
.card{padding:16px;margin-top:13px;background:rgba(0,0,0,.19);border:1px solid rgba(255,255,255,.1);border-radius:14px}
.card h2{font-size:16px;margin:0 0 12px;color:#9fffe1}
.campo{margin:9px 0}
.campo strong{color:#e7fff7}
.status-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;color:#fff;background:linear-gradient(135deg,#087f68,#075985);border:2px solid #1de9b6;margin:0;padding:15px;border-radius:12px;cursor:pointer;font-weight:bold;box-shadow:0 4px 12px rgba(0,0,0,.2);transition:transform .2s,filter .2s}
.status-toggle:hover{filter:brightness(1.15);transform:translateY(-1px)}
.status-toggle:focus-visible{outline:3px solid #fff;outline-offset:3px}
.status-label{display:inline-block;padding:6px 11px;border-radius:20px;background:#e0fff5;color:#075943;font-weight:bold;font-size:13px;white-space:nowrap}
.status-seta{font-size:23px;line-height:1;color:#9fffe1}
.status-conteudo{display:none;padding:16px;margin-top:10px;background:rgba(0,0,0,.22);border:1px solid rgba(29,233,182,.25);border-radius:12px}
.status-conteudo.aberto{display:block}
.relato{white-space:pre-wrap;overflow-wrap:anywhere;color:#e4edf2;line-height:1.6}
.ajuda{text-align:center;color:#b9c8d3;font-size:12px;line-height:1.5;margin:16px auto 0;max-width:500px}
@media(max-width:480px){body{padding:14px}.container{padding:18px}.status-toggle{gap:8px;padding:12px}.status-label{font-size:12px;padding:5px 8px}}
</style>
</head>
<body>
<h1>📋 Acompanhar Serviço</h1>
<p class="subtitulo">Consulte sua solicitação e veja as atualizações da equipe da FF Soluções.</p>

<div class="container">
  <label for="codigoInput">Código de atendimento</label>
  <input type="text" id="codigoInput" placeholder="Ex.: ORC-3399" autocomplete="off" maxlength="40">
  <button type="button" id="btnVerificar">Consultar meu pedido</button>
  <div class="resultado" id="resultado" aria-live="polite"></div>
</div>
<p class="ajuda">Se você recebeu um link pelo WhatsApp, o código será preenchido automaticamente e a consulta iniciará sozinha.</p>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBgar59yF1k6XmfG0iNOXvWCWKIa9dHcdI",
  authDomain: "servicospc-b3382.firebaseapp.com",
  projectId: "servicospc-b3382"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const resultado = document.getElementById("resultado");
const codigoInput = document.getElementById("codigoInput");
const btnVerificar = document.getElementById("btnVerificar");
let unsubscribe = null;

function criarCampo(rotulo, valor) {
  const p = document.createElement("p");
  p.className = "campo";
  const strong = document.createElement("strong");
  strong.textContent = rotulo + ": ";
  p.appendChild(strong);
  p.appendChild(document.createTextNode(
    valor == null || String(valor).trim() === "" ? "Não informado" : String(valor)
  ));
  return p;
}

/*
 * O painel /apk/admin salva o relato escrito pelo administrador no campo "problema".
 * Os demais campos ficam como compatibilidade com versões anteriores.
 */
function obterRelatoAdmin(dados) {
  const campos = [
    "problema",
    "relatoAdmin", "relato_admin",
    "relatoEquipe", "relato_equipe",
    "descricaoAdmin", "descricao_admin",
    "descricaoProblema", "descricao_problema",
    "observacaoAdmin", "observacao_admin",
    "respostaAdmin", "resposta_admin",
    "atualizacao", "observacao"
  ];

  for (const campo of campos) {
    const valor = dados[campo];
    if (valor !== undefined && valor !== null && String(valor).trim() !== "") {
      return String(valor);
    }
  }
  return "";
}

function montarResultado(dados, codigo) {
  resultado.replaceChildren();

  // Dados originais da solicitação do cliente.
  const pedido = document.createElement("section");
  pedido.className = "card";
  const tituloPedido = document.createElement("h2");
  tituloPedido.textContent = "🧾 Sua solicitação";
  pedido.appendChild(tituloPedido);
  pedido.appendChild(criarCampo("Código de atendimento", codigo));
  pedido.appendChild(criarCampo("Nome", dados.nome));
  pedido.appendChild(criarCampo("Serviço solicitado", dados.servico));
  if (dados.sistema) pedido.appendChild(criarCampo("Sistema escolhido", dados.sistema));

  // A descrição original do cliente é mostrada separadamente, sem usar o campo "problema".
  pedido.appendChild(criarCampo("Descrição do pedido", dados.descricao));
  resultado.appendChild(pedido);

  const statusCard = document.createElement("section");
  statusCard.className = "card";
  const tituloStatus = document.createElement("h2");
  tituloStatus.textContent = "📍 Andamento do atendimento";
  statusCard.appendChild(tituloStatus);

  const toggle = document.createElement("button");
  toggle.type = "button";
  toggle.className = "status-toggle";
  toggle.setAttribute("aria-expanded", "false");

  const textoBotao = document.createElement("span");
  textoBotao.textContent = "👆 Clique para ver o relato da equipe";

  const badge = document.createElement("span");
  badge.className = "status-label";
  badge.textContent = String(dados.status || "Pendente");

  const seta = document.createElement("span");
  seta.className = "status-seta";
  seta.textContent = "＋";
  seta.setAttribute("aria-hidden", "true");
  toggle.append(textoBotao, badge, seta);

  const conteudo = document.createElement("div");
  conteudo.className = "status-conteudo";

  const tituloRelato = document.createElement("p");
  const strongRelato = document.createElement("strong");
  strongRelato.textContent = "👷 Relato da equipe:";
  tituloRelato.appendChild(strongRelato);
  conteudo.appendChild(tituloRelato);

  const relato = document.createElement("div");
  relato.className = "relato";
  const textoRelato = obterRelatoAdmin(dados);
  relato.textContent = textoRelato ||
    "Ainda não há relato da equipe para esta solicitação.";
  conteudo.appendChild(relato);

  toggle.addEventListener("click", () => {
    const aberto = conteudo.classList.toggle("aberto");
    toggle.setAttribute("aria-expanded", String(aberto));
    textoBotao.textContent = aberto
      ? "👆 Clique para ocultar o relato da equipe"
      : "👆 Clique para ver o relato da equipe";
    seta.textContent = aberto ? "−" : "＋";
  });

  statusCard.append(toggle, conteudo);
  resultado.appendChild(statusCard);
}

function mostrarMensagem(texto) {
  resultado.replaceChildren();
  const p = document.createElement("p");
  p.className = "card";
  p.textContent = texto;
  resultado.appendChild(p);
}

function verificar() {
  const codigo = codigoInput.value.trim().toUpperCase();
  if (!codigo) {
    mostrarMensagem("Digite seu código de atendimento ou abra o link recebido pelo WhatsApp.");
    codigoInput.focus();
    return;
  }

  if (unsubscribe) {
    unsubscribe();
    unsubscribe = null;
  }

  btnVerificar.disabled = true;
  btnVerificar.textContent = "Consultando...";
  mostrarMensagem("Buscando sua solicitação...");

  const servicoRef = doc(db, "servicos", codigo);
  unsubscribe = onSnapshot(servicoRef, (docSnap) => {
    btnVerificar.disabled = false;
    btnVerificar.textContent = "Consultar meu pedido";

    if (!docSnap.exists()) {
      mostrarMensagem("Código não encontrado. Confira o código recebido no WhatsApp e tente novamente.");
      return;
    }
    montarResultado(docSnap.data(), codigo);
  }, (erro) => {
    console.error("Erro ao consultar solicitação:", erro);
    btnVerificar.disabled = false;
    btnVerificar.textContent = "Consultar meu pedido";
    mostrarMensagem("Não foi possível consultar agora. Verifique sua conexão e tente novamente.");
  });
}

btnVerificar.addEventListener("click", verificar);
codigoInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") verificar();
});

const parametros = new URLSearchParams(window.location.search);
const codigoDaUrl = (parametros.get("codigo") || "").trim().toUpperCase();
if (codigoDaUrl) {
  codigoInput.value = codigoDaUrl;
  verificar();
}
</script>
</body>
</html>
