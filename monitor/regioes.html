

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FF Infra • Regiões</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial,sans-serif;background:#0f172a;color:#fff;margin:0}
header{background:#111827;padding:16px 24px;font-size:24px;font-weight:bold}
.container{padding:24px}
button{padding:10px 16px;border:0;border-radius:8px;background:#2563eb;color:#fff;cursor:pointer}
table{width:100%;border-collapse:collapse;margin-top:20px}
th,td{padding:12px;border:1px solid #374151}
thead{background:#1f2937}
.modal{display:none;position:fixed;inset:0;background:#0008}
.box{background:#111827;width:600px;max-width:95%;margin:60px auto;padding:20px;border-radius:12px}
input,select{width:100%;padding:10px;margin:8px 0;background:#0f172a;color:#fff;border:1px solid #374151;border-radius:8px}
</style>
</head>
<body>
<header>📍 FF Infra - Regiões</header>

<div class="container">
<button onclick="abrirModal()">Nova Região</button>

<table>
<thead>
<tr>
<th>Região</th>
<th>Gateway</th>
<th>Offline</th>
<th>Status Alerta</th>
<th>Telegram</th>
<th>Ações</th>
</tr>
</thead>
<tbody id="tabelaRegioes">
<tr><td colspan="6">Carregando...</td></tr>
</tbody>
</table>
</div>

<div class="modal" id="modal">
<div class="box">
<h2>Região</h2>
<input id="nome" placeholder="Nome">
<select id="gateway"></select>
<input id="limite" type="number" placeholder="Limite Offline">
<select id="telegram">
<option value="true">Telegram Ativado</option>
<option value="false">Telegram Desativado</option>
</select>
<br><br>
<button onclick="salvarRegiao()">Salvar</button>
<button onclick="fecharModal()">Cancelar</button>
</div>
</div>
<script>

const SUPABASE_URL = "https://pdajixsoowcyhnjwhgpc.supabase.co";
const SUPABASE_KEY = "sb_publishable_LatlFlcxk6IchHe3RNmfwA_9Oq4EsZw";

const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let APP_ID =
    new URLSearchParams(location.search).get("app_id");

if (!APP_ID) {
    APP_ID = sessionStorage.getItem("app_id");
}

if (!APP_ID) {
    APP_ID = localStorage.getItem("app_id");
}

console.log("APP_ID:", APP_ID);

let editando = null;

function abrirModal(){
    document.getElementById("modal").style.display = "block";
}

function fecharModal(){

    document.getElementById("modal").style.display="none";

    editando = null;

    document.getElementById("nome").value="";
    document.getElementById("limite").value="";
    document.getElementById("telegram").value="true";

}

async function editar(id){

    const { data, error } = await supabaseClient
        .from("monitor_regioes")
        .select("*")
        .eq("id", id)
        .eq("app_id", APP_ID)
        .single();

    if(error){
        alert(error.message);
        return;
    }

    editando = id;

    document.getElementById("nome").value = data.nome;
    document.getElementById("gateway").value = data.gateway_id;
    document.getElementById("limite").value = data.limite_queda;
    document.getElementById("telegram").value = String(data.telegram);

    abrirModal();
}
async function excluirRegiao(id){

    if(!confirm("Deseja excluir esta região?"))
        return;

    const { error } = await supabaseClient
        .from("monitor_regioes")
        .delete()
        .eq("id", id)
        .eq("app_id", APP_ID);

    if(error){
        alert(error.message);
        return;
    }

    carregarRegioes();

}
async function carregarGateways() {

    let consulta = supabaseClient
        .from("monitor_gateways")
        .select("*");

    if (APP_ID) {
        consulta = consulta.eq("app_id", APP_ID);
    }

    const { data, error } =
        await consulta.order("nome");

    if (error) {
        console.error(error);
        return;
    }

    gateway.innerHTML = "";

    (data || []).forEach(g => {

        gateway.innerHTML += `
            <option value="${g.id}">
                ${g.nome}
            </option>
        `;

    });

}

async function carregarRegioes(){

    // Carrega somente as regiões deste APP
    const { data: regioes, error } = await supabaseClient
        .from("monitor_regioes")
        .select("*")
        .eq("app_id", APP_ID)
        .order("nome");

    if(error){
        console.error(error);
        return;
    }

    // Carrega somente os gateways deste APP
    const { data: gateways, error: erroGateways } = await supabaseClient
        .from("monitor_gateways")
        .select("id,nome")
        .eq("app_id", APP_ID);

    if(erroGateways){
        console.error(erroGateways);
        return;
    }

    const mapa = {};

    (gateways || []).forEach(g => {
        mapa[g.id] = g.nome;
    });

    const tb = document.getElementById("tabelaRegioes");

    tb.innerHTML = "";

    (regioes || []).forEach(r => {

        tb.innerHTML += `
        <tr>
            <td>${r.nome}</td>
            <td>${mapa[r.gateway_id] || "-"}</td>
            <td>${r.limite_queda}</td>
            <td>${r.alerta_ativo ? "Sim" : "Não"}</td>
            <td>${r.telegram ? "Sim" : "Não"}</td>
            <td>
                <button onclick="editar('${r.id}')">Editar</button>
                <button onclick="excluirRegiao('${r.id}')">Excluir</button>
            </td>
        </tr>
        `;
    });

}

async function salvarRegiao() {

    const payload = {

        app_id: APP_ID,

        nome: document.getElementById("nome").value.trim(),

        gateway_id: document.getElementById("gateway").value,

        limite_queda: Number(document.getElementById("limite").value),

        telegram: document.getElementById("telegram").value === "true",

        ativo: true,

        alerta_ativo: false,

        ultimo_total: 0

    };

    let erro;

    if (editando) {

        ({ error: erro } = await supabaseClient
            .from("monitor_regioes")
            .update(payload)
            .eq("id", editando)
            .eq("app_id", APP_ID));

    } else {

        ({ error: erro } = await supabaseClient
            .from("monitor_regioes")
            .insert(payload));

    }

    if (erro) {
        console.error(erro);
        alert(erro.message);
        return;
    }

    fecharModal();

    carregarRegioes();

}
window.onload = async () => {

    try {

        await carregarGateways();

        await carregarRegioes();

    } catch (e) {

        console.error(e);

    }

}
</script>
</body>
</html>
