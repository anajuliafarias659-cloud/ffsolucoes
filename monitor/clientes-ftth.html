<script>

const SUPABASE_URL = "https://pdajixsoowcyhnjwhgpc.supabase.co";
const SUPABASE_KEY = "sb_publishable_LatlFlcxk6IchHe3RNmfwA_9Oq4EsZw";

window.supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


let APP_ID =
    new URLSearchParams(location.search).get("app_id");

if(!APP_ID){

    APP_ID = sessionStorage.getItem("app_id");

}

if(!APP_ID){

    APP_ID = localStorage.getItem("app_id");

}

let timerPesquisa;

function pesquisarServidor(){

    clearTimeout(timerPesquisa);

    timerPesquisa = setTimeout(async()=>{

        pagina = 1;

        await carregarEquipamentos();

    },300);

}

console.log("APP_ID:", APP_ID);

let equipamentos = [];
let gateways = [];
let editando = null;
let neighborSelecionado = null;
// PAGINAÇÃO
let pagina = 1;
let porPagina = 20;
let totalRegistros = 0;
/*===============================
ABRIR MODAL
===============================*/

function abrirNovo() {

    editando = null;

    document.getElementById("modal").style.display = "flex";

    document.getElementById("nome").value = "";
    document.getElementById("usuario_pppoe").value = "";
    document.getElementById("regiao").value = "";
    document.getElementById("gateway").value = "";
    document.getElementById("ip").value = "";
    document.getElementById("mac").value = "";
    document.getElementById("descricao").value = "";

}

async function carregarRegioes() {

    let consulta = window.supabaseClient
        .from("monitor_regioes")
        .select("id,nome")
        .order("nome");

    if (APP_ID) {
        consulta = consulta.eq("app_id", APP_ID);
    }

    const { data, error } = await consulta;

    if (error) {
        console.error(error);
        return;
    }

    const combo = document.getElementById("regiao");

    combo.innerHTML =
        '<option value="">Selecione uma região</option>';

    (data || []).forEach(r => {

        combo.innerHTML += `
            <option value="${r.nome}">
                ${r.nome}
            </option>
        `;

    });

}
async function atualizarTudo(){

    await carregarGateways();

    await carregarEquipamentos();

}
/*===============================
FECHAR MODAL
===============================*/

function fecharModal(){

    document.getElementById("modal").style.display="none";

}

/*===============================
CARREGA GATEWAYS
===============================*/

async function carregarGateways(){

    let consulta = window.supabaseClient
        .from("monitor_gateways")
        .select("*");

    if (APP_ID){
        consulta = consulta.eq("app_id", APP_ID);
    }

    const { data, error } = await consulta.order("nome");

    if(error){
        console.error(error);
        return;
    }

    gateways = data || [];

    const combo = document.getElementById("gateway");
    const filtro = document.getElementById("filtroGateway");

    combo.innerHTML = "";
    filtro.innerHTML = '<option value="">Todos os Gateways</option>';

    gateways.forEach(g => {

        combo.innerHTML += `
            <option value="${g.id}">
                ${g.nome}
            </option>
        `;

        filtro.innerHTML += `
            <option value="${g.id}">
                ${g.nome}
            </option>
        `;

    });

}
/*===============================
CARREGA EQUIPAMENTOS
===============================*/

async function carregarEquipamentos() {

    // Clientes online
const inicio = (pagina - 1) * porPagina;
const fim = inicio + porPagina - 1;

let consulta = window.supabaseClient
.from("monitor_pppoe")
.select("*", { count: "exact" })
.range(inicio, fim);

const busca = document
    .getElementById("pesquisa")
    .value
    .trim();

if (busca) {
    consulta = consulta.or(
        [
            `usuario.ilike.%${busca}%`,
            `endereco.ilike.%${busca}%`,
            `caller_id.ilike.%${busca}%`
        ].join(",")
    );
}

if (APP_ID) {
    consulta = consulta.eq("app_id", APP_ID);
}

const {
    data: pppoe,
    error,
    count
} = await consulta;

totalRegistros = count || 0;

    if (error) {
        console.error(error);
        return;
    }

    // Clientes cadastrados
let consultaClientes = window.supabaseClient
    .from("monitor_clientes")
    .select(`
        id,
        usuario_pppoe,
        regiao,
        onu_id,
        onu,
        porta_onu,
        onu_mac
    `);

if (APP_ID) {
    consultaClientes = consultaClientes.eq("app_id", APP_ID);
}

const {
    data: clientes,
    error: erroClientes
} = await consultaClientes;

const {
    data: onus,
    error: erroOnus
} = await window.supabaseClient
    .from("monitor_onus")
    .select("id,porta,onu,mac,mac_cliente,rx_power,tx_power,gateway_id");

if (erroClientes) {
    console.error(erroClientes);
    return;
}

if (erroOnus) {
    console.error(erroOnus);
    return;
}

const mapaClientes = {};
const mapaOnusCliente = {};

(clientes || []).forEach(c => {
    mapaClientes[(c.usuario_pppoe || "").trim()] = c;
});

(onus || []).forEach(o => {

    if (!o.mac_cliente) return;

    mapaOnusCliente[
        o.mac_cliente.toUpperCase()
    ] = o;

});

equipamentos = (pppoe || []).map(cliente => {

const cadastro = mapaClientes[
    (cliente.usuario || "").trim()
];

const onu = mapaOnusCliente[
    (cliente.caller_id || "")
        .trim()
        .toUpperCase()
];

 console.log(
    "PPPoE:",
    cliente.usuario,
    cliente.caller_id,
    "=>",
    onu
);
   return {

        id: cliente.id,
        gateway_id: cliente.gateway_id,

        nome: cliente.usuario,
        usuario_pppoe: cliente.usuario,

        regiao: cadastro?.regiao || "",

        ip: cliente.endereco,

        // MAC do roteador
        mac: cliente.caller_id,

        // Dados da ONU
onu: onu?.onu || cadastro?.onu || "-",

porta_onu: onu?.porta || cadastro?.porta_onu || "-",

onu_mac: onu?.mac || cadastro?.onu_mac || "-",
        rx_power: onu?.rx_power ?? "-",
        tx_power: onu?.tx_power ?? "-",

        interface: cliente.interface,
        uptime: cliente.uptime,

        status: cliente.uptime ? "online" : "offline"

    };


    }).sort((a, b) => {

        const gatewayA =
            gateways.find(g => g.id == a.gateway_id)?.nome || "";

        const gatewayB =
            gateways.find(g => g.id == b.gateway_id)?.nome || "";

        let comparacao = gatewayA.localeCompare(gatewayB);

        if (comparacao !== 0) return comparacao;

        comparacao = (a.regiao || "").localeCompare(b.regiao || "");

        if (comparacao !== 0) return comparacao;

        return (a.nome || "").localeCompare(b.nome || "");

    });

    atualizarCards();
carregarFiltroRegioes();
filtrarEquipamentos();
atualizarPaginacao();

}
/*===============================
ATUALIZA CARDS
===============================*/
function carregarFiltroRegioes(){

    const select = document.getElementById("filtroRegiao");

    if(!select) return;

    const atual = select.value;

    const regioes = [...new Set(
        equipamentos
            .map(e => e.regiao)
            .filter(Boolean)
    )].sort();

    select.innerHTML =
        '<option value="">Todas as Regiões</option>';

    regioes.forEach(regiao => {

        select.innerHTML +=
            `<option value="${regiao}">${regiao}</option>`;

    });

    select.value = atual;

}

function atualizarCards(){

    let online = 0;
    let offline = 0;

    equipamentos.forEach(cliente => {

        const status = calcularStatus(cliente);

        if(status === "online")
            online++;
        else
            offline++;

    });

    document.getElementById("totalEquipamentos").innerHTML =
        equipamentos.length;

    document.getElementById("equipamentosOnline").innerHTML =
        online;

    document.getElementById("equipamentosOffline").innerHTML =
        offline;

    document.getElementById("equipamentosDescoberta").innerHTML =
        new Set(
            equipamentos
                .map(c => c.regiao)
                .filter(Boolean)
        ).size;

}
function calcularStatus(eq){

    // Se existe uptime, considera online
    if (eq.uptime && eq.uptime !== "-")
        return "online";

    // Caso contrário usa o status salvo
    if (eq.status === "warning")
        return "warning";

    if (eq.status === "online")
        return "online";

    return "offline";

}

function corLatencia(lat){

    lat = Number(lat);

    if(!lat)
        return "#999";

    if(lat <= 5)
        return "#00e676";

    if(lat <= 20)
        return "#2ecc71";

    if(lat <= 50)
        return "#ffd600";

    if(lat <= 100)
        return "#ff9800";

    return "#ff5252";

}

function corPerda(perda){

    if(perda == null)
        return "#999";

    if(perda == 0)
        return "#2ecc71";

    if(perda <= 10)
        return "#f1c40f";

    if(perda <= 30)
        return "#ff9800";

    return "#ff5252";

}

function traduzirInterface(nome){

    if(!nome) return "-";

    nome = nome.toLowerCase();

    if(nome.startsWith("ether")){
        return "Porta " + nome.replace("ether","");
    }

    if(nome.startsWith("sfp-sfpplus")){
        return "SFP+ " + nome.replace("sfp-sfpplus","");
    }

    if(nome.startsWith("sfp")){
        return "SFP " + nome.replace("sfp","");
    }

    return nome;
}

        <tr>
            <td colspan="10">
                Nenhum cliente cadastrado.
            </td>
        </tr>`;

        return;

    }

    lista.forEach(eq=>{

        const status = calcularStatus(eq);

        tbody.innerHTML += `

<tr>

<td>

</td>

<td>

</td>

<td>

async function salvarEquipamento() {

    const nome = document.getElementById("nome").value.trim();

    const usuario_pppoe =
        document.getElementById("usuario_pppoe").value.trim();

    const regiao =
        document.getElementById("regiao").value.trim();

    const gateway =
        document.getElementById("gateway").value;

    const mac =
        document.getElementById("mac").value.trim().toUpperCase();

    const ip =
        document.getElementById("ip").value.trim();

    const observacao =
        document.getElementById("descricao").value.trim();

    // ===========================
    // VERIFICA MAC DUPLICADO
    // ===========================
    if (mac) {

        let consulta = window.supabaseClient
            .from("monitor_clientes")
            .select("id,nome")
            .eq("app_id", APP_ID)
            .eq("mac", mac);

        if (editando) {
            consulta = consulta.neq("id", editando.id);
        }

        const { data: existente, error: erroMac } =
            await consulta.maybeSingle();

        if (erroMac) {
            alert(erroMac.message);
            return;
        }

        if (existente) {
            alert(
                `Já existe um cliente cadastrado com este MAC.\n\nCliente: ${existente.nome}`
            );
            return;
        }

    }

    if (!gateway) {
        alert("Selecione um gateway.");
        return;
    }

    if (!usuario_pppoe) {
        alert("Informe o usuário PPPoE.");
        return;
    }

const dados = {

    app_id: APP_ID,

    gateway_id: gateway,

    nome,
    usuario_pppoe,
    regiao,

    ip: ip || neighborSelecionado?.endereco || "",
    mac: mac || neighborSelecionado?.caller_id || "",

    interface: neighborSelecionado?.interface || editando?.interface || "",
    uptime: neighborSelecionado?.uptime || editando?.uptime || "",

porta: neighborSelecionado
    ? traduzirInterface(neighborSelecionado.interface)
    : (editando?.porta || ""),

status: (neighborSelecionado || editando?.uptime)
    ? "online"
    : "offline",

monitorar: true,

    observacao

};

let error;

// Procura se já existe cadastro desse usuário
const { data: existente } = await window.supabaseClient
    .from("monitor_clientes")
    .select("id")
    .eq("usuario_pppoe", usuario_pppoe)
    .maybeSingle();

if (existente) {

    ({ error } = await window.supabaseClient
        .from("monitor_clientes")
        .update(dados)
        .eq("id", existente.id));

} else {

    ({ error } = await window.supabaseClient
        .from("monitor_clientes")
        .insert(dados));

}

console.log(error); // <-- aqui sim

if (error) {
    alert(error.message);
    return;
}

fecharModal();

await carregarEquipamentos();

}

            (e.ip || "").toLowerCase().includes(busca) ||

            (e.interface || "").toLowerCase().includes(busca) ||

    console.log("CLIENTE:", clienteSelecionado);

    let consulta = window.supabaseClient
        .from("monitor_onus")

.order("onu", { ascending: true })
    if (error) {
        alert(error.message);
        return;
    }

    // Se não encontrou pelo gateway, busca todas
    if (!data || data.length === 0) {

    console.warn("Nenhuma ONU encontrada para este gateway.");

    listaOnus = [];
    renderizarOnus(listaOnus);

                text-align:center;
                color:#999;">
                Nenhuma ONU encontrada.
            </div>
        `;

        return;

    }

    lista.forEach(o=>{

        div.innerHTML += `

<div
class="itemOnu"
onclick="selecionarOnu('${o.id}',this)"
style="

</div>

</div>

    });

}

function filtrarOnus(){

    const texto = document
        .getElementById("pesquisaOnu")
        .value
        .toLowerCase();

    const filtradas = listaOnus.filter(o=>{

        return (

            (o.mac || "")
            .toLowerCase()
            .includes(texto)

            ||

            (o.porta || "")
            .toLowerCase()
            .includes(texto)

            ||

            String(o.onu)
            .includes(texto)

        );

    });

    renderizarOnus(filtradas);

}

function selecionarOnu(id, elemento){

    onuSelecionada = id;

    document
        .querySelectorAll(".itemOnu")
        .forEach(item=>{

            item.style.border="1px solid #2d3852";
            item.style.background="transparent";

            const radio = item.querySelector("input");

            if(radio)
                radio.checked=false;

        });

    elemento.style.border="2px solid #00b96b";
    elemento.style.background="#162238";

    const radio = elemento.querySelector("input");

    if(radio)
        radio.checked=true;

}

async function salvarOnu() {

    if (!clienteSelecionado) {
        alert("Cliente não selecionado.");

    }

    if (!onuSelecionada) {
        alert("Selecione uma ONU.");
        return;

const { data, error } = await window.supabaseClient

function atualizarPaginacao(){

    const totalPaginas =
        Math.ceil(totalRegistros / porPagina);

    document.getElementById("textoPagina").innerHTML =
        `Página ${pagina} de ${totalPaginas}`;
}

async function proximaPagina(){

    if(pagina * porPagina >= totalRegistros)
        return;

    pagina++;

    await carregarEquipamentos();

}

async function paginaAnterior(){

    if(pagina == 1)
        return;

    pagina--;

    await carregarEquipamentos();

}

async function alterarQuantidade(){

    porPagina =
        Number(document.getElementById("porPagina").value);

    pagina = 1;

    await carregarEquipamentos();

}
