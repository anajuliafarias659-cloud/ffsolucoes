<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Agenda da Equipe</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:20px;
}

.container{
    max-width:1200px;
    margin:auto;
}

.topo{
    background:#fff;
    padding:20px;
    border-radius:12px;
    margin-bottom:20px;
    box-shadow:0 2px 5px rgba(0,0,0,.1);
}

h1{
    margin:0;
}

.card{
    background:#fff;
    padding:15px;
    border-radius:12px;
    margin-bottom:12px;
    box-shadow:0 2px 5px rgba(0,0,0,.1);
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
    gap:15px;
}

.cliente{
    font-size:20px;
    font-weight:bold;
}

.info{
    margin-top:6px;
}

.status{
    display:inline-block;
    padding:6px 12px;
    border-radius:20px;
    color:white;
    font-size:12px;
    margin-top:10px;
}

.aguardando{
    background:#f59e0b;
}

.atendimento{
    background:#0d8db8;
}

.finalizado{
    background:#16a34a;
}

.cancelado{
    background:#dc2626;
}

select{
    width:100%;
    padding:10px;
    border-radius:8px;
    border:1px solid #ddd;
}

button{
    border:none;
    padding:10px;
    border-radius:8px;
    color:white;
    cursor:pointer;
    margin-top:8px;
    width:100%;
}

.btn-atendimento{
    background:#0d8db8;
}

.btn-finalizado{
    background:#16a34a;
}

.btn-cancelado{
    background:#dc2626;
}

/* ÁREA DOS CANCELADOS */

.cancelados-box{
    margin-top:25px;
}

.btn-toggle-cancelados{
    background:#555;
    width:100%;
    font-weight:bold;
    font-size:15px;
    padding:13px;
}

.lista-cancelados{
    display:none;
    margin-top:15px;
}

.lista-cancelados.aberto{
    display:grid;
}

.card-cancelado{
    opacity:.85;
    border-left:5px solid #dc2626;
}

.aviso-vazio{
    background:#fff;
    padding:15px;
    border-radius:12px;
    color:#666;
    text-align:center;
}

</style>
</head>

<body>

<div class="container">

<div class="topo">

<h1 id="titulo">
📅 Agenda da Barbearia
</h1>

<br>

<select id="filtroProfissional"
onchange="renderizarAgenda()">

<option value="">
Todos os profissionais
</option>

</select>

</div>

<!-- NOVOS / ATIVOS -->

<div id="agenda" class="grid"></div>

<!-- CANCELADOS RECOLHIDOS -->

<div class="cancelados-box">

<button
id="btnCancelados"
class="btn-toggle-cancelados"
onclick="toggleCancelados()">

🚫 Cancelados (0) — Mostrar

</button>

<div
id="cancelados"
class="grid lista-cancelados">
</div>

</div>

</div>

<script>

const db = window.supabase.createClient(
"https://pdajixsoowcyhnjwhgpc.supabase.co",
"sb_publishable_LatlFlcxk6IchHe3RNmfwA_9Oq4EsZw"
);

let AGENDAMENTOS = [];
let PROFISSIONAIS = [];
let SERVICOS = [];

let canceladosAbertos = false;

const params =
new URLSearchParams(location.search);

const codigo =
params.get("codigo");

if(!codigo){

    document.body.innerHTML =
    "<h2>Código inválido.</h2>";

    throw new Error("Código inválido");
}

async function carregar(){

    const { data: config, error: configError } = await db
    .from("barbearia_config")
    .select("*")
    .eq("codigo_agenda", codigo)
    .single();

    if(configError){
        console.error("ERRO CONFIG:", configError);
    }

    if(!config){

        document.body.innerHTML =
        "<h2>Acesso não autorizado.</h2>";

        return;
    }

    document.getElementById(
        "titulo"
    ).innerText =
    "📅 " + (config.nome_salao || "Agenda");

    const app_id = config.app_id;

    const { data: profissionais, error: profissionaisError } = await db
    .from("barbearia_profissionais")
    .select("*")
    .eq("app_id", app_id);

    if(profissionaisError){
        console.error("ERRO PROFISSIONAIS:", profissionaisError);
    }

    const { data: servicos, error: servicosError } = await db
    .from("barbearia_servicos")
    .select("*")
    .eq("app_id", app_id);

    if(servicosError){
        console.error("ERRO SERVICOS:", servicosError);
    }

    const { data: agendamentos, error: agendamentosError } = await db
    .from("barbearia_agendamentos")
    .select("*")
    .eq("app_id", app_id)
    .order("data_agendamento")
    .order("hora_agendamento");

    if(agendamentosError){
        console.error("ERRO AGENDAMENTOS:", agendamentosError);
    }

    PROFISSIONAIS = profissionais || [];
    SERVICOS = servicos || [];
    AGENDAMENTOS = agendamentos || [];

    preencherFiltro();

    renderizarAgenda();
}

function preencherFiltro(){

    const select =
    document.getElementById(
        "filtroProfissional"
    );

    const valorAtual = select.value;

    select.innerHTML =
    '<option value="">Todos os profissionais</option>';

    PROFISSIONAIS.forEach(p=>{

        select.innerHTML += `
        <option value="${p.id}">
        ${p.nome}
        </option>
        `;
    });

    if(valorAtual){
        select.value = valorAtual;
    }
}

function criarCard(item, cancelado = false){

    const profissional =
    PROFISSIONAIS.find(
        p => p.id == item.profissional_id
    );

    const servico =
    SERVICOS.find(
        s => s.id == item.servico_id
    );

    const status =
    item.status || "aguardando";

    return `
    <div class="card ${cancelado ? 'card-cancelado' : ''}">

        <div class="cliente">
            ${item.cliente_nome || ''}
        </div>

        <div class="info">
            📞 ${item.telefone || ''}
        </div>

        <div class="info">
            👨‍💼 ${profissional?.nome || ''}
        </div>

        <div class="info">
            ✂️ ${servico?.nome || ''}
        </div>

        <div class="info">
            📅 ${item.data_agendamento || ''}
        </div>

        <div class="info">
            ⏰ ${item.hora_agendamento || ''}
        </div>

        <div class="status ${status}">
            ${status.toUpperCase()}
        </div>

        ${
            !cancelado &&
            status !== "cancelado" &&
            status !== "finalizado"
            ? `
            <button
            class="btn-atendimento"
            onclick="alterarStatus(${item.id},'atendimento')">
            Em Atendimento
            </button>

            <button
            class="btn-finalizado"
            onclick="alterarStatus(${item.id},'finalizado')">
            Finalizado
            </button>

            <button
            class="btn-cancelado"
            onclick="alterarStatus(${item.id},'cancelado')">
            Cancelado
            </button>
            `
            : ""
        }

    </div>
    `;
}

function renderizarAgenda(){

    const filtro =
    document.getElementById(
        "filtroProfissional"
    ).value;

    const lista = AGENDAMENTOS.filter(item => {

        if(!filtro) return true;

        return item.profissional_id == filtro;
    });

    /*
     * CANCELADOS ficam separados e recolhidos.
     */
    const cancelados = lista.filter(
        item => (item.status || "aguardando") === "cancelado"
    );

    /*
     * A tela principal mostra somente os agendamentos
     * que ainda estão ativos/finalizados.
     */
    const ativos = lista.filter(
        item => (item.status || "aguardando") !== "cancelado"
    );

    let htmlAtivos = "";

    if(ativos.length === 0){

        htmlAtivos = `
        <div class="card">
            Nenhum novo agendamento encontrado.
        </div>
        `;

    }else{

        ativos.forEach(item => {
            htmlAtivos += criarCard(item, false);
        });

    }

    document.getElementById("agenda").innerHTML =
    htmlAtivos;

    let htmlCancelados = "";

    if(cancelados.length === 0){

        htmlCancelados = `
        <div class="aviso-vazio">
            Nenhum agendamento cancelado.
        </div>
        `;

    }else{

        cancelados.forEach(item => {
            htmlCancelados += criarCard(item, true);
        });

    }

    const divCancelados =
    document.getElementById("cancelados");

    divCancelados.innerHTML =
    htmlCancelados;

    /*
     * Mantém aberto somente se o usuário já abriu.
     */
    if(canceladosAbertos){

        divCancelados.classList.add("aberto");

    }else{

        divCancelados.classList.remove("aberto");

    }

    const botao =
    document.getElementById("btnCancelados");

    botao.innerText =
    `🚫 Cancelados (${cancelados.length}) — ${
        canceladosAbertos
        ? "Ocultar"
        : "Mostrar"
    }`;
}

function toggleCancelados(){

    canceladosAbertos =
    !canceladosAbertos;

    const div =
    document.getElementById("cancelados");

    if(canceladosAbertos){

        div.classList.add("aberto");

    }else{

        div.classList.remove("aberto");

    }

    const quantidade =
    AGENDAMENTOS.filter(
        item => (item.status || "aguardando") === "cancelado"
    ).filter(item => {

        const filtro =
        document.getElementById(
            "filtroProfissional"
        ).value;

        if(!filtro) return true;

        return item.profissional_id == filtro;

    }).length;

    document.getElementById(
        "btnCancelados"
    ).innerText =
    `🚫 Cancelados (${quantidade}) — ${
        canceladosAbertos
        ? "Ocultar"
        : "Mostrar"
    }`;
}

async function alterarStatus(id,status){

    if(status === "cancelado"){

        const confirmar = confirm(
            "Confirmar cancelamento deste agendamento?\n\n" +
            "O horário ficará livre novamente para o profissional."
        );

        if(!confirmar){
            return;
        }
    }

    const { data, error } = await db
    .from("barbearia_agendamentos")
    .update({
        status: status
    })
    .eq("id", id)
    .select();

    console.log("DATA:", data);
    console.log("ERROR:", error);

    if(error){
        alert(error.message);
        return;
    }

    if(status === "cancelado"){

        alert(
            "Agendamento cancelado!\n\n" +
            "O horário do profissional está livre novamente."
        );
    }

    await carregar();
}

carregar();

setInterval(
    carregar,
    30000
);

</script>

</body>
</html>
