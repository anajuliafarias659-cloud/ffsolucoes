<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d8db8">
<title>FF Cobrança</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f3f4f6;
  color:#202124;
  min-height:100vh;
}

.topo{
  background:linear-gradient(135deg,#0d8db8,#08749a);
  color:#fff;
  padding:18px 14px 20px;
  text-align:center;
  box-shadow:0 3px 12px rgba(0,0,0,.18);
}

.topo h1{
  font-size:22px;
  margin-bottom:5px;
}

.topo p{
  font-size:13px;
  opacity:.92;
}

.container{
  width:100%;
  max-width:520px;
  margin:0 auto;
  padding:18px 12px 30px;
}

.card{
  background:#fff;
  border-radius:18px;
  padding:20px 16px;
  margin-bottom:14px;
  border:1px solid #e5e7eb;
  box-shadow:0 4px 14px rgba(0,0,0,.07);
}

.valor-label{
  text-align:center;
  color:#666;
  font-size:15px;
  margin-bottom:8px;
}

.valor{
  text-align:center;
  font-size:43px;
  font-weight:800;
  color:#0d8db8;
  margin-bottom:18px;
  word-break:break-word;
}

.valor-input{
  width:100%;
  height:64px;
  border:2px solid #d1d5db;
  border-radius:14px;
  text-align:center;
  font-size:30px;
  font-weight:700;
  outline:none;
  color:#222;
  background:#fff;
}

.valor-input:focus{
  border-color:#0d8db8;
  box-shadow:0 0 0 3px rgba(13,141,184,.12);
}

label{
  display:block;
  font-size:14px;
  font-weight:700;
  margin:15px 0 7px;
}

input[type="text"],
input[type="tel"]{
  width:100%;
  height:50px;
  padding:0 13px;
  border:1px solid #d1d5db;
  border-radius:11px;
  font-size:16px;
  outline:none;
}

input[type="text"]:focus,
input[type="tel"]:focus{
  border-color:#0d8db8;
  box-shadow:0 0 0 3px rgba(13,141,184,.12);
}

button{
  width:100%;
  min-height:52px;
  border:0;
  border-radius:12px;
  padding:12px 15px;
  font-size:17px;
  font-weight:700;
  cursor:pointer;
}

.btn-cobrar{
  background:#0d8db8;
  color:#fff;
  margin-top:18px;
  box-shadow:0 4px 10px rgba(13,141,184,.25);
}

button:active{
  transform:scale(.985);
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.pix{
  display:none;
  text-align:center;
}

.pix h2{
  font-size:21px;
  margin-bottom:5px;
}

.valor-pix{
  color:#0d8db8;
  font-size:28px;
  font-weight:800;
  margin:8px 0 15px;
}

#qrcode{
  display:block;
  width:250px;
  height:250px;
  max-width:100%;
  margin:0 auto 15px;
  padding:7px;
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:12px;
  object-fit:contain;
}

#copiacola{
  width:100%;
  min-height:105px;
  resize:none;
  padding:11px;
  border:1px solid #d1d5db;
  border-radius:10px;
  font-size:12px;
  line-height:1.4;
  background:#f9fafb;
  outline:none;
}

.btn-copiar{
  background:#374151;
  color:#fff;
  margin-top:10px;
}

.status{
  display:none;
  margin-top:14px;
  padding:15px;
  border-radius:13px;
  text-align:center;
  background:#f8fafc;
  border:1px solid #e2e8f0;
  color:#444;
  line-height:1.5;
}

.status strong{
  color:#0d8db8;
  font-size:21px;
}

.sucesso{
  display:none;
  text-align:center;
  padding:26px 18px;
}

.sucesso .check{
  width:76px;
  height:76px;
  border-radius:50%;
  background:#dcfce7;
  color:#16803c;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:44px;
  margin:0 auto 14px;
}

.sucesso h2{
  color:#16803c;
  margin-bottom:8px;
}

.sucesso .valor-final{
  font-size:32px;
  font-weight:800;
  color:#16803c;
  margin:10px 0 20px;
}

.btn-nova{
  background:#0d8db8;
  color:#fff;
}

.erro{
  display:none;
  margin-top:12px;
  padding:12px;
  border-radius:10px;
  background:#fee2e2;
  color:#991b1b;
  font-size:14px;
  text-align:center;
}

.rodape{
  text-align:center;
  color:#888;
  font-size:12px;
  padding:5px 0 20px;
}

@media(max-width:380px){
  .valor{font-size:37px}
  .valor-input{font-size:27px}
  #qrcode{width:215px;height:215px}
}

.calculadora{margin:8px 0 18px}.visor{background:#101828;color:#fff;border-radius:16px;padding:14px 16px;text-align:right;margin-bottom:10px}.expressao{font-size:14px;color:#98a2b3;min-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.total-calc{font-size:32px;font-weight:800;margin-top:3px}.teclas{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.tecla{border:0;border-radius:14px;min-height:58px;background:#f2f4f7;font-size:22px;font-weight:700;color:#101828;touch-action:manipulation}.tecla:active{transform:scale(.96)}.tecla.acao{background:#eaf2ff;color:#175cd3}.tecla.igual{background:#12b76a;color:#fff}.tecla.zero{grid-column:span 2}
</style>
</head>

<body>

<div class="topo">
  <h1>💳 FF COBRANÇA</h1>
  <p>Receba por PIX</p>
</div>

<div class="container">

  <div class="card" id="cardCobranca">
    <div class="valor-label">Monte o valor da cobrança</div>

    <div class="calculadora">
      <div class="visor">
        <div class="expressao" id="expressao">R$ 0,00</div>
        <div class="total-calc" id="totalCalc">R$ 0,00</div>
      </div>
      <div class="teclas">
        <button type="button" class="tecla acao" onclick="limparCalculadora()">C</button>
        <button type="button" class="tecla acao" onclick="apagarUltimo()">⌫</button>
        <button type="button" class="tecla acao" onclick="somarAtual()">+</button>
        <button type="button" class="tecla" onclick="digitar('7')">7</button>
        <button type="button" class="tecla" onclick="digitar('8')">8</button>
        <button type="button" class="tecla" onclick="digitar('9')">9</button>
        <button type="button" class="tecla" onclick="digitar('4')">4</button>
        <button type="button" class="tecla" onclick="digitar('5')">5</button>
        <button type="button" class="tecla" onclick="digitar('6')">6</button>
        <button type="button" class="tecla" onclick="digitar('1')">1</button>
        <button type="button" class="tecla" onclick="digitar('2')">2</button>
        <button type="button" class="tecla" onclick="digitar('3')">3</button>
        <button type="button" class="tecla zero" onclick="digitar('0')">0</button>
        <button type="button" class="tecla" onclick="digitar(',')">,</button>
        <button type="button" class="tecla igual" onclick="finalizarSoma()">=</button>
      </div>
    </div>

    <label for="nomeCliente">Nome do cliente <span style="font-weight:400;color:#888">(opcional)</span></label>
    <input
      id="nomeCliente"
      type="text"
      maxlength="80"
      placeholder="Nome"
      autocomplete="name"
    >

    <label for="telefone">Celular <span style="font-weight:400;color:#888">(opcional)</span></label>
    <input
      id="telefone"
      type="tel"
      maxlength="15"
      inputmode="numeric"
      placeholder="(89) 99999-9999"
      autocomplete="tel"
    >

    <button id="btnCobrar" class="btn-cobrar" type="button">
      GERAR PIX
    </button>

    <div id="erro" class="erro"></div>
  </div>

  <div class="card pix" id="cardPix">
    <h2>📲 Pague por PIX</h2>

    <div class="valor-pix" id="valorPix">R$ 0,00</div>

    <img id="qrcode" alt="QR Code PIX">

    <textarea id="copiacola" readonly></textarea>

    <button id="btnCopiar" class="btn-copiar" type="button">
      COPIAR PIX
    </button>

    <div class="status" id="status">
      ⏳ Aguardando pagamento...
      <br>
      Tempo restante:
      <strong id="contador">30:00</strong>
    </div>
  </div>

  <div class="card sucesso" id="cardSucesso">
    <div class="check">✓</div>
    <h2>PAGAMENTO APROVADO</h2>
    <p>Recebimento confirmado.</p>
    <div class="valor-final" id="valorFinal">R$ 0,00</div>

    <button id="btnNova" class="btn-nova" type="button">
      NOVA COBRANÇA
    </button>
  </div>

  <div class="rodape">
    FF Cobrança
  </div>

</div>

<script>
/*
=========================================================
FF COBRANÇA
=========================================================

URL:
caixa.html?app_id=SEU_APP_ID

IMPORTANTE:
Esta tela usa uma nova Edge Function:
gerar-pix-caixa

Ela deve receber:
{
  app_id,
  valor,
  nome,
  telefone
}

E retornar:
{
  success: true,
  payment_id,
  status,
  valor,
  qr_code,
  qr_code_base64
}

O fluxo antigo do Hotspot não é alterado.
=========================================================
*/

const SUPABASE_URL =
  "https://auzdqapjetmhaokoynzo.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_36kXlyuKU8RMfgSx01h5mw_lOLp1lbX";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

const params = new URLSearchParams(location.search);

const APP_ID = params.get("app_id") || "";

const nomeCliente = document.getElementById("nomeCliente");
const telefone = document.getElementById("telefone");
const expressao = document.getElementById("expressao");
const totalCalc = document.getElementById("totalCalc");

const btnCobrar = document.getElementById("btnCobrar");
const btnCopiar = document.getElementById("btnCopiar");
const btnNova = document.getElementById("btnNova");

const cardCobranca = document.getElementById("cardCobranca");
const cardPix = document.getElementById("cardPix");
const cardSucesso = document.getElementById("cardSucesso");

const qrcode = document.getElementById("qrcode");
const copiacola = document.getElementById("copiacola");
const valorPix = document.getElementById("valorPix");
const valorFinal = document.getElementById("valorFinal");

const status = document.getElementById("status");
const contador = document.getElementById("contador");
const erroBox = document.getElementById("erro");

let pagamentoId = null;
let timerPagamento = null;
let timerContador = null;
let tempoRestante = 30 * 60;
let valorAtual = 0;
let entrada = "";
let totalCentavos = 0;
let resultadoTravado = false;

function mostrarErro(mensagem){erroBox.textContent=mensagem;erroBox.style.display="block";}
function esconderErro(){erroBox.style.display="none";erroBox.textContent="";}
function formatarMoeda(valor){return Number(valor||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});}
function centavosDaEntrada(){
  if(!entrada) return 0;
  const n=Number(entrada.replace(",","."));
  return Number.isFinite(n)&&n>=0 ? Math.round(n*100) : 0;
}
function atualizarCalculadora(){
  expressao.textContent=entrada ? "R$ "+entrada : "R$ 0,00";
  totalCalc.textContent=formatarMoeda((totalCentavos+centavosDaEntrada())/100);
}
function digitar(v){
  if(resultadoTravado){entrada="";totalCentavos=0;resultadoTravado=false;}
  if(v==="," && entrada.includes(",")) return;
  if(entrada.length>=10) return;
  if(v==="," && !entrada) entrada="0,";
  else { if(entrada==="0" && v!==",") entrada=""; entrada+=v; }
  atualizarCalculadora();
}
function apagarUltimo(){
  if(resultadoTravado){limparCalculadora();return;}
  entrada=entrada.slice(0,-1);
  atualizarCalculadora();
}
function somarAtual(){
  totalCentavos+=centavosDaEntrada();
  entrada="";
  atualizarCalculadora();
}
function finalizarSoma(){
  totalCentavos+=centavosDaEntrada();
  entrada="";
  resultadoTravado=true;
  atualizarCalculadora();
}
function limparCalculadora(){entrada="";totalCentavos=0;resultadoTravado=false;atualizarCalculadora();}
function obterValor(){return (totalCentavos+centavosDaEntrada())/100;}

atualizarCalculadora();

telefone.addEventListener("input", function(){
  let v = this.value.replace(/\D/g,"").slice(0,11);

  if(v.length <= 10){
    v = v.replace(/^(\d{2})(\d)/,"($1) $2");
    v = v.replace(/(\d{4})(\d)/,"$1-$2");
  }else{
    v = v.replace(/^(\d{2})(\d)/,"($1) $2");
    v = v.replace(/(\d{5})(\d)/,"$1-$2");
  }

  this.value = v;
});

async function gerarPix(){

  esconderErro();

  if(!APP_ID){
    mostrarErro("APP_ID não informado na URL.");
    return;
  }

  const valor = obterValor();

  if(valor <= 0){
    mostrarErro("Digite um valor válido para receber.");
    return;
  }

  if(valor > 100000){
    mostrarErro("O valor máximo desta cobrança é R$ 100.000,00.");
    return;
  }

  const nome = String(nomeCliente.value || "")
    .trim()
    .replace(/\s+/g," ");

  const celular = String(telefone.value || "")
    .replace(/\D/g,"");

  btnCobrar.disabled = true;
  btnCobrar.textContent = "GERANDO PIX...";

  try{

    /*
      NOVA FUNÇÃO:
      não usa plano_id.
    */
    const resposta = await fetch(
      `${SUPABASE_URL}/functions/v1/gerar-pix-caixa`,
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          "apikey":SUPABASE_ANON_KEY,
          "Authorization":"Bearer " + SUPABASE_ANON_KEY
        },
        body:JSON.stringify({
          app_id:APP_ID,
          valor:valor,
          nome:nome,
          telefone:celular
        })
      }
    );

    const retorno = await resposta.json();

    console.log("RETORNO CAIXA:", retorno);

    if(!resposta.ok){
      throw new Error(
        retorno.error ||
        retorno.erro ||
        "Não foi possível gerar o PIX."
      );
    }

    if(!retorno.payment_id){
      throw new Error("PIX criado, mas o payment_id não foi retornado.");
    }

    if(!retorno.qr_code && !retorno.qr_code_base64){
      throw new Error("O Mercado Pago não retornou o QR Code PIX.");
    }

    pagamentoId = String(retorno.payment_id);
    valorAtual = Number(retorno.valor || valor);

    valorPix.textContent = formatarMoeda(valorAtual);

    if(retorno.qr_code_base64){
      qrcode.src =
        "data:image/png;base64," +
        retorno.qr_code_base64;
    }else{
      qrcode.removeAttribute("src");
    }

    copiacola.value = retorno.qr_code || "";

    cardCobranca.style.display = "none";
    cardPix.style.display = "block";
    cardSucesso.style.display = "none";

    status.style.display = "block";

    iniciarContador();
    iniciarVerificacao();

  }catch(e){

    console.error(e);

    mostrarErro(
      e?.message ||
      "Erro ao gerar a cobrança PIX."
    );

  }finally{

    btnCobrar.disabled = false;
    btnCobrar.textContent = "GERAR PIX";
  }
}

function iniciarVerificacao(){

  pararVerificacao();

  timerPagamento = setInterval(
    verificarPagamento,
    5000
  );

  verificarPagamento();
}

function pararVerificacao(){

  if(timerPagamento){
    clearInterval(timerPagamento);
    timerPagamento = null;
  }
}

async function verificarPagamento(){

  if(!pagamentoId){
    return;
  }

  try{

    const {data,error} = await db
      .from("hotspot_pagamentos")
      .select("*")
      .eq("payment_id",String(pagamentoId))
      .maybeSingle();

    if(error){
      console.error("Erro consultando pagamento:",error);
      return;
    }

    if(!data){
      return;
    }

    const pagamentoStatus = String(
      data.status ||
      data.payment_status ||
      ""
    ).toLowerCase();

    console.log(
      "PAGAMENTO:",
      pagamentoId,
      pagamentoStatus
    );

    if(
      pagamentoStatus === "approved" ||
      pagamentoStatus === "paid"
    ){

      pagamentoAprovado();
    }

  }catch(e){

    console.error(
      "Erro na verificação:",
      e
    );
  }
}

function pagamentoAprovado(){

  pararVerificacao();
  pararContador();

  valorFinal.textContent =
    formatarMoeda(valorAtual);

  cardCobranca.style.display = "none";
  cardPix.style.display = "none";
  cardSucesso.style.display = "block";
}

function iniciarContador(){

  pararContador();

  tempoRestante = 30 * 60;

  atualizarContador();

  timerContador = setInterval(()=>{

    tempoRestante--;

    atualizarContador();

    if(tempoRestante <= 0){

      pararContador();
      pararVerificacao();

      status.innerHTML =
        "⌛ <strong>PIX expirado</strong><br><br>" +
        "Gere uma nova cobrança.";
    }

  },1000);
}

function pararContador(){

  if(timerContador){
    clearInterval(timerContador);
    timerContador = null;
  }
}

function atualizarContador(){

  const minutos =
    Math.floor(tempoRestante / 60);

  const segundos =
    tempoRestante % 60;

  contador.textContent =
    String(minutos).padStart(2,"0") +
    ":" +
    String(segundos).padStart(2,"0");
}

async function copiarPix(){

  const codigo = copiacola.value;

  if(!codigo){
    return;
  }

  try{

    await navigator.clipboard.writeText(codigo);

    const textoOriginal = btnCopiar.textContent;

    btnCopiar.textContent = "✅ PIX COPIADO";

    setTimeout(()=>{
      btnCopiar.textContent = textoOriginal;
    },1500);

  }catch(e){

    copiacola.focus();
    copiacola.select();
    document.execCommand("copy");

    btnCopiar.textContent = "✅ PIX COPIADO";

    setTimeout(()=>{
      btnCopiar.textContent = "COPIAR PIX";
    },1500);
  }
}

function novaCobranca(){

  pararVerificacao();
  pararContador();

  pagamentoId = null;
  valorAtual = 0;

  limparCalculadora();
  nomeCliente.value = "";
  telefone.value = "";

  qrcode.removeAttribute("src");
  copiacola.value = "";

  status.style.display = "none";
  status.innerHTML =
    '⏳ Aguardando pagamento...<br>' +
    'Tempo restante: <strong id="contador">30:00</strong>';

  cardSucesso.style.display = "none";
  cardPix.style.display = "none";
  cardCobranca.style.display = "block";

  esconderErro();

}

btnCobrar.addEventListener("click",gerarPix);
btnCopiar.addEventListener("click",copiarPix);
btnNova.addEventListener("click",novaCobranca);


if(!APP_ID){
  mostrarErro(
    "Abra a maquininha usando: " +
    "caixa.html?app_id=SEU_APP_ID"
  );
}
</script>

</body>
</html>
