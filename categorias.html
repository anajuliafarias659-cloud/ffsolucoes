<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Categorias - </title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#020617;
  color:#fff;
}

.topo{
  background:#0f172a;
  padding:16px 24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.container{
  padding:32px;
  max-width:900px;
  margin:auto;
}

.card-box{
  background:#0f172a;
  padding:20px;
  border-radius:16px;
  margin-bottom:24px;
}

input{
  padding:12px;
  border-radius:10px;
  border:none;
  margin-right:10px;
}

button{
  padding:12px 16px;
  border-radius:10px;
  border:none;
  font-weight:bold;
  cursor:pointer;
}

.salvar{
  background:#22c55e;
  color:#000;
}

.desativar{
  background:#ef4444;
  color:#fff;
}

.lista{
  margin-top:24px;
}

.item{
  background:#0f172a;
  padding:14px 18px;
  border-radius:14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
  transition:.2s;
}

.item:hover{
  background:#1e293b;
}

.vazio{
  opacity:.6;
  text-align:center;
  margin-top:20px;
}
</style>
</head>

<body>

<div class="topo">
  <h2>Categorias - do seu comércio</h2>
  <button onclick="history.back()">⬅ Voltar</button>
</div>

<div class="container">

  <div class="card-box">
    <h3>Nova Categoria</h3>

    <input id="emoji" placeholder="Emoji (opcional)">
    <input id="nome" placeholder="Nome da categoria">

    <button class="salvar" onclick="criar()">Salvar</button>
  </div>

  <div class="lista" id="lista"></div>

</div>

<script type="module">

/* =========================================================
   MESMO CLIENTE USADO PELO LOGIN PRINCIPAL
   ========================================================= */
import { supabase as sb } from "/js/supabase-login.js";

let app_id = null;


/* =========================================================
   INICIAR
   ========================================================= */
async function iniciar(){

  const params = new URLSearchParams(location.search);
  const appIdUrl = params.get("app_id");

  /* Se veio app_id pela URL, usa ele */
  if(appIdUrl){

    app_id = appIdUrl;

    console.log("APP_ID pela URL:", app_id);

    listar();
    return;
  }


  /* =======================================================
     VERIFICAR SESSÃO
     ======================================================= */
  const {
    data: { session },
    error: sessionError
  } = await sb.auth.getSession();


  if(sessionError){

    console.error(
      "Erro ao verificar sessão:",
      sessionError
    );

    alert("Erro ao verificar a sessão.");
    return;
  }


  if(!session){

    alert("Sessão inválida");

    location.href = "/auth/login.html";

    return;
  }


  /* =======================================================
     BUSCAR APP_ID DO USUÁRIO LOGADO
     ======================================================= */
  const {
    data: usuario,
    error
  } = await sb
    .from("usuarios")
    .select("app_id")
    .eq("id", session.user.id)
    .single();


  if(error){

    console.error(
      "Erro ao buscar usuário:",
      error
    );

    alert(
      "Não foi possível carregar os dados do usuário."
    );

    return;
  }


  if(!usuario?.app_id){

    alert("Usuário sem app_id.");

    return;
  }


  app_id = usuario.app_id;


  console.log(
    "Usuário:",
    session.user.email
  );

  console.log(
    "APP_ID:",
    app_id
  );


  listar();
}


/* =========================================================
   CRIAR CATEGORIA
   ========================================================= */
async function criar(){

  const nome =
    document.getElementById("nome").value.trim();

  const emoji =
    document.getElementById("emoji").value.trim();


  if(!nome){

    alert(
      "Informe o nome da categoria"
    );

    return;
  }


  if(!app_id){

    alert(
      "APP_ID não identificado."
    );

    return;
  }


  const { error } = await sb
    .from("categorias")
    .insert({
      app_id,
      nome,
      emoji: emoji || "📦",
      ativo:true
    });


  if(error){

    console.error(error);

    alert(error.message);

    return;
  }


  document.getElementById("nome").value = "";
  document.getElementById("emoji").value = "";

  listar();
}


/* =========================================================
   LISTAR CATEGORIAS
   ========================================================= */
async function listar(){

  if(!app_id){

    console.error(
      "APP_ID não definido."
    );

    return;
  }


  const {
    data,
    error
  } = await sb
    .from("categorias")
    .select("*")
    .eq("app_id", app_id)
    .eq("ativo", true)
    .order("created_at");


  if(error){

    console.error(error);

    return;
  }


  const lista =
    document.getElementById("lista");


  lista.innerHTML = "";


  if(!data || data.length === 0){

    lista.innerHTML =
      "<div class='vazio'>Nenhuma categoria cadastrada</div>";

    return;
  }


  data.forEach(cat => {

    const div =
      document.createElement("div");

    div.className = "item";


    div.innerHTML = `
      <div>
        <b>${cat.emoji || "📦"} ${cat.nome}</b>
      </div>

      <button
        class="desativar"
        onclick="desativar('${cat.id}')">
        Desativar
      </button>
    `;


    lista.appendChild(div);
  });
}


/* =========================================================
   DESATIVAR
   ========================================================= */
async function desativar(id){

  if(!confirm("Desativar categoria?"))
    return;


  const { error } = await sb
    .from("categorias")
    .update({
      ativo:false
    })
    .eq("id", id);


  if(error){

    console.error(error);

    alert(error.message);

    return;
  }


  listar();
}


/* =========================================================
   DISPONIBILIZAR PARA OS BOTÕES HTML
   ========================================================= */
window.criar = criar;
window.desativar = desativar;


/* =========================================================
   INICIAR
   ========================================================= */
iniciar();

</script>

</body>
</html>
