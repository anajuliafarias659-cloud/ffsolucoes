<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>FF Transporte</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    background: #0f172a;

    color: #fff;

    font-family: Arial, Helvetica, sans-serif;

}


/* =========================================================
   TÍTULO
========================================================= */

.titulo {

    padding: 20px;

    margin: 0;

    font-size: 24px;

}


/* =========================================================
   EMPRESA
========================================================= */

#empresaNome {

    margin: 0 20px 20px 20px;

    padding: 14px;

    background: #1e293b;

    border-radius: 10px;

    font-size: 18px;

    font-weight: bold;

}


/* =========================================================
   CONTAINER
========================================================= */

.container {

    display: flex;

    gap: 20px;

    padding: 20px;

}


/* =========================================================
   CARDS
========================================================= */

.card {

    background: #1e293b;

    padding: 20px;

    border-radius: 12px;

    width: 50%;

}


.card h3 {

    margin-top: 0;

}


/* =========================================================
   INPUTS
========================================================= */

select,
input,
button {

    width: 100%;

    padding: 12px;

    margin-top: 10px;

    border-radius: 8px;

    border: none;

    font-size: 15px;

}


/* =========================================================
   BOTÃO
========================================================= */

button {

    background: #22c55e;

    color: white;

    font-weight: bold;

    cursor: pointer;

    transition: .2s;

}


button:hover {

    opacity: .9;

    transform: translateY(-1px);

}


/* =========================================================
   LISTA DE VIAGENS
========================================================= */

.viagem {

    background: #334155;

    padding: 15px;

    margin-top: 10px;

    border-radius: 10px;

    cursor: pointer;

    transition: .2s;

    border: 2px solid transparent;

}


.viagem:hover {

    background: #475569;

    transform: translateY(-1px);

}


/* =========================================================
   VIAGEM SELECIONADA
========================================================= */

.viagem.selecionada {

    background: #1d4ed8;

    border: 2px solid #60a5fa;

    box-shadow:
        0 0 0 2px rgba(59,130,246,.25);

}


.viagem.selecionada::after {

    content: "✓ VIAGEM SELECIONADA";

    display: block;

    margin-top: 10px;

    font-size: 13px;

    font-weight: bold;

    color: #bfdbfe;

}


/* =========================================================
   POLTRONAS
========================================================= */

.poltronas {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 10px;

    margin-top: 10px;

}


.poltrona {

    padding: 12px 5px;

    text-align: center;

    border-radius: 8px;

    cursor: pointer;

    font-weight: bold;

    user-select: none;

    transition: .2s;

}


.poltrona:hover {

    transform: scale(1.03);

}


/* LIVRE */

.livre {

    background: #22c55e;

}


/* OCUPADO */

.ocupado {

    background: #ef4444;

    cursor: not-allowed;

    opacity: .8;

}


/* SELECIONADO */

.poltrona.selecionado {

    background: #3b82f6 !important;

    outline: 3px solid #93c5fd;

}


/* =========================================================
   VIAGEM ESCOLHIDA NO LADO DIREITO
========================================================= */

.viagemEscolhida {

    grid-column: 1 / -1;

    background: #1d4ed8;

    border: 2px solid #60a5fa;

    padding: 15px;

    border-radius: 10px;

    margin-bottom: 5px;

}


.viagemEscolhida strong {

    display: block;

    margin-bottom: 5px;

}


/* =========================================================
   MENSAGENS
========================================================= */

.mensagem {

    padding: 20px;

    background: #334155;

    border-radius: 10px;

    text-align: center;

}


.erro {

    background: #7f1d1d;

}


.sucesso {

    background: #166534;

}


/* =========================================================
   RESPONSIVO
========================================================= */

@media (max-width: 700px) {

    .container {

        flex-direction: column;

        padding: 10px;

    }


    .card {

        width: 100%;

    }


    #empresaNome {

        margin: 0 10px 10px 10px;

    }


    .titulo {

        padding: 15px;

    }


    .poltronas {

        grid-template-columns:
            repeat(4, 1fr);

    }

}

</style>

</head>


<body>


<!-- =====================================================
     TÍTULO
===================================================== -->

<h2 class="titulo">

    🚌 FF TRANSPORTE

</h2>


<!-- =====================================================
     EMPRESA
===================================================== -->

<div id="empresaNome">

    Carregando empresa...

</div>


<div class="container">


    <!-- =================================================
         LADO ESQUERDO
    ================================================== -->

    <div class="card">

        <h3>

            Tipo de Viagem

        </h3>


        <select id="tipoViagem">

            <option value="ida">

                Somente Ida

            </option>

        </select>


        <h3>

            Viagens

        </h3>


        <div id="listaViagens">

            <div class="mensagem">

                Carregando viagens...

            </div>

        </div>

    </div>


    <!-- =================================================
         LADO DIREITO
    ================================================== -->

    <div class="card">

        <h3>

            Poltronas

        </h3>


        <div
            class="poltronas"
            id="poltronas"
        >

            <div class="mensagem">

                Selecione uma viagem primeiro.

            </div>

        </div>


        <h3>

            Pagamento

        </h3>


        <select id="formaPagamento">

            <option value="">

                Forma de pagamento

            </option>


            <option value="pix">

                PIX

            </option>


            <option value="dinheiro">

                Dinheiro

            </option>

        </select>


        <input
            type="text"
            id="nomePassageiro"
            placeholder="Seu nome"
        >


        <button
            onclick="reservar()"
        >

            Pagar e Reservar

        </button>

    </div>

</div>


<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script type="module">


/* =========================================================
   SUPABASE
========================================================= */

import {
    supabase
} from "../../js/supabase-login.js";


/* =========================================================
   PEGAR APP_ID DA URL
========================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


const app_id =
    params.get("app_id");


console.log(
    "APP ID DA EMPRESA:",
    app_id
);


/* =========================================================
   VALIDAR APP_ID
========================================================= */

if (!app_id) {

    document.body.innerHTML = `

        <div style="
            padding:40px;
            text-align:center;
            font-family:Arial;
            background:#0f172a;
            color:white;
            min-height:100vh;
        ">

            <h2>
                ⚠️ Empresa não identificada
            </h2>

            <p>
                Este link não possui o
                identificador da empresa.
            </p>

            <p>
                Solicite o link correto
                para acessar o sistema.
            </p>

        </div>

    `;

    throw new Error(
        "app_id não informado na URL"
    );

}


/* =========================================================
   VARIÁVEIS
========================================================= */

let viagens = [];

let viagemSelecionada = null;

let poltronaSelecionada = null;


/* =========================================================
   CARREGAR EMPRESA
========================================================= */

async function carregarEmpresa() {

    const empresaNome =
        document.getElementById(
            "empresaNome"
        );


    try {

        const {
            data,
            error
        } = await supabase

            .from("negocios")

            .select("nome")

            .eq("app_id", app_id)

            .eq("ativo", true)

            .maybeSingle();


        if (error) {

            console.error(
                "Erro ao buscar empresa:",
                error
            );

            empresaNome.innerHTML =
                "🚌 FF TRANSPORTE";

            return;

        }


        if (data?.nome) {

            empresaNome.innerHTML =
                "🚌 " + data.nome;

        } else {

            empresaNome.innerHTML =
                "🚌 FF TRANSPORTE";

        }

    } catch (erro) {

        console.error(erro);

        empresaNome.innerHTML =
            "🚌 FF TRANSPORTE";

    }

}


/* =========================================================
   CARREGAR VIAGENS
========================================================= */

async function carregarViagens() {

    const lista =
        document.getElementById(
            "listaViagens"
        );


    lista.innerHTML = `

        <div class="mensagem">

            Carregando viagens...

        </div>

    `;


    try {

        const {
            data,
            error
        } = await supabase

            .from("viagens")

            .select("*")

            .eq("app_id", app_id);


        if (error) {

            console.error(
                "Erro ao carregar viagens:",
                error
            );


            lista.innerHTML = `

                <div class="mensagem erro">

                    ❌ Não foi possível
                    carregar as viagens.

                    <br><br>

                    ${error.message || ""}

                </div>

            `;

            return;

        }


        viagens =
            data || [];


        console.log(
            "VIAGENS DA EMPRESA:",
            viagens
        );


        if (viagens.length === 0) {

            lista.innerHTML = `

                <div class="mensagem">

                    🚌 Nenhuma viagem
                    disponível no momento.

                </div>

            `;

            return;

        }


        lista.innerHTML = "";


        viagens.forEach(
            (viagem) => {


                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "viagem";


                /*
                 * Rota
                 */

                let rota = "";


                if (
                    viagem.rota
                ) {

                    rota =
                        viagem.rota;

                } else if (
                    viagem.origem ||
                    viagem.destino
                ) {

                    rota =
                        `${viagem.origem || ""} → ${viagem.destino || ""}`;

                } else {

                    rota =
                        "Viagem";

                }


                /*
                 * Horário
                 */

                const hora =
                    viagem.hora ||
                    viagem.horario ||
                    "";


                /*
                 * Dias
                 */

                let dias = "";


                if (
                    Array.isArray(
                        viagem.dias
                    )
                ) {

                    dias =
                        viagem.dias.join(
                            ", "
                        );

                } else if (
                    viagem.dias
                ) {

                    dias =
                        viagem.dias;

                }


                /*
                 * HTML DA VIAGEM
                 */

                div.innerHTML = `

                    <div>

                        <strong>

                            ${rota}

                        </strong>

                    </div>

                    ${
                        hora
                        ? `
                            <small>
                                🕐 ${hora}
                            </small>
                          `
                        : ""
                    }

                    ${
                        dias
                        ? `
                            <br>

                            <small>
                                📅 ${dias}
                            </small>
                          `
                        : ""
                    }

                `;


                /*
                 * CLIQUE
                 */

                div.onclick = function() {

                    selecionarViagem(
                        viagem,
                        div
                    );

                };


                lista.appendChild(
                    div
                );

            }
        );


    } catch (erro) {

        console.error(erro);


        lista.innerHTML = `

            <div class="mensagem erro">

                ❌ Erro inesperado
                ao carregar viagens.

            </div>

        `;

    }

}


/* =========================================================
   SELECIONAR VIAGEM
========================================================= */

function selecionarViagem(
    viagem,
    elemento
) {


    console.log(
        "VIAGEM CLICADA:",
        viagem
    );


    /*
     * Guarda a viagem
     */

    viagemSelecionada =
        viagem;


    /*
     * Limpa a poltrona anterior
     */

    poltronaSelecionada =
        null;


    /*
     * Remove seleção
     * das outras viagens
     */

    document
        .querySelectorAll(
            ".viagem"
        )
        .forEach(
            (item) => {

                item.classList.remove(
                    "selecionada"
                );

            }
        );


    /*
     * Marca visualmente
     * a viagem escolhida
     */

    elemento.classList.add(
        "selecionada"
    );


    /*
     * Carrega as poltronas
     */

    carregarPoltronas(
        viagem
    );

}


/* =========================================================
   CARREGAR POLTRONAS
========================================================= */

function carregarPoltronas(
    viagem
) {


    const poltronasDiv =
        document.getElementById(
            "poltronas"
        );


    /*
     * Descobre a rota
     */

    let rota = "";


    if (
        viagem.rota
    ) {

        rota =
            viagem.rota;

    } else if (
        viagem.origem ||
        viagem.destino
    ) {

        rota =
            `${viagem.origem || ""} → ${viagem.destino || ""}`;

    } else {

        rota =
            "Viagem";

    }


    /*
     * Descobre horário
     */

    const hora =
        viagem.hora ||
        viagem.horario ||
        "";


    /*
     * Limpa
     */

    poltronasDiv.innerHTML = `

        <div class="viagemEscolhida">

            <strong>

                ✓ VIAGEM SELECIONADA

            </strong>

            <span>

                ${rota}

            </span>

            ${
                hora
                ? `
                    <br>

                    <small>
                        🕐 ${hora}
                    </small>
                  `
                : ""
            }

        </div>

    `;


    /*
     * Gera 20 poltronas
     */

    for (
        let i = 1;
        i <= 20;
        i++
    ) {


        const btn =
            document.createElement(
                "div"
            );


        btn.innerText =
            i;


        btn.className =
            "poltrona livre";


        /*
         * Clique na poltrona
         */

        btn.onclick =
            function() {

                selecionarPoltrona(
                    i,
                    btn
                );

            };


        poltronasDiv.appendChild(
            btn
        );

    }

}


/* =========================================================
   SELECIONAR POLTRONA
========================================================= */

function selecionarPoltrona(
    numero,
    elemento
) {


    /*
     * Remove seleção
     * das outras poltronas
     */

    document
        .querySelectorAll(
            ".poltrona"
        )
        .forEach(
            (poltrona) => {

                poltrona.classList.remove(
                    "selecionado"
                );

            }
        );


    /*
     * Marca a escolhida
     */

    elemento.classList.add(
        "selecionado"
    );


    /*
     * Guarda número
     */

    poltronaSelecionada =
        numero;


    console.log(
        "POLTRONA SELECIONADA:",
        numero
    );

}


/* =========================================================
   RESERVAR
========================================================= */

async function reservar() {


    /*
     * Verifica viagem
     */

    if (
        !viagemSelecionada
    ) {

        alert(
            "Selecione uma viagem primeiro."
        );

        return;

    }


    /*
     * Verifica poltrona
     */

    if (
        !poltronaSelecionada
    ) {

        alert(
            "Selecione uma poltrona."
        );

        return;

    }


    /*
     * Nome
     */

    const nome =
        document
            .getElementById(
                "nomePassageiro"
            )
            .value
            .trim();


    if (!nome) {

        alert(
            "Informe o nome do passageiro."
        );

        return;

    }


    /*
     * Pagamento
     */

    const pagamento =
        document
            .getElementById(
                "formaPagamento"
            )
            .value;


    if (!pagamento) {

        alert(
            "Selecione a forma de pagamento."
        );

        return;

    }


    /*
     * Dados da reserva
     */

    const dadosReserva = {

        app_id:

            app_id,


        viagem_id:

            viagemSelecionada.id,


        poltrona:

            poltronaSelecionada,


        nome:

            nome,


        pagamento:

            pagamento

    };


    console.log(
        "DADOS DA RESERVA:",
        dadosReserva
    );


    /*
     * POR ENQUANTO NÃO GRAVA NO BANCO.
     *
     * Primeiro vamos confirmar a estrutura
     * da tabela de reservas.
     */

    alert(

        "Reserva selecionada!\n\n" +

        "Passageiro: " +
        nome +

        "\nPoltrona: " +
        poltronaSelecionada +

        "\nPagamento: " +
        pagamento

    );

}


/* =========================================================
   DISPONIBILIZAR FUNÇÕES
========================================================= */

window.reservar =
    reservar;


/* =========================================================
   INICIAR PÁGINA
========================================================= */

carregarEmpresa();

carregarViagens();


</script>


</body>

</html>
