<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FF Transporte</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0f172a;
    color: #fff;
    font-family: Arial, sans-serif;
}

h2 {
    padding: 20px;
    margin: 0;
}

.container {
    display: flex;
    gap: 20px;
    padding: 20px;
}

.card {
    background: #1e293b;
    padding: 20px;
    border-radius: 12px;
    width: 50%;
}

select,
input,
button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border-radius: 8px;
    border: none;
    font-size: 15px;
}

button {
    background: #22c55e;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    opacity: .9;
}

/* VIAGENS */

.viagem {
    background: #334155;
    padding: 15px;
    margin-top: 10px;
    border-radius: 10px;
    cursor: pointer;
    transition: .2s;
}

.viagem:hover {
    background: #475569;
}

.viagem.selecionada {
    outline: 2px solid #3b82f6;
    background: #1d4ed8;
}

/* POLTRONAS */

.poltronas {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-top: 10px;
}

.poltrona {
    padding: 12px 5px;
    text-align: center;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    user-select: none;
}

.livre {
    background: #22c55e;
}

.ocupado {
    background: #ef4444;
    cursor: not-allowed;
}

.selecionado {
    background: #3b82f6 !important;
}

/* EMPRESA */

#empresaNome {
    margin: 0 20px;
    padding: 12px;
    background: #1e293b;
    border-radius: 8px;
}

/* MENSAGENS */

.mensagem {
    padding: 20px;
    background: #334155;
    border-radius: 10px;
    text-align: center;
}

.erro {
    background: #7f1d1d;
}

.sucesso {
    background: #166534;
}

/* MOBILE */

@media (max-width: 700px) {

    .container {
        flex-direction: column;
    }

    .card {
        width: 100%;
    }

    .poltronas {
        grid-template-columns: repeat(4, 1fr);
    }
}
</style>
</head>

<body>

<h2>🚌 FF TRANSPORTE</h2>

<div id="empresaNome">
    Carregando empresa...
</div>

<div class="container">

    <!-- LADO ESQUERDO -->

    <div class="card">

        <h3>Tipo de Viagem</h3>

        <select id="tipoViagem">
            <option value="ida">Somente Ida</option>
        </select>

        <h3>Viagens</h3>

        <div id="listaViagens">
            <div class="mensagem">
                Carregando viagens...
            </div>
        </div>

    </div>


    <!-- LADO DIREITO -->

    <div class="card">

        <h3>Poltronas</h3>

        <div id="poltronas">
            <div class="mensagem">
                Selecione uma viagem primeiro.
            </div>
        </div>

        <h3>Pagamento</h3>

        <select id="formaPagamento">

            <option value="">
                Forma de pagamento
            </option>

            <option value="pix">
                PIX
            </option>

            <option value="dinheiro">
                Dinheiro
            </option>

        </select>

        <input
            type="text"
            id="nomePassageiro"
            placeholder="Nome do passageiro"
        >

        <button onclick="reservar()">
            Pagar e Reservar
        </button>

    </div>

</div>


<script type="module">

import { supabase } from "../../js/supabase-login.js";


/* =========================================================
   APP ID DA EMPRESA
========================================================= */

const params = new URLSearchParams(window.location.search);

const app_id = params.get("app_id");

console.log("APP ID:", app_id);


/* =========================================================
   VALIDAR APP ID
========================================================= */

if (!app_id) {

    document.body.innerHTML = `

        <div style="
            padding:40px;
            text-align:center;
            font-family:Arial;
            background:#0f172a;
            color:white;
            min-height:100vh;
        ">

            <h2>⚠️ Empresa não identificada</h2>

            <p>
                Este link não possui o identificador da empresa.
            </p>

            <p>
                Solicite o link correto para acessar o sistema.
            </p>

        </div>

    `;

    throw new Error("app_id não informado na URL");
}


/* =========================================================
   VARIÁVEIS
========================================================= */

let viagens = [];

let viagemSelecionada = null;

let poltronaSelecionada = null;


/* =========================================================
   CARREGAR EMPRESA
========================================================= */

async function carregarEmpresa() {

    const empresaNome = document.getElementById("empresaNome");

    try {

        /*
         * Busca a empresa pelo app_id.
         *
         * Se sua tabela negocios possuir
         * a coluna nome, será exibido o nome.
         */

        const { data, error } = await supabase
            .from("negocios")
            .select("nome")
            .eq("app_id", app_id)
            .eq("ativo", true)
            .maybeSingle();

        if (error) {

            console.error("Erro empresa:", error);

            empresaNome.innerHTML =
                "🚌 FF TRANSPORTE";

            return;
        }

        if (data?.nome) {

            empresaNome.innerHTML =
                "🚌 " + data.nome;

        } else {

            empresaNome.innerHTML =
                "🚌 FF TRANSPORTE";

        }

    } catch (erro) {

        console.error(erro);

        empresaNome.innerHTML =
            "🚌 FF TRANSPORTE";
    }
}


/* =========================================================
   CARREGAR VIAGENS
========================================================= */

async function carregarViagens() {

    const lista = document.getElementById("listaViagens");

    lista.innerHTML = `
        <div class="mensagem">
            Carregando viagens...
        </div>
    `;


    const { data, error } = await supabase

        .from("viagens")

        .select("*")

        .eq("app_id", app_id);


    if (error) {

        console.error("Erro ao carregar viagens:", error);

        lista.innerHTML = `

            <div class="mensagem erro">

                ❌ Não foi possível carregar as viagens.

                <br><br>

                Verifique a configuração do sistema.

            </div>

        `;

        return;
    }


    viagens = data || [];


    if (viagens.length === 0) {

        lista.innerHTML = `

            <div class="mensagem">

                🚌 Nenhuma viagem disponível no momento.

            </div>

        `;

        return;
    }


    lista.innerHTML = "";


    viagens.forEach(viagem => {

        const div = document.createElement("div");

        div.className = "viagem";


        /*
         * Aceita os nomes mais comuns.
         */

        const rota =
            viagem.rota ||
            viagem.origem && viagem.destino
                ? `${viagem.origem || ""} → ${viagem.destino || ""}`
                : "Viagem";


        const hora =
            viagem.hora ||
            viagem.horario ||
            "";


        let dias = "";

        if (Array.isArray(viagem.dias)) {

            dias = viagem.dias.join(", ");

        } else if (viagem.dias) {

            dias = viagem.dias;

        }


        div.innerHTML = `

            <div>

                <strong>
                    ${rota}
                </strong>

            </div>

            ${
                hora
                ? `<small>🕐 ${hora}</small>`
                : ""
            }

            ${
                dias
                ? `<br><small>📅 ${dias}</small>`
                : ""
            }

        `;


        div.onclick = () => {

            selecionarViagem(
                viagem,
                div
            );

        };


        lista.appendChild(div);

    });

}


/* =========================================================
   SELECIONAR VIAGEM
========================================================= */

function selecionarViagem(viagem, elemento) {

    viagemSelecionada = viagem;

    poltronaSelecionada = null;


    document
        .querySelectorAll(".viagem")
        .forEach(v => {

            v.classList.remove("selecionada");

        });


    elemento.classList.add("selecionada");


    carregarPoltronas(viagem);

}


/* =========================================================
   CARREGAR POLTRONAS
========================================================= */

async function carregarPoltronas(viagem) {

    const poltronasDiv =
        document.getElementById("poltronas");


    poltronasDiv.innerHTML = "";


    /*
     * Temporariamente gera 20 poltronas.
     *
     * Depois podemos substituir por consulta
     * à tabela de reservas/vendas.
     */

    for (let i = 1; i <= 20; i++) {

        const btn =
            document.createElement("div");


        btn.innerText = i;

        btn.className =
            "poltrona livre";


        btn.onclick = () => {

            selecionarPoltrona(
                i,
                btn
            );

        };


        poltronasDiv.appendChild(btn);

    }

}


/* =========================================================
   SELECIONAR POLTRONA
========================================================= */

function selecionarPoltrona(numero, elemento) {

    document
        .querySelectorAll(".poltrona")
        .forEach(p => {

            p.classList.remove("selecionado");

        });


    elemento.classList.add("selecionado");


    poltronaSelecionada = numero;


    console.log(
        "Poltrona selecionada:",
        numero
    );

}


/* =========================================================
   RESERVAR
========================================================= */

async function reservar() {

    if (!viagemSelecionada) {

        alert(
            "Selecione uma viagem primeiro."
        );

        return;
    }


    if (!poltronaSelecionada) {

        alert(
            "Selecione uma poltrona."
        );

        return;
    }


    const nome =
        document
            .getElementById("nomePassageiro")
            .value
            .trim();


    if (!nome) {

        alert(
            "Informe o nome do passageiro."
        );

        return;
    }


    const pagamento =
        document
            .getElementById("formaPagamento")
            .value;


    if (!pagamento) {

        alert(
            "Selecione a forma de pagamento."
        );

        return;
    }


    /*
     * Aqui ainda não grava a reserva.
     *
     * Primeiro deixamos o sistema identificando
     * corretamente a empresa pelo app_id.
     */

    console.log({

        app_id: app_id,

        viagem_id:
            viagemSelecionada.id,

        poltrona:
            poltronaSelecionada,

        nome: nome,

        pagamento: pagamento

    });


    alert(

        "Reserva selecionada!\n\n" +

        "Passageiro: " + nome + "\n" +

        "Poltrona: " +
        poltronaSelecionada + "\n\n" +

        "Empresa: " +
        app_id

    );

}


/* =========================================================
   INICIALIZAÇÃO
========================================================= */

carregarEmpresa();

carregarViagens();

</script>

</body>
</html>
