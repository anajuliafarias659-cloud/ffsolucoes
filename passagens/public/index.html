<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Passagens</title>

<style>

:root{
  --primary:#2563eb;
  --primary-dark:#1d4ed8;
  --success:#16a34a;
  --danger:#dc2626;
  --warning:#f59e0b;
  --bg:#f1f5f9;
  --card:#ffffff;
  --text:#0f172a;
  --muted:#64748b;
  --border:#e2e8f0;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
}

header{
  background:linear-gradient(135deg,#1d4ed8,#2563eb);
  color:#fff;
  padding:25px 16px;
  text-align:center;
  box-shadow:0 5px 20px rgba(0,0,0,.15);
}

header h1{
  margin:0;
  font-size:28px;
}

header p{
  margin:7px 0 0;
  opacity:.9;
}

.container{
  width:100%;
  max-width:1100px;
  margin:auto;
  padding:18px;
}

.card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:18px;
  padding:18px;
  margin-bottom:18px;
  box-shadow:0 8px 25px rgba(15,23,42,.07);
}

.card h2{
  margin:0 0 15px;
  font-size:21px;
}

label{
  display:block;
  font-weight:bold;
  margin-bottom:7px;
}

input,
select,
button{
  width:100%;
  padding:13px;
  border-radius:11px;
  border:1px solid var(--border);
  font-size:15px;
}

input,
select{
  background:#fff;
}

button{
  cursor:pointer;
  border:none;
  font-weight:bold;
}

.btn-primary{
  background:var(--primary);
  color:#fff;
}

.btn-primary:hover{
  background:var(--primary-dark);
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

@media(max-width:700px){
  .grid{
    grid-template-columns:1fr;
  }
}

.info{
  background:#eff6ff;
  border:1px solid #bfdbfe;
  color:#1e40af;
  padding:13px;
  border-radius:12px;
  margin-top:12px;
}

.aviso{
  background:#fff7ed;
  border:1px solid #fed7aa;
  color:#9a3412;
  padding:13px;
  border-radius:12px;
  margin-top:12px;
}

.erro{
  background:#fef2f2;
  border:1px solid #fecaca;
  color:#991b1b;
  padding:13px;
  border-radius:12px;
  margin-top:12px;
}

.sucesso{
  background:#f0fdf4;
  border:1px solid #bbf7d0;
  color:#166534;
  padding:13px;
  border-radius:12px;
  margin-top:12px;
}

/* VIAGENS */

.lista-viagens{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

@media(max-width:750px){
  .lista-viagens{
    grid-template-columns:1fr;
  }
}

.viagem{
  border:1px solid var(--border);
  border-radius:16px;
  padding:16px;
  background:#fff;
  cursor:pointer;
  transition:.15s;
}

.viagem:hover{
  border-color:#93c5fd;
  transform:translateY(-2px);
  box-shadow:0 8px 20px rgba(37,99,235,.08);
}

.viagem.selecionada{
  border:2px solid var(--primary);
  background:#eff6ff;
}

.viagem-rota{
  font-size:18px;
  font-weight:bold;
  margin-bottom:10px;
}

.viagem-info{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.badge{
  padding:6px 9px;
  border-radius:8px;
  font-size:12px;
  font-weight:bold;
  background:#f1f5f9;
  color:#334155;
}

.badge-hora{
  background:#dbeafe;
  color:#1d4ed8;
}

.badge-data{
  background:#dcfce7;
  color:#166534;
}

/* POLTRONAS */

.mapa-poltronas{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
  margin-top:15px;
}

.poltrona{
  min-height:62px;
  border-radius:11px;
  font-weight:bold;
  border:none;
  padding:7px;
}

.poltrona small{
  display:block;
  font-size:10px;
  margin-top:4px;
}

.poltrona-livre{
  background:#16a34a;
  color:#fff;
  cursor:pointer;
}

.poltrona-livre:hover{
  transform:scale(1.03);
}

.poltrona-selecionada{
  background:#2563eb !important;
  box-shadow:0 0 0 3px #93c5fd;
}

.poltrona-ocupada{
  background:#dc2626;
  color:#fff;
  cursor:not-allowed;
  opacity:.8;
}

@media(max-width:500px){
  .mapa-poltronas{
    grid-template-columns:repeat(4,1fr);
  }

  .poltrona{
    min-height:55px;
    font-size:13px;
  }
}

/* LEGENDA */

.legenda{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin-top:15px;
}

.legenda span{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:13px;
}

.cor{
  width:16px;
  height:16px;
  border-radius:5px;
}

.cor-livre{
  background:#16a34a;
}

.cor-ocupada{
  background:#dc2626;
}

.cor-selecionada{
  background:#2563eb;
}

/* FORMULARIO */

.formulario{
  display:none;
}

.formulario.visivel{
  display:block;
}

.resumo{
  background:#f8fafc;
  border:1px solid var(--border);
  border-radius:12px;
  padding:15px;
  margin-bottom:15px;
}

.resumo strong{
  color:#1d4ed8;
}

.vazio{
  text-align:center;
  padding:30px;
  color:var(--muted);
}

.carregando{
  text-align:center;
  padding:25px;
  color:var(--muted);
}

footer{
  text-align:center;
  padding:25px;
  color:#64748b;
  font-size:13px;
}

</style>
</head>

<body>

<header>

  <h1 id="nomeEmpresa">
    🎫 Passagens
  </h1>

  <p>
    Escolha sua viagem, data e poltrona
  </p>

</header>


<div class="container">


  <!-- DATA -->

  <div class="card">

    <h2>📅 Data da viagem</h2>

    <label for="dataViagem">
      Escolha a data
    </label>

    <input
      type="date"
      id="dataViagem"
      onchange="alterarData()"
    >

    <div
      id="infoData"
      class="info"
    >
      Carregando viagens disponíveis...
    </div>

  </div>


  <!-- VIAGENS -->

  <div class="card">

    <h2>
      🚌 Escolha sua viagem
    </h2>

    <div
      id="listaViagens"
      class="lista-viagens"
    >
      <div class="carregando">
        Carregando viagens...
      </div>
    </div>

  </div>


  <!-- POLTRONAS -->

  <div
    id="cardPoltronas"
    class="card"
    style="display:none"
  >

    <h2>
      💺 Escolha sua poltrona
    </h2>

    <div
      id="resumoViagem"
      class="resumo"
    ></div>

    <div class="legenda">

      <span>
        <i class="cor cor-livre"></i>
        Livre
      </span>

      <span>
        <i class="cor cor-ocupada"></i>
        Ocupada
      </span>

      <span>
        <i class="cor cor-selecionada"></i>
        Selecionada
      </span>

    </div>

    <div
      id="mapaPoltronas"
      class="mapa-poltronas"
    ></div>

  </div>


  <!-- FORMULARIO -->

  <div
    id="cardPassageiro"
    class="card formulario"
  >

    <h2>
      👤 Dados do passageiro
    </h2>

    <div
      id="resumoCompra"
      class="resumo"
    ></div>

    <div class="grid">

      <div>

        <label>
          Nome completo
        </label>

        <input
          id="nomePassageiro"
          type="text"
          placeholder="Digite seu nome"
        >

      </div>


      <div>

        <label>
          CPF / RG
        </label>

        <input
          id="documentoPassageiro"
          type="text"
          placeholder="CPF ou RG"
        >

      </div>


      <div>

        <label>
          WhatsApp
        </label>

        <input
          id="whatsappPassageiro"
          type="tel"
          placeholder="(89) 99999-9999"
        >

      </div>


    </div>

    <button
      class="btn-primary"
      style="margin-top:15px"
      onclick="reservarPassagem()"
    >
      🎫 Continuar com a reserva
    </button>

    <div
      id="msgReserva"
    ></div>

  </div>


</div>


<footer>

  FF Soluções • Sistema de Passagens

</footer>


<script type="module">

import { supabase }
  from "../../js/supabase-login.js";


/* =========================================================
   CONFIGURAÇÃO
========================================================= */

const params =
  new URLSearchParams(
    window.location.search
  );

const app_id =
  params.get("app_id");


/* =========================================================
   VARIÁVEIS
========================================================= */

let viagens = [];

let viagemSelecionada = null;

let dataSelecionada = "";

let veiculoSelecionado = null;

let poltronaSelecionada = null;


/* =========================================================
   INICIALIZAÇÃO
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  async () => {

    if(!app_id){

      mostrarErro(
        "Link inválido. app_id não encontrado."
      );

      return;
    }


    const hoje = hojeISO();

    document
      .getElementById("dataViagem")
      .value = hoje;

    dataSelecionada = hoje;


    await carregarEmpresa();

    await carregarViagens();

    await atualizarTela();
  }
);


/* =========================================================
   EMPRESA
========================================================= */

async function carregarEmpresa(){

  const { data, error } =
    await supabase
      .from("negocios")
      .select("nome")
      .eq("app_id", app_id)
      .eq("ativo", true)
      .maybeSingle();

  if(!error && data?.nome){

    document
      .getElementById("nomeEmpresa")
      .textContent =
        "🎫 " + data.nome;
  }
}


/* =========================================================
   CARREGAR VIAGENS
========================================================= */

async function carregarViagens(){

  const { data, error } =
    await supabase
      .from("viagens_passagens")
      .select("*")
      .eq("app_id", app_id)
      .order("hora", { ascending:true });

  if(error){

    console.error(error);

    mostrarErro(
      "Erro ao carregar viagens: " +
      error.message
    );

    return;
  }

  viagens = data || [];

}


/* =========================================================
   DATA ATUAL
========================================================= */

function hojeISO(){

  const agora = new Date();

  const ano =
    agora.getFullYear();

  const mes =
    String(
      agora.getMonth()+1
    ).padStart(2,"0");

  const dia =
    String(
      agora.getDate()
    ).padStart(2,"0");

  return `${ano}-${mes}-${dia}`;
}


/* =========================================================
   NOME DIA
========================================================= */

function nomeDiaSemana(dataISO){

  const [
    ano,
    mes,
    dia
  ] =
    dataISO
      .split("-")
      .map(Number);

  const data =
    new Date(
      ano,
      mes-1,
      dia
    );

  const dias = [
    "Dom",
    "Seg",
    "Ter",
    "Qua",
    "Qui",
    "Sex",
    "Sab"
  ];

  return dias[
    data.getDay()
  ];
}


/* =========================================================
   NORMALIZAR DIA
========================================================= */

function normalizarDia(txt){

  return String(txt || "")
    .trim()
    .toLowerCase()
    .normalize("NFD")
    .replace(
      /[\u0300-\u036f]/g,
      ""
    )
    .slice(0,3);
}


/* =========================================================
   VERIFICAR SE RODA NA DATA
========================================================= */

function viagemRodaNaData(
  viagem,
  dataISO
){

  if(
    !viagem ||
    !dataISO
  ){

    return false;
  }

  const diaEscolhido =
    normalizarDia(
      nomeDiaSemana(dataISO)
    );


  const diasViagem =
    String(viagem.dias || "")
      .split(",")
      .map(v =>
        normalizarDia(v)
      )
      .filter(Boolean);


  /*
    Se não tiver dias cadastrados,
    mantém o comportamento antigo:
    considera todos os dias.
  */

  if(!diasViagem.length){

    return true;
  }


  return diasViagem
    .includes(
      diaEscolhido
    );
}


/* =========================================================
   DATA + HORA LOCAL
========================================================= */

function montarDataHoraLocal(
  dataISO,
  horaStr
){

  if(
    !dataISO ||
    !horaStr
  ){

    return null;
  }

  const [
    ano,
    mes,
    dia
  ] =
    dataISO
      .split("-")
      .map(Number);


  const partes =
    String(horaStr)
      .trim()
      .split(":");


  const hora =
    Number(
      partes[0] || 0
    );

  const minuto =
    Number(
      partes[1] || 0
    );


  return new Date(
    ano,
    mes-1,
    dia,
    hora,
    minuto,
    0,
    0
  );
}


/* =========================================================
   VERIFICAR SE HORÁRIO JÁ PASSOU
========================================================= */

function viagemExpiradaParaData(
  viagem,
  dataISO
){

  if(
    !viagem ||
    !dataISO ||
    !viagem.hora
  ){

    return false;
  }


  const agora =
    new Date();

  const saida =
    montarDataHoraLocal(
      dataISO,
      viagem.hora
    );


  if(
    !saida ||
    isNaN(
      saida.getTime()
    )
  ){

    return false;
  }


  return agora >= saida;
}


/* =========================================================
   FORMATAR DATA
========================================================= */

function formatarData(
  dataISO
){

  if(!dataISO) return "";

  const [
    ano,
    mes,
    dia
  ] =
    dataISO.split("-");

  return `${dia}/${mes}/${ano}`;
}


/* =========================================================
   ENCONTRAR PRÓXIMA DATA
========================================================= */

function proximaDataDaViagem(
  viagem,
  dataInicial
){

  let data =
    new Date(
      ...dataInicial
        .split("-")
        .map(Number)
        .map((v,i) =>
          i === 1
            ? v-1
            : v
        )
    );


  /*
    Procura até 14 dias.
  */

  for(
    let i=0;
    i<14;
    i++
  ){

    const ano =
      data.getFullYear();

    const mes =
      String(
        data.getMonth()+1
      ).padStart(2,"0");

    const dia =
      String(
        data.getDate()
      ).padStart(2,"0");

    const iso =
      `${ano}-${mes}-${dia}`;


    if(
      viagemRodaNaData(
        viagem,
        iso
      )
    ){

      /*
        Se for hoje e o horário
        já passou, pula para
        o próximo dia.
      */

      if(
        iso === hojeISO() &&
        viagemExpiradaParaData(
          viagem,
          iso
        )
      ){

        data.setDate(
          data.getDate()+1
        );

        continue;
      }


      return iso;
    }


    data.setDate(
      data.getDate()+1
    );
  }


  return null;
}


/* =========================================================
   AJUSTAR DATA AUTOMATICAMENTE
========================================================= */

function ajustarDataParaViagens(){

  const hoje =
    hojeISO();


  /*
    Primeiro verifica se existe
    alguma viagem disponível hoje.
  */

  const existeHoje =
    viagens.some(
      viagem =>
        viagemRodaNaData(
          viagem,
          hoje
        ) &&
        !viagemExpiradaParaData(
          viagem,
          hoje
        )
    );


  if(existeHoje){

    return hoje;
  }


  /*
    Se todas as viagens de hoje
    já passaram, encontra a próxima
    data disponível.
  */

  let melhorData = null;


  for(
    const viagem of viagens
  ){

    const proxima =
      proximaDataDaViagem(
        viagem,
        hoje
      );


    if(
      proxima &&
      (
        !melhorData ||
        proxima < melhorData
      )
    ){

      melhorData =
        proxima;
    }
  }


  return melhorData || hoje;
}


/* =========================================================
   ALTERAR DATA
========================================================= */

window.alterarData = async function(){

  const valor =
    document
      .getElementById(
        "dataViagem"
      )
      .value;


  if(!valor){

    return;
  }


  dataSelecionada =
    valor;


  viagemSelecionada =
    null;

  poltronaSelecionada =
    null;

  veiculoSelecionado =
    null;


  document
    .getElementById(
      "cardPoltronas"
    )
    .style.display = "none";


  document
    .getElementById(
      "cardPassageiro"
    )
    .classList.remove(
      "visivel"
    );


  await atualizarTela();
};


/* =========================================================
   ATUALIZAR TELA
========================================================= */

async function atualizarTela(){

  const lista =
    document
      .getElementById(
        "listaViagens"
      );


  lista.innerHTML =
    `<div class="carregando">
      Verificando horários...
    </div>`;


  const data =
    dataSelecionada;


  let viagensDisponiveis =
    viagens.filter(
      viagem => {

        if(
          !viagemRodaNaData(
            viagem,
            data
          )
        ){

          return false;
        }


        /*
          REGRA PRINCIPAL:
          se a data for hoje e
          já passou do horário,
          não mostra a viagem.
        */

        if(
          data === hojeISO() &&
          viagemExpiradaParaData(
            viagem,
            data
          )
        ){

          return false;
        }


        return true;
      }
    );


  /*
    Se não encontrou nenhuma
    viagem na data escolhida,
    mostra a próxima data.
  */

  if(
    !viagensDisponiveis.length &&
    data === hojeISO()
  ){

    const novaData =
      ajustarDataParaViagens();


    if(
      novaData &&
      novaData !== data
    ){

      dataSelecionada =
        novaData;

      document
        .getElementById(
          "dataViagem"
        )
        .value =
          novaData;


      viagensDisponiveis =
        viagens.filter(
          viagem =>
            viagemRodaNaData(
              viagem,
              novaData
            )
        );


      document
        .getElementById(
          "infoData"
        )
        .innerHTML =
          `⏰ Os horários de hoje já passaram.
           Mostrando as próximas viagens disponíveis em
           <strong>${formatarData(novaData)}</strong>.`;

    }

  }else{

    document
      .getElementById(
        "infoData"
      )
      .innerHTML =
        `📅 Viagens disponíveis em
         <strong>${formatarData(data)}</strong>.`;
  }


  if(!viagensDisponiveis.length){

    lista.innerHTML =
      `<div class="vazio">
        🚍 Nenhuma viagem disponível
        para esta data.
      </div>`;

    return;
  }


  lista.innerHTML =
    viagensDisponiveis
      .map(
        viagem =>
          montarCardViagem(
            viagem,
            dataSelecionada
          )
      )
      .join("");
}


/* =========================================================
   CARD DA VIAGEM
========================================================= */

function montarCardViagem(
  viagem,
  data
){

  const selecionada =
    viagemSelecionada &&
    String(
      viagemSelecionada.id
    ) === String(viagem.id);


  return `

    <div
      class="viagem ${selecionada ? "selecionada" : ""}"
      onclick="selecionarViagem('${viagem.id}')"
    >

      <div class="viagem-rota">

        🚌
        ${escapeHtml(
          viagem.rota ||
          "Rota não informada"
        )}

      </div>


      <div class="viagem-info">

        <span class="badge badge-hora">

          🕐
          ${escapeHtml(
            viagem.hora ||
            "--:--"
          )}

        </span>


        <span class="badge badge-data">

          📅
          ${formatarData(data)}

        </span>


        <span class="badge">

          ${escapeHtml(
            viagem.dias ||
            "Todos os dias"
          )}

        </span>

      </div>

    </div>

  `;
}


/* =========================================================
   SELECIONAR VIAGEM
========================================================= */

window.selecionarViagem =
  async function(id){

    viagemSelecionada =
      viagens.find(
        viagem =>
          String(
            viagem.id
          ) === String(id)
      );


    if(!viagemSelecionada){

      return;
    }


    /*
      Segurança:
      verifica novamente se a viagem
      pode sair na data escolhida.
    */

    if(
      !viagemRodaNaData(
        viagemSelecionada,
        dataSelecionada
      )
    ){

      alert(
        "Essa viagem não roda nessa data."
      );

      return;
    }


    if(
      dataSelecionada === hojeISO() &&
      viagemExpiradaParaData(
        viagemSelecionada,
        dataSelecionada
      )
    ){

      /*
        Se o usuário clicou numa viagem
        cujo horário acabou de passar,
        automaticamente procura o próximo dia.
      */

      const novaData =
        proximaDataDaViagem(
          viagemSelecionada,
          hojeISO()
        );


      if(novaData){

        dataSelecionada =
          novaData;

        document
          .getElementById(
            "dataViagem"
          )
          .value =
            novaData;


        document
          .getElementById(
            "infoData"
          )
          .innerHTML =
            `⏰ O horário de hoje já passou.
             Próxima saída:
             <strong>${formatarData(novaData)}</strong>.`;


        await atualizarTela();

        return;
      }
    }


    await carregarPoltronas();
  };


/* =========================================================
   BUSCAR VEÍCULO
========================================================= */

async function buscarVeiculo(
  veiculoId
){

  if(!veiculoId){

    return null;
  }


  const { data, error } =
    await supabase
      .from("veiculos_passagens")
      .select("*")
      .eq("id", veiculoId)
      .eq("app_id", app_id)
      .maybeSingle();


  if(error){

    console.error(
      "Erro veículo:",
      error
    );

    return null;
  }


  return data;
}


/* =========================================================
   CARREGAR POLTRONAS
========================================================= */

async function carregarPoltronas(){

  if(!viagemSelecionada){

    return;
  }


  const card =
    document.getElementById(
      "cardPoltronas"
    );


  const mapa =
    document.getElementById(
      "mapaPoltronas"
    );


  card.style.display =
    "block";


  mapa.innerHTML =
    `<div class="carregando">
      Verificando poltronas...
    </div>`;


  veiculoSelecionado =
    await buscarVeiculo(
      viagemSelecionada.veiculo_id
    );


  if(!veiculoSelecionado){

    mapa.innerHTML =
      `<div class="erro">
        Não foi possível localizar
        o veículo da viagem.
      </div>`;

    return;
  }


  const total =
    Number(
      veiculoSelecionado.total_poltronas ||
      0
    );


  if(!total){

    mapa.innerHTML =
      `<div class="erro">
        O veículo não possui
        quantidade de poltronas cadastrada.
      </div>`;

    return;
  }


  /*
    BUSCA AS RESERVAS DAQUELA
    VIAGEM E DAQUELA DATA.
  */

  const { data: reservas, error } =
    await supabase
      .from("reservas_passagens")
      .select(
        "poltrona,status"
      )
      .eq(
        "app_id",
        app_id
      )
      .eq(
        "viagem_id",
        viagemSelecionada.id
      )
      .eq(
        "data_viagem",
        dataSelecionada
      );


  if(error){

    console.error(error);

    mapa.innerHTML =
      `<div class="erro">
        Erro ao consultar
        disponibilidade.
      </div>`;

    return;
  }


  const reservasValidas =
    (reservas || [])
      .filter(
        reserva => {

          const status =
            String(
              reserva.status ||
              ""
            ).toLowerCase();


          return ![
            "cancelado",
            "reembolsado",
            "reagendada"
          ].includes(status);
        }
      );


  document
    .getElementById(
      "resumoViagem"
    )
    .innerHTML = `

      <strong>
        ${escapeHtml(
          viagemSelecionada.rota
        )}
      </strong>

      <br>

      🕐 Saída:
      ${escapeHtml(
        viagemSelecionada.hora
      )}

      <br>

      📅 Data:
      ${formatarData(
        dataSelecionada
      )}

    `;


  let html = "";


  for(
    let numero=1;
    numero<=total;
    numero++
  ){

    const ocupada =
      reservasValidas.some(
        reserva =>
          Number(
            reserva.poltrona
          ) === numero
      );


    if(ocupada){

      html += `

        <button
          class="poltrona poltrona-ocupada"
          disabled
        >

          ${numero}

          <small>
            Ocupada
          </small>

        </button>

      `;

    }else{

      html += `

        <button
          type="button"
          id="poltrona-${numero}"
          class="poltrona poltrona-livre"
          onclick="selecionarPoltrona(${numero})"
        >

          ${numero}

          <small>
            Livre
          </small>

        </button>

      `;
    }
  }


  mapa.innerHTML =
    html;


  card.scrollIntoView({
    behavior:"smooth",
    block:"start"
  });
}


/* =========================================================
   SELECIONAR POLTRONA
========================================================= */

window.selecionarPoltrona =
  function(numero){

    /*
      Limpa seleção anterior.
    */

    document
      .querySelectorAll(
        ".poltrona-selecionada"
      )
      .forEach(
        el =>
          el.classList.remove(
            "poltrona-selecionada"
          )
      );


    const botao =
      document.getElementById(
        `poltrona-${numero}`
      );


    if(!botao){

      return;
    }


    botao.classList.add(
      "poltrona-selecionada"
    );


    poltronaSelecionada =
      numero;


    document
      .getElementById(
        "cardPassageiro"
      )
      .classList.add(
        "visivel"
      );


    document
      .getElementById(
        "resumoCompra"
      )
      .innerHTML = `

        🚌
        <strong>
          ${escapeHtml(
            viagemSelecionada.rota
          )}
        </strong>

        <br>

        📅
        ${formatarData(
          dataSelecionada
        )}

        <br>

        🕐
        ${escapeHtml(
          viagemSelecionada.hora
        )}

        <br>

        💺 Poltrona:
        <strong>
          ${numero}
        </strong>

      `;


    document
      .getElementById(
        "cardPassageiro"
      )
      .scrollIntoView({
        behavior:"smooth",
        block:"start"
      });
};


/* =========================================================
   RESERVAR PASSAGEM
========================================================= */

window.reservarPassagem =
  async function(){

    const nome =
      document
        .getElementById(
          "nomePassageiro"
        )
        .value
        .trim();


    const documento =
      document
        .getElementById(
          "documentoPassageiro"
        )
        .value
        .trim();


    const whatsapp =
      document
        .getElementById(
          "whatsappPassageiro"
        )
        .value
        .trim();


    if(!viagemSelecionada){

      mostrarMsgReserva(
        "Selecione uma viagem.",
        "erro"
      );

      return;
    }


    if(!dataSelecionada){

      mostrarMsgReserva(
        "Selecione a data da viagem.",
        "erro"
      );

      return;
    }


    if(!poltronaSelecionada){

      mostrarMsgReserva(
        "Selecione uma poltrona.",
        "erro"
      );

      return;
    }


    if(!nome){

      mostrarMsgReserva(
        "Digite o nome do passageiro.",
        "erro"
      );

      return;
    }


    if(!documento){

      mostrarMsgReserva(
        "Digite o CPF ou RG.",
        "erro"
      );

      return;
    }


    if(!whatsapp){

      mostrarMsgReserva(
        "Digite o WhatsApp.",
        "erro"
      );

      return;
    }


    /*
      NOVA VERIFICAÇÃO ANTES DE GRAVAR.
      Evita duas pessoas comprarem
      a mesma poltrona.
    */

    const { data: conflito } =
      await supabase
        .from(
          "reservas_passagens"
        )
        .select(
          "id,status"
        )
        .eq(
          "app_id",
          app_id
        )
        .eq(
          "viagem_id",
          viagemSelecionada.id
        )
        .eq(
          "data_viagem",
          dataSelecionada
        )
        .eq(
          "poltrona",
          poltronaSelecionada
        );


    const ocupada =
      (conflito || [])
        .some(
          reserva => {

            const status =
              String(
                reserva.status ||
                ""
              ).toLowerCase();


            return ![
              "cancelado",
              "reembolsado",
              "reagendada"
            ].includes(status);
          }
        );


    if(ocupada){

      mostrarMsgReserva(
        "Essa poltrona acabou de ser ocupada. Escolha outra.",
        "erro"
      );


      await carregarPoltronas();

      return;
    }


    /*
      VERIFICA NOVAMENTE O HORÁRIO.
    */

    if(
      dataSelecionada === hojeISO() &&
      viagemExpiradaParaData(
        viagemSelecionada,
        dataSelecionada
      )
    ){

      const novaData =
        proximaDataDaViagem(
          viagemSelecionada,
          hojeISO()
        );


      if(novaData){

        mostrarMsgReserva(
          `O horário das ${viagemSelecionada.hora} já passou. A próxima saída é ${formatarData(novaData)}.`,
          "erro"
        );


        dataSelecionada =
          novaData;


        document
          .getElementById(
            "dataViagem"
          )
          .value =
            novaData;


        await atualizarTela();

        return;
      }
    }


    /*
      GERA CÓDIGO.
    */

    const codigo =
      "FFP-" +
      Date.now();


    mostrarMsgReserva(
      "Registrando reserva...",
      "info"
    );


    /*
      Mantém os mesmos campos
      utilizados pelo sistema atual.
    */

    const { data, error } =
      await supabase
        .from(
          "reservas_passagens"
        )
        .insert([{

          app_id,

          viagem_id:
            viagemSelecionada.id,

          poltrona:
            poltronaSelecionada,

          nome,

          cpf_rg:
            documento,

          whatsapp,

          data_viagem:
            dataSelecionada,

          status:
            "pendente",

          codigo_embarque:
            codigo,

          origem_venda:
            "site"

        }])
        .select()
        .single();


    if(error){

      console.error(error);

      mostrarMsgReserva(
        "Erro ao criar a reserva: " +
        error.message,
        "erro"
      );

      return;
    }


    mostrarMsgReserva(
      `
      <strong>Reserva criada!</strong>
      <br><br>
      Código:
      <strong>${escapeHtml(codigo)}</strong>
      <br>
      Poltrona:
      <strong>${poltronaSelecionada}</strong>
      <br>
      Data:
      <strong>${formatarData(dataSelecionada)}</strong>
      <br>
      Horário:
      <strong>${escapeHtml(viagemSelecionada.hora)}</strong>
      `,
      "sucesso"
    );


    /*
      Atualiza o mapa.
    */

    await carregarPoltronas();
};


/* =========================================================
   MENSAGENS
========================================================= */

function mostrarMsgReserva(
  texto,
  tipo="info"
){

  const box =
    document.getElementById(
      "msgReserva"
    );


  box.className =
    tipo;


  box.innerHTML =
    texto;
}


function mostrarErro(
  texto
){

  const lista =
    document.getElementById(
      "listaViagens"
    );


  lista.innerHTML =
    `<div class="erro">
      ${escapeHtml(texto)}
    </div>`;
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(
  valor
){

  return String(
    valor ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );
}
