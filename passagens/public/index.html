<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>FF Transporte</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family: Arial, Helvetica, sans-serif;

    background:
        radial-gradient(
            circle at top,
            rgba(59,130,246,.14),
            transparent 30%
        ),
        linear-gradient(
            180deg,
            #020617 0%,
            #0f172a 100%
        );

    color: #fff;

    min-height: 100vh;
}


/* =========================================================
   TOPO
========================================================= */

.topo {

    padding: 20px;

    text-align: center;

}

.topo h2 {

    margin: 0;

    font-size: 25px;

}


/* =========================================================
   EMPRESA
========================================================= */

#empresaNome {

    max-width: 1200px;

    margin: 0 auto 20px;

    padding: 15px 20px;

    background: #1e293b;

    border: 1px solid rgba(255,255,255,.08);

    border-radius: 12px;

    font-size: 18px;

    font-weight: bold;

}


/* =========================================================
   CONTAINER
========================================================= */

.container {

    max-width: 1200px;

    margin: auto;

    padding: 20px;

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 20px;

}


/* =========================================================
   CARD
========================================================= */

.card {

    background:
        linear-gradient(
            180deg,
            #172033,
            #0f172a
        );

    border: 1px solid
        rgba(255,255,255,.08);

    border-radius: 18px;

    padding: 20px;

    box-shadow:
        0 15px 35px
        rgba(0,0,0,.25);

}

.card h3 {

    margin-top: 0;

}


/* =========================================================
   INPUTS
========================================================= */

select,
input,
button {

    width: 100%;

    padding: 13px;

    margin-top: 10px;

    border: none;

    border-radius: 10px;

    font-size: 15px;

}

select,
input {

    background: white;

    color: #111827;

}


/* =========================================================
   BOTÃO
========================================================= */

button {

    background:
        linear-gradient(
            135deg,
            #22c55e,
            #16a34a
        );

    color: white;

    font-weight: bold;

    cursor: pointer;

    transition: .2s;

}

button:hover {

    transform: translateY(-1px);

    opacity: .92;

}


/* =========================================================
   VIAGENS
========================================================= */

#listaViagens {

    display: flex;

    flex-direction: column;

    gap: 10px;

}


.viagem {

    background:
        linear-gradient(
            135deg,
            #334155,
            #1e293b
        );

    border: 2px solid
        transparent;

    padding: 16px;

    border-radius: 12px;

    cursor: pointer;

    transition: .2s;

}


.viagem:hover {

    border-color:
        rgba(96,165,250,.5);

    transform:
        translateY(-1px);

}


/* =========================================================
   VIAGEM SELECIONADA
========================================================= */

.viagem.selecionada {

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #1d4ed8
        );

    border-color:
        #93c5fd;

    box-shadow:
        0 0 0 3px
        rgba(59,130,246,.2);

}


.viagem.selecionada::after {

    content:
        "✓ VIAGEM SELECIONADA";

    display: block;

    margin-top: 10px;

    color: #dbeafe;

    font-size: 13px;

    font-weight: bold;

}


/* =========================================================
   POLTRONAS
========================================================= */

.poltronas {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 10px;

    margin-top: 10px;

}


.poltrona {

    min-height: 48px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 10px;

    font-weight: bold;

    cursor: pointer;

    transition: .2s;

    user-select: none;

}


.poltrona:hover {

    transform: scale(1.03);

}


.livre {

    background:
        linear-gradient(
            135deg,
            #22c55e,
            #16a34a
        );

}


.ocupado {

    background:
        linear-gradient(
            135deg,
            #ef4444,
            #dc2626
        );

    cursor: not-allowed;

    opacity: .75;

}


.poltrona.selecionado {

    background:
        linear-gradient(
            135deg,
            #3b82f6,
            #2563eb
        ) !important;

    outline:
        3px solid #93c5fd;

}


/* =========================================================
   VIAGEM ESCOLHIDA
========================================================= */

.viagemEscolhida {

    grid-column:
        1 / -1;

    background:
        linear-gradient(
            135deg,
            #1d4ed8,
            #2563eb
        );

    border:
        2px solid #60a5fa;

    border-radius: 12px;

    padding: 15px;

    margin-bottom: 5px;

}


.viagemEscolhida strong {

    display: block;

    margin-bottom: 5px;

}


/* =========================================================
   MENSAGENS
========================================================= */

.mensagem {

    padding: 18px;

    border-radius: 10px;

    background: #334155;

    text-align: center;

}


.erro {

    background: #7f1d1d;

}


.aviso {

    background: #78350f;

}


/* =========================================================
   LEGENDA
========================================================= */

.legenda {

    display: flex;

    gap: 10px;

    flex-wrap: wrap;

    margin-top: 15px;

    font-size: 13px;

}


.legenda span {

    padding: 7px 10px;

    border-radius: 7px;

}


.legenda-livre {

    background: #16a34a;

}


.legenda-ocupado {

    background: #dc2626;

}


.legenda-selecionado {

    background: #2563eb;

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width: 700px) {

    .container {

        grid-template-columns: 1fr;

        padding: 10px;

    }

    #empresaNome {

        margin-left: 10px;

        margin-right: 10px;

    }

    .poltronas {

        grid-template-columns:
            repeat(4, 1fr);

    }

}

</style>

</head>


<body>


<!-- =====================================================
     TOPO
===================================================== -->

<div class="topo">

    <h2>

        🚌 FF TRANSPORTE

    </h2>

</div>


<!-- =====================================================
     EMPRESA
===================================================== -->

<div id="empresaNome">

    Carregando empresa...

</div>


<div class="container">


<!-- =====================================================
     CARD VIAGENS
===================================================== -->

<div class="card">

    <h3>

        🛣️ Escolha sua viagem

    </h3>


    <select id="tipoViagem">

        <option value="ida">

            Somente Ida

        </option>

    </select>


    <div
        id="listaViagens"
        style="margin-top:15px;"
    >

        <div class="mensagem">

            Carregando viagens...

        </div>

    </div>

</div>


<!-- =====================================================
     CARD POLTRONAS
===================================================== -->

<div class="card">

    <h3>

        💺 Escolha sua poltrona

    </h3>


    <div
        id="poltronas"
        class="poltronas"
    >

        <div
            class="mensagem"
            style="grid-column:1/-1;"
        >

            Primeiro selecione uma viagem.

        </div>

    </div>


    <div class="legenda">

        <span class="legenda-livre">

            Livre

        </span>

        <span class="legenda-ocupado">

            Ocupada

        </span>

        <span class="legenda-selecionado">

            Selecionada

        </span>

    </div>


    <h3 style="margin-top:25px;">

        💳 Pagamento

    </h3>


    <select id="formaPagamento">

        <option value="">

            Forma de pagamento

        </option>

        <option value="pix">

            PIX

        </option>

        <option value="dinheiro">

            Dinheiro

        </option>

    </select>


    <input
        type="text"
        id="nomePassageiro"
        placeholder="Nome do passageiro"
    >


    <button
        type="button"
        onclick="reservar()"
    >

        Pagar e Reservar

    </button>

</div>


</div>


<script type="module">


/* =========================================================
   SUPABASE
========================================================= */

import {
    supabase
} from "../../js/supabase-login.js";


/* =========================================================
   APP_ID
========================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


const app_id =
    params.get("app_id");


console.log(
    "================================"
);

console.log(
    "APP ID:",
    app_id
);

console.log(
    "================================"
);


/* =========================================================
   VARIÁVEIS
========================================================= */

let viagens = [];

let viagemSelecionada = null;

let poltronaSelecionada = null;

let veiculoSelecionado = null;


/* =========================================================
   VALIDAR APP_ID
========================================================= */

if (!app_id) {

    document.body.innerHTML = `

        <div style="
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            background:#0f172a;
            color:white;
            font-family:Arial;
            padding:20px;
        ">

            <div style="
                max-width:500px;
                width:100%;
                text-align:center;
                background:#1e293b;
                padding:30px;
                border-radius:15px;
            ">

                <h2>
                    ⚠️ Empresa não identificada
                </h2>

                <p>
                    O link da página pública
                    não possui o app_id da empresa.
                </p>

                <p style="
                    font-size:13px;
                    opacity:.7;
                ">

                    Exemplo:<br>

                    /passagens/public/?app_id=ID

                </p>

            </div>

        </div>

    `;

    throw new Error(
        "app_id não informado"
    );

}


/* =========================================================
   ESCAPAR HTML
========================================================= */

function escapeHtml(texto) {

    return String(
        texto ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================================================
   CARREGAR EMPRESA
========================================================= */

async function carregarEmpresa() {

    const elemento =
        document.getElementById(
            "empresaNome"
        );


    const {
        data,
        error
    } = await supabase

        .from("negocios")

        .select("nome")

        .eq(
            "app_id",
            app_id
        )

        .eq(
            "ativo",
            true
        )

        .maybeSingle();


    if (error) {

        console.error(
            "Erro empresa:",
            error
        );

        elemento.innerHTML =
            "🚌 FF TRANSPORTE";

        return;

    }


    if (data?.nome) {

        elemento.innerHTML =
            "🚌 " +
            escapeHtml(
                data.nome
            );

    } else {

        elemento.innerHTML =
            "🚌 FF TRANSPORTE";

    }

}


/* =========================================================
   CARREGAR VIAGENS
========================================================= */

async function carregarViagens() {

    const lista =
        document.getElementById(
            "listaViagens"
        );


    lista.innerHTML = `

        <div class="mensagem">

            🔄 Carregando viagens...

        </div>

    `;


    console.log(
        "Buscando viagens para app_id:",
        app_id
    );


    const {
        data,
        error
    } = await supabase

        .from("viagens_passagens")

        .select("*")

        .eq(
            "app_id",
            app_id
        )

        .order(
            "id",
            {
                ascending:false
            }
        );


    if (error) {

        console.error(
            "ERRO VIAGENS:",
            error
        );


        lista.innerHTML = `

            <div class="mensagem erro">

                ❌ Erro ao carregar viagens.

                <br><br>

                ${escapeHtml(
                    error.message
                )}

            </div>

        `;

        return;

    }


    viagens =
        data || [];


    console.log(
        "VIAGENS ENCONTRADAS:",
        viagens
    );


    if (
        viagens.length === 0
    ) {

        lista.innerHTML = `

            <div class="mensagem">

                🚌 Nenhuma viagem
                cadastrada para esta empresa.

            </div>

        `;

        return;

    }


    lista.innerHTML = "";


    viagens.forEach(
        viagem => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "viagem";


            const valor =
                Number(
                    viagem.valor || 0
                );


            div.innerHTML = `

                <div style="
                    font-size:17px;
                    font-weight:bold;
                    margin-bottom:7px;
                ">

                    🚌
                    ${escapeHtml(
                        viagem.rota ||
                        "Viagem"
                    )}

                </div>


                <div>

                    🕐
                    ${escapeHtml(
                        viagem.hora ||
                        "-"
                    )}

                </div>


                <div style="
                    margin-top:4px;
                ">

                    📅
                    ${escapeHtml(
                        viagem.dias ||
                        "Todos os dias"
                    )}

                </div>


                <div style="
                    margin-top:7px;
                    font-weight:bold;
                ">

                    💰 R$
                    ${valor.toFixed(2)}

                </div>

            `;


            div.addEventListener(
                "click",
                () => {

                    selecionarViagem(
                        viagem,
                        div
                    );

                }
            );


            lista.appendChild(
                div
            );

        }
    );

}


/* =========================================================
   SELECIONAR VIAGEM
========================================================= */

async function selecionarViagem(
    viagem,
    elemento
) {

    console.log(
        "VIAGEM SELECIONADA:",
        viagem
    );


    viagemSelecionada =
        viagem;


    poltronaSelecionada =
        null;


    /*
     * Remove seleção anterior
     */

    document
        .querySelectorAll(
            ".viagem"
        )

        .forEach(
            item => {

                item.classList.remove(
                    "selecionada"
                );

            }
        );


    /*
     * Marca visualmente
     */

    elemento.classList.add(
        "selecionada"
    );


    /*
     * Mostra carregando
     */

    const poltronas =
        document.getElementById(
            "poltronas"
        );


    poltronas.innerHTML = `

        <div
            class="mensagem"
            style="grid-column:1/-1;"
        >

            🔄 Carregando veículo...

        </div>

    `;


    /*
     * Busca veículo
     */

    await carregarVeiculoDaViagem(
        viagem
    );

}


/* =========================================================
   CARREGAR VEÍCULO DA VIAGEM
========================================================= */

async function carregarVeiculoDaViagem(
    viagem
) {


    veiculoSelecionado =
        null;


    if (
        !viagem.veiculo_id
    ) {

        console.warn(
            "Viagem sem veiculo_id:",
            viagem
        );


        mostrarPoltronas(
            viagem,
            null
        );

        return;

    }


    const {
        data,
        error
    } = await supabase

        .from(
            "veiculos_passagens"
        )

        .select("*")

        .eq(
            "id",
            viagem.veiculo_id
        )

        .eq(
            "app_id",
            app_id
        )

        .maybeSingle();


    if (error) {

        console.error(
            "Erro ao carregar veículo:",
            error
        );


        mostrarPoltronas(
            viagem,
            null
        );

        return;

    }


    veiculoSelecionado =
        data;


    console.log(
        "VEÍCULO DA VIAGEM:",
        data
    );


    mostrarPoltronas(
        viagem,
        data
    );

}


/* =========================================================
   TIPO DA POLTRONA
========================================================= */

function getTipoPoltrona(
    veiculo,
    numero
) {


    if (
        Array.isArray(
            veiculo?.poltronas_config
        )
    ) {

        const item =
            veiculo.poltronas_config.find(
                p =>
                    Number(
                        p.numero
                    ) ===
                    Number(
                        numero
                    )
            );


        if (item?.tipo) {

            return item.tipo;

        }

    }


    return (
        veiculo?.tipo_poltrona ||
        "padrao"
    );

}


/* =========================================================
   NOME DO TIPO
========================================================= */

function nomeTipoPoltrona(
    tipo
) {

    const nomes = {

        padrao:
            "Padrão",

        semi_leito:
            "Semi-Leito",

        leito:
            "Leito"

    };


    return (
        nomes[tipo] ||
        tipo ||
        "Padrão"
    );

}


/* =========================================================
   MOSTRAR POLTRONAS
========================================================= */

function mostrarPoltronas(
    viagem,
    veiculo
) {


    const area =
        document.getElementById(
            "poltronas"
        );


    /*
     * Quantidade
     */

    let total =
        Number(
            veiculo?.total_poltronas ||
            20
        );


    if (
        !Number.isFinite(total) ||
        total <= 0
    ) {

        total = 20;

    }


    /*
     * Rota
     */

    const rota =
        viagem.rota ||
        "Viagem";


    /*
     * Horário
     */

    const hora =
        viagem.hora ||
        "";


    /*
     * Cabeçalho
     */

    area.innerHTML = `

        <div class="viagemEscolhida">

            <strong>

                ✓ VIAGEM SELECIONADA

            </strong>

            <span>

                ${escapeHtml(
                    rota
                )}

            </span>

            ${
                hora
                ? `
                    <br>

                    <small>
                        🕐
                        ${escapeHtml(
                            hora
                        )}
                    </small>
                  `
                : ""
            }

        </div>

    `;


    /*
     * Criar poltronas
     */

    for (
        let numero = 1;
        numero <= total;
        numero++
    ) {


        const poltrona =
            document.createElement(
                "div"
            );


        poltrona.className =
            "poltrona livre";


        poltrona.dataset.numero =
            numero;


        const tipo =
            getTipoPoltrona(
                veiculo,
                numero
            );


        poltrona.innerHTML = `

            <div>

                ${numero}

            </div>

            <small style="
                display:block;
                font-size:9px;
                margin-top:3px;
                opacity:.85;
            ">

                ${escapeHtml(
                    nomeTipoPoltrona(
                        tipo
                    )
                )}

            </small>

        `;


        poltrona.addEventListener(
            "click",
            () => {

                selecionarPoltrona(
                    numero,
                    poltrona
                );

            }
        );


        area.appendChild(
            poltrona
        );

    }

}


/* =========================================================
   SELECIONAR POLTRONA
========================================================= */

function selecionarPoltrona(
    numero,
    elemento
) {


    if (
        elemento.classList.contains(
            "ocupado"
        )
    ) {

        return;

    }


    document
        .querySelectorAll(
            ".poltrona"
        )

        .forEach(
            item => {

                item.classList.remove(
                    "selecionado"
                );

            }
        );


    elemento.classList.add(
        "selecionado"
    );


    poltronaSelecionada =
        numero;


    console.log(
        "POLTRONA:",
        numero
    );


    console.log(
        "VIAGEM:",
        viagemSelecionada
    );


    console.log(
        "APP_ID:",
        app_id
    );

}


/* =========================================================
   RESERVAR
========================================================= */

async function reservar() {


    /*
     * Viagem
     */

    if (
        !viagemSelecionada
    ) {

        alert(
            "Selecione uma viagem primeiro."
        );

        return;

    }


    /*
     * Poltrona
     */

    if (
        !poltronaSelecionada
    ) {

        alert(
            "Selecione uma poltrona."
        );

        return;

    }


    /*
     * Nome
     */

    const nome =
        document
            .getElementById(
                "nomePassageiro"
            )
            .value
            .trim();


    if (!nome) {

        alert(
            "Informe o nome do passageiro."
        );

        return;

    }


    /*
     * Pagamento
     */

    const pagamento =
        document
            .getElementById(
                "formaPagamento"
            )
            .value;


    if (!pagamento) {

        alert(
            "Selecione a forma de pagamento."
        );

        return;

    }


    /*
     * Dados
     */

    const reserva = {

        app_id:

            app_id,

        viagem_id:

            viagemSelecionada.id,

        veiculo_id:

            viagemSelecionada.veiculo_id,

        poltrona:

            poltronaSelecionada,

        nome:

            nome,

        forma_pagamento:

            pagamento

    };


    console.log(
        "RESERVA:",
        reserva
    );


    /*
     * Ainda não grava.
     *
     * A estrutura de reservas do seu admin
     * possui regras adicionais de trecho,
     * data, status etc.
     *
     * Por isso não vou criar uma gravação
     * incompleta que possa quebrar o sistema.
     */

    alert(

        "Viagem selecionada com sucesso!\n\n" +

        "Rota: " +
        (
            viagemSelecionada.rota ||
            "-"
        ) +

        "\nPoltrona: " +
        poltronaSelecionada +

        "\nPassageiro: " +
        nome

    );

}


/* =========================================================
   EXPOR FUNÇÃO
========================================================= */

window.reservar =
    reservar;


/* =========================================================
   INICIAR
========================================================= */

carregarEmpresa();

carregarViagens();


</script>

</body>

</html>
