<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Painel de Negócios</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #020617;
      color: #fff;
    }

    .topo {
      background: #0f172a;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1e293b;
    }

    .topo h1 {
      font-size: 20px;
      margin: 0;
    }

    .btn-sair {
      background: #dc2626;
      color: #fff;
      border: none;
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 24px;
    }

    .bemvindo {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 24px;
      cursor: default;
    }

    .bemvindo h2 {
      margin-top: 0;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 18px;
    }

    .card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .25);
    }

    .card h3 {
      margin-top: 0;
      margin-bottom: 12px;
      word-break: break-word;
    }

    .tipo {
      color: #38bdf8;
      font-size: 14px;
      margin-bottom: 8px;
      font-weight: bold;
    }

    .app {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 16px;
    }

    .acoes {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      padding: 11px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      color: #fff;
    }

    .btn:hover {
      opacity: .9;
    }

    .btn:disabled {
      cursor: not-allowed;
    }

    .btn-admin {
      background: #22c55e;
    }

    .btn-loja {
      background: #38bdf8;
      color: #020617;
    }

    .btn-editar {
      background: #f59e0b;
    }

    .btn-renovar {
      background: #6366f1;
    }

    .btn-deletar {
      background: #ef4444;
    }

    .vazio {
      background: #0f172a;
      border: 1px dashed #334155;
      border-radius: 16px;
      padding: 30px;
      text-align: center;
      color: #94a3b8;
      grid-column: 1 / -1;
    }

    @media (max-width: 600px) {
      .container {
        padding: 14px;
      }

      .acoes {
        flex-direction: column;
      }

      .acoes .btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="topo">
    <h1>🏢 Painel de Negócios</h1>

    <button class="btn-sair" onclick="sair()">
      Sair
    </button>
  </div>

  <div class="container">

    <div class="bemvindo" id="cardMinhasLojas">
      <h2>Minhas lojas</h2>
      <p>Escolha qual negócio deseja administrar.</p>
    </div>

    <div id="listaNegocios" class="grid"></div>

  </div>


  <script type="module">

    /* =====================================================
       SUPABASE
       ===================================================== */

    import { supabase as db } from "../js/supabase-login.js";


    /* =====================================================
       AVISO DE VENCIMENTO
       ===================================================== */

    function avisoVencimento(app) {

      if (!app) {

        return `
          <div style="
            color:#f87171;
            font-size:13px;
            margin-bottom:10px;
          ">
            ⚠️ App não encontrado
          </div>
        `;

      }


      if (app.ativo === false) {

        return `
          <div style="
            color:#f87171;
            font-size:13px;
            margin-bottom:10px;
          ">
            ⛔ Loja bloqueada
          </div>
        `;

      }


      if (!app.data_expiracao) {

        return `
          <div style="
            color:#94a3b8;
            font-size:13px;
            margin-bottom:10px;
          ">
            Plano sem vencimento
          </div>
        `;

      }


      const hoje = new Date();

      const vencimento =
        new Date(app.data_expiracao);

      const dias =
        Math.ceil(
          (vencimento - hoje) /
          (1000 * 60 * 60 * 24)
        );


      if (dias <= 0) {

        return `
          <div style="
            color:#f87171;
            font-size:13px;
            margin-bottom:10px;
          ">
            ⛔ Plano expirado
          </div>
        `;

      }


      if (dias <= 15) {

        return `
          <div style="
            color:#facc15;
            font-size:13px;
            margin-bottom:10px;
          ">
            ⚠️ Vence em ${dias} dia(s)
          </div>
        `;

      }


      return `
        <div style="
          color:#22c55e;
          font-size:13px;
          margin-bottom:10px;
        ">
          ✅ Ativa — vence em ${dias} dia(s)
        </div>
      `;

    }


    /* =====================================================
       STATUS DO PLANO
       ===================================================== */

    function statusPlano(app) {

      if (!app) {

        return {
          bloqueado: true,
          dias: null
        };

      }


      if (app.ativo === false) {

        return {
          bloqueado: true,
          dias: null
        };

      }


      if (!app.data_expiracao) {

        return {
          bloqueado: false,
          dias: null
        };

      }


      const hoje = new Date();

      const vencimento =
        new Date(app.data_expiracao);

      const dias =
        Math.ceil(
          (vencimento - hoje) /
          (1000 * 60 * 60 * 24)
        );


      return {
        bloqueado: dias <= 0,
        dias
      };

    }


    /* =====================================================
       PROTEÇÃO DE AÇÕES
       ===================================================== */

    function protegerAcao(callback) {

      const senha =
        prompt("Digite a senha de segurança:");

      const senhaCorreta = "123456";


      if (senha !== senhaCorreta) {

        alert("Senha incorreta.");

        return;

      }


      callback();

    }


    /* =====================================================
       INICIAR
       ===================================================== */

    document.addEventListener(
      "DOMContentLoaded",
      iniciar
    );


    async function iniciar() {

      const lista =
        document.getElementById(
          "listaNegocios"
        );


      lista.innerHTML = `
        <div class="vazio">
          Carregando negócios...
        </div>
      `;


      /* ===================================================
         VERIFICA LOGIN
         =================================================== */

      const {
        data: { session },
        error: sessionError
      } = await db.auth.getSession();


      if (sessionError) {

        console.error(
          "Erro ao verificar sessão:",
          sessionError
        );

      }


      if (!session) {

        window.location.href =
          "/auth/login.html";

        return;

      }


      /* ===================================================
         BUSCA NEGÓCIOS DO USUÁRIO
         =================================================== */

      const {
        data: negocios,
        error: negError
      } = await db
        .from("negocios")
        .select("*")
        .eq("dono_id", session.user.id)
        .eq("ativo", true);


      if (negError) {

        console.error(
          "Erro ao carregar negócios:",
          negError
        );

        lista.innerHTML = `
          <div class="vazio">
            ❌ Erro ao carregar negócios.
            <br><br>
            ${negError.message || ""}
          </div>
        `;

        return;

      }


      if (!negocios || negocios.length === 0) {

        lista.innerHTML = `
          <div class="vazio">
            🏪 Nenhum negócio cadastrado.
          </div>
        `;

        return;

      }


      /* ===================================================
         PEGA APP_IDs
         =================================================== */

      const appIds =
        negocios
          .map(n => n.app_id)
          .filter(Boolean);


      let apps = [];
      let appsError = null;


      /* ===================================================
         BUSCA APPS SOMENTE SE EXISTIREM APP_IDs
         =================================================== */

      if (appIds.length > 0) {

        const resultado =
          await db
            .from("apps")
            .select(
              "id, ativo, plano, data_expiracao"
            )
            .in("id", appIds);

        apps = resultado.data || [];
        appsError = resultado.error;

      }


      if (appsError) {

        console.error(
          "Erro ao carregar planos:",
          appsError
        );

        lista.innerHTML = `
          <div class="vazio">
            ❌ Erro ao carregar os planos das lojas.
            <br><br>
            ${appsError.message || ""}
          </div>
        `;

        return;

      }


      /* ===================================================
         CRIA MAPA DOS APPS
         =================================================== */

      const appsMap = {};


      apps.forEach(app => {

        appsMap[app.id] = app;

      });


      /* ===================================================
         MONTA OS CARDS
         =================================================== */

      lista.innerHTML =
        negocios
          .map(n => {

            const app =
              appsMap[n.app_id];

            const plano =
              statusPlano(app);


            const nome =
              String(n.nome || "Negócio")
                .replace(/'/g, "\\'")
                .replace(/"/g, "&quot;");


            const tipo =
              String(n.tipo || "")
                .replace(/'/g, "\\'");


            const appId =
              String(n.app_id || "")
                .replace(/'/g, "\\'");


            const negocioId =
              String(n.id || "")
                .replace(/'/g, "\\'");


            return `

              <div class="card">

                <div class="tipo">
                  ${n.tipo || "Sistema"}
                </div>

                <h3>
                  ${n.nome || "Negócio sem nome"}
                </h3>

                <div class="app">
                  APP ID:
                  ${n.app_id || "não configurado"}
                </div>

                ${avisoVencimento(app)}

                <div class="acoes">

                  <!-- GERENCIAR -->

                  <button
                    class="btn btn-admin"
                    ${
                      plano.bloqueado
                        ? "disabled"
                        : ""
                    }
                    onclick="${
                      plano.bloqueado
                        ? ""
                        : `abrirAdmin('${appId}', '${tipo}')`
                    }"
                    ${
                      plano.bloqueado
                        ? "style='opacity:.5;cursor:not-allowed;background:#64748b'"
                        : ""
                    }
                  >
                    ${
                      plano.bloqueado
                        ? "🔒 Bloqueado"
                        : "⚙️ Gerenciar"
                    }
                  </button>


                  <!-- VER LOJA -->

                  <button
                    class="btn btn-loja"
                    onclick="
                      abrirLoja(
                        '${appId}',
                        '${tipo}'
                      )
                    "
                  >
                    🌐 Ver loja
                  </button>


                  <!-- EDITAR -->

                  <button
                    class="btn btn-editar"
                    onclick="
                      protegerAcao(
                        () =>
                          editarNegocio(
                            '${negocioId}',
                            '${appId}',
                            '${nome}',
                            '${tipo}'
                          )
                      )
                    "
                  >
                    ✏️ Editar
                  </button>


                  <!-- RENOVAR -->

                  <button
                    class="btn btn-renovar"
                    onclick="
                      renovarPlano(
                        '${appId}',
                        '${nome}'
                      )
                    "
                  >
                    🔄 Renovar
                  </button>


                  <!-- DELETAR -->

                  <button
                    class="btn btn-deletar"
                    onclick="
                      protegerAcao(
                        () =>
                          deletarNegocio(
                            '${negocioId}',
                            '${appId}'
                          )
                      )
                    "
                  >
                    🗑️ Deletar
                  </button>

                </div>

              </div>

            `;

          })
          .join("");

    }


    /* =====================================================
       ABRIR ADMIN
       ===================================================== */

    function abrirAdmin(
      appId,
      tipo
    ) {

      const sistema =
        String(tipo || "")
          .toLowerCase()
          .trim();


      if (!sistema) {

        alert(
          "Tipo do negócio não configurado."
        );

        return;

      }


      window.location.href =
        `/${sistema}/admin.html?app_id=${encodeURIComponent(appId)}`;

    }


    /* =====================================================
       ABRIR LOJA PÚBLICA
       ===================================================== */

    function abrirLoja(
      appId,
      tipo
    ) {

      const sistema =
        String(tipo || "")
          .toLowerCase()
          .trim();


      /*
       * CADA TIPO DE NEGÓCIO
       * POSSUI SUA PÁGINA PÚBLICA
       */

      const paginas = {

        // 🚌 PASSAGENS
        passagens:
          "/passagens/public/",

        // 💧 ÁGUA
        agua:
          "/public/agua/",

        // 🔥 GÁS
        gas:
          "/public/agua/",

        // 🏭 FF GÁZ
        ffgaz:
          "/ffgaz/public/",

        // 🛒 MERCADO
        mercado:
          "/public/mercado/",

        // 📅 AGENDAMENTO
        agendamento:
          "/agendamento/",

        // 💈 BARBEARIA
        barbearia:
          "/agendamento/",

        // 🏨 HOTEL
        hotel:
          "/hotel/public/",

        // 🔧 BORRACHARIA
        borracharia:
          "/borracharia/public/",

        // 📡 HOTSPOT
        hotspot:
          "/hotspot/"

      };


      const url =
        paginas[sistema];


      if (!url) {

        alert(
          `A página pública do sistema "${sistema}" ainda não foi configurada.`
        );

        console.error(
          "Tipo sem página pública:",
          sistema
        );

        return;

      }


      window.location.href =
        `${url}?app_id=${encodeURIComponent(appId)}`;

    }


    /* =====================================================
       EDITAR NEGÓCIO
       ===================================================== */

    async function editarNegocio(
      id,
      appId,
      nomeAtual,
      tipoAtual
    ) {

      const nome =
        prompt(
          "Novo nome do negócio:",
          nomeAtual
        );


      if (!nome || !nome.trim()) {

        return;

      }


      const tipo =
        prompt(
          "Tipo do sistema (ex: bar, gas, borracharia):",
          tipoAtual
        );


      if (!tipo || !tipo.trim()) {

        return;

      }


      const nomeFinal =
        nome.trim();


      const tipoFinal =
        tipo.trim().toLowerCase();


      /* ===================================================
         ATUALIZA NEGÓCIO
         =================================================== */

      const {
        error
      } = await db
        .from("negocios")
        .update({
          nome: nomeFinal,
          tipo: tipoFinal
        })
        .eq("id", id);


      if (error) {

        alert(
          "Erro ao editar: " +
          error.message
        );

        console.error(
          "Erro negocios:",
          error
        );

        return;

      }


      /* ===================================================
         ATUALIZA HOTSPOT
         =================================================== */

      const {
        error: erroHotspot
      } = await db
        .from("hotspot_config")
        .update({
          nome_hotspot: nomeFinal
        })
        .eq("app_id", appId);


      if (erroHotspot) {

        console.error(
          "Erro hotspot_config:",
          erroHotspot
        );

      }


      /* ===================================================
         ATUALIZA MONITOR
         =================================================== */

      const {
        error: erroMonitor
      } = await db
        .from("monitor_config")
        .update({
          nome_empresa: nomeFinal
        })
        .eq("app_id", appId);


      if (erroMonitor) {

        console.error(
          "Erro monitor_config:",
          erroMonitor
        );

      }


      alert(
        "Negócio atualizado com sucesso!"
      );


      await iniciar();

    }


    /* =====================================================
       DELETAR NEGÓCIO
       ===================================================== */

    async function deletarNegocio(
      id,
      appId
    ) {

      const confirmar =
        confirm(
          "Excluir este negócio da lista?"
        );


      if (!confirmar) {

        return;

      }


      const {
        error
      } = await db
        .from("negocios")
        .delete()
        .eq("id", id)
        .eq("app_id", appId);


      if (error) {

        alert(
          "Erro ao deletar: " +
          error.message
        );

        console.error(
          "Erro ao deletar:",
          error
        );

        return;

      }


      alert(
        "Negócio removido da lista."
      );


      await iniciar();

    }


    /* =====================================================
       RENOVAR PLANO
       ===================================================== */

    function renovarPlano(
      appId,
      nome
    ) {

      const url =
        `https://www.ffsolucoes.com.br/pagamento/renovar?app_id=${encodeURIComponent(appId)}&nome=${encodeURIComponent(nome)}`;


      window.location.href =
        url;

    }


    /* =====================================================
       SAIR
       ===================================================== */

    async function sair() {

      try {

        await db.auth.signOut();

      } catch (error) {

        console.error(
          "Erro ao sair:",
          error
        );

      }


      window.location.href =
        "/auth/login.html";

    }


    /* =====================================================
       CLIQUE SECRETO
       20 CLIQUES NO CARD
       ===================================================== */

    let cliquesSecretos = 0;

    let tempoCliqueSecreto = null;


    document
      .getElementById("cardMinhasLojas")
      ?.addEventListener(
        "click",
        () => {

          cliquesSecretos++;


          clearTimeout(
            tempoCliqueSecreto
          );


          tempoCliqueSecreto =
            setTimeout(
              () => {

                cliquesSecretos = 0;

              },
              2500
            );


          if (cliquesSecretos >= 20) {

            cliquesSecretos = 0;


            window.location.href =
              "https://www.ffsolucoes.com.br/super/painel-dominios.html";

          }

        }
      );


    /* =====================================================
       DISPONIBILIZAR FUNÇÕES PARA ONCLICK
       ===================================================== */

    window.abrirAdmin =
      abrirAdmin;

    window.abrirLoja =
      abrirLoja;

    window.protegerAcao =
      protegerAcao;

    window.editarNegocio =
      editarNegocio;

    window.renovarPlano =
      renovarPlano;

    window.deletarNegocio =
      deletarNegocio;

    window.sair =
      sair;

  </script>

</body>

</html>
