<body>                                                                                                                                    
<br>                                                                                                                                       
<div class="topo">                                                                                                                        
  <h1>🏢 Painel de Negócios</h1>                                                                                                         
  <button class="btn-sair" onclick="sair()">Sair</button>                                                                                
</div>                                                                                                                                    
<br>                                                                                                                                       
<div class="container">                                                                                                                   
  <div class="bemvindo" id="cardMinhasLojas">                                                                                             
  <h2>Minhas lojas</h2>                                                                                                                  
  <p>Escolha qual negócio deseja administrar.</p>                                                                                        
</div>                                                                                                                                    
<br>                                                                                                                                       
  <div id="listaNegocios" class="grid"></div>                                                                                            
</div>                                                                                                                                    
<br>                                                                                                                                       
<script>                                                                                                                                  
<br>                                                                                                                                       
/* =========================                                                                                                              
   SUPABASE                                                                                                                                
========================= */                                                                                                              
const db = window\.supabase.createClient(                                                                                                  
  "https\://pdajixsoowcyhnjwhgpc.supabase.co",                                                                                             
  "sb_publishable_LatlFlcxk6IchHe3RNmfwA_9Oq4EsZw"                                                                                      
);                                                                                                                                         
<br>                                                                                                                                       
function avisoVencimento(app){                                                                                                             
  if(!app){                                                                                                                                
    return `<div style="color:#f87171;font-size:13px;margin-bottom:10px;">                                                               
      ⚠️ App não encontrado                                                                                                                
    </div>`;                                                                                                                             
  }                                                                                                                                        
<br>                                                                                                                                       
  if(app.ativo === false){                                                                                                                 
    return `<div style="color:#f87171;font-size:13px;margin-bottom:10px;">                                                               
      ⛔ Loja bloqueada                                                                                                                     
    </div>`;                                                                                                                             
  }                                                                                                                                        
<br>                                                                                                                                       
  if(!app.data_expiracao){                                                                                                                
    return `<div style="color:#94a3b8;font-size:13px;margin-bottom:10px;">                                                               
      Plano sem vencimento                                                                                                                 
    </div>`;                                                                                                                             
  }                                                                                                                                        
<br>                                                                                                                                       
  const hoje = new Date();                                                                                                                 
  const vencimento = new Date(app.data_expiracao);                                                                                        
  const dias = Math.ceil((vencimento - hoje) / (1000 * 60 * 60 * 24));                                                                  
<br>                                                                                                                                       
  if(dias <= 0){                                                                                                                           
    return `<div style="color:#f87171;font-size:13px;margin-bottom:10px;">                                                               
      ⛔ Plano expirado                                                                                                                     
    </div>`;                                                                                                                             
  }                                                                                                                                        
<br>                                                                                                                                       
  if(dias <= 15){                                                                                                                          
    return `<div style="color:#facc15;font-size:13px;margin-bottom:10px;">                                                               
      ⚠️ Vence em ${dias} dia(s)                                                                                                           
    </div>`;                                                                                                                             
  }                                                                                                                                        
<br>                                                                                                                                       
  return `<div style="color:#22c55e;font-size:13px;margin-bottom:10px;">                                                                 
    ✅ Ativa — vence em ${dias} dia(s)                                                                                                      
  </div>`;                                                                                                                               
}                                                                                                                                          
<br>                                                                                                                                       
function protegerAcao(callback){                                                                                                           
  const senha = prompt("Digite a senha de segurança:");                                                                                    
<br>                                                                                                                                       
  // TROQUE PELA SENHA QUE VOCÊ QUISER                                                                                                     
  const senhaCorreta = "123456";                                                                                                           
<br>                                                                                                                                       
  if(senha !== senhaCorreta){                                                                                                              
    alert("Senha incorreta.");                                                                                                             
    return;                                                                                                                                
  }                                                                                                                                        
<br>                                                                                                                                       
  callback();                                                                                                                              
}                                                                                                                                          
<br>                                                                                                                                       
function statusPlano(app){                                                                                                                 
  if(!app) return { bloqueado\:true, dias\:null };                                                                                         
<br>                                                                                                                                       
  if(app.ativo === false) return { bloqueado\:true, dias\:null };                                                                          
<br>                                                                                                                                       
  if(!app.data_expiracao) return { bloqueado\:false, dias\:null };                                                                        
<br>                                                                                                                                       
  const hoje = new Date();                                                                                                                 
  const vencimento = new Date(app.data_expiracao);                                                                                        
  const dias = Math.ceil((vencimento - hoje) / (1000 * 60 * 60 * 24));                                                                  
<br>                                                                                                                                       
  return {                                                                                                                                 
    bloqueado: dias <= 0,                                                                                                                  
    dias                                                                                                                                   
  };                                                                                                                                       
}                                                                                                                                          
<br>                                                                                                                                       
/* =========================                                                                                                              
   INICIAR                                                                                                                                 
========================= */                                                                                                              
document.addEventListener("DOMContentLoaded", iniciar);                                                                                    
<br>                                                                                                                                       
async function iniciar(){                                                                                                                  
  const lista = document.getElementById("listaNegocios");                                                                                  
<br>                                                                                                                                       
  const { data:{ session } } = await db.auth.getSession();                                                                                 
<br>                                                                                                                                       
  if(!session){                                                                                                                            
    window\.location.href = "/auth/login.html";                                                                                            
    return;                                                                                                                                
  }                                                                                                                                        
<br>                                                                                                                                       
  const { data: negocios, error: negError } = await db                                                                                     
  .from("negocios")                                                                                                                        
  .select("*")                                                                                                                            
  .eq("dono_id", session.user.id)                                                                                                         
  .eq("ativo", true);                                                                                                                      
<br>                                                                                                                                       
if(negError){                                                                                                                              
  console.error(negError);                                                                                                                 
  lista.innerHTML = `<div class="vazio">Erro ao carregar negócios</div>`;                                                              
  return;                                                                                                                                  
}                                                                                                                                          
<br>                                                                                                                                       
| const appIds = (negocios || []).map(n => n.app_id).filter(Boolean);

// ============================================================
// PLANOS / VENCIMENTOS
// ============================================================
// Cada negócio possui seu próprio app_id em negocios.app_id.
// O plano da loja deve ser lido SOMENTE da tabela apps.
//
// NÃO usar usuarios.app_id aqui.
// O mesmo usuário pode possuir várias lojas.
// ============================================================

const { data: apps, error: appsError } = await db
  .from("apps")
  .select("id, ativo, plano, data_expiracao")
  .in("id", appIds);

if (appsError) {
  console.error("Erro ao carregar planos:", appsError);
  lista.innerHTML = `
    <div class="vazio">
      Erro ao carregar os planos das lojas.
    </div>
  `;
  return;
}

const appsMap = {};

(apps || []).forEach(app => {
  appsMap[app.id] = app;
});
lista.innerHTML = negocios.map(n => {                                                                                                      
  const app = appsMap[n.app_id];                                                                                                          
  const plano = statusPlano(app);                                                                                                          
<br>                                                                                                                                       
  return `                                                                                                                                
    <div class="card">                                                                                                                    
      <h3>${n.nome}</h3>                                                                                                                 
                                                                                                                                           
${avisoVencimento(appsMap[n.app_id])}                                                                                                     
<br>                                                                                                                                       
      <div class="acoes">                                                                                                                 
  <button class="btn btn-admin"                                                                                                           
  ${plano.bloqueado ? "disabled style='opacity:.5;cursor\:not-allowed;background:#64748b'" : ""}                                           
  onclick="${plano.bloqueado ? "" : `abrirAdmin('${n.app_id}', '${n.tipo}')`}">                                                         
  ${plano.bloqueado ? "Bloqueado" : "Gerenciar"}                                                                                           
</button>                                                                                                                                 
  </button>                                                                                                                               
<br>                                                                                                                                       
  <button class="btn btn-loja"                                                                                                            
onclick="abrirLoja('${n.app_id}', '${n.tipo}')">                                                                                          
  Ver loja                                                                                                                                 
</button>                                                                                                                                 
<br>                                                                                                                                       
  <button class="btn" style="background:#f59e0b"                                                                                          
  onclick="protegerAcao(() => editarNegocio('${n.id}', '${n.app_id}', '${n.nome}', '${n.tipo}'))">                                        
  Editar                                                                                                                                   
</button>                                                                                                                                 
<br>                                                                                                                                       
  <button class="btn" style="background:#6366f1;color:#fff"                                                                               
  onclick="renovarPlano('${n.app_id}', '${n.nome}')">                                                                                     
  Renovar                                                                                                                                  
</button>                                                                                                                                 
<br>                                                                                                                                       
  <button class="btn" style="background:#ef4444;color:#fff"                                                                               
  onclick="protegerAcao(() => deletarNegocio('${n.id}', '${n.app_id}'))">                                                                 
  Deletar                                                                                                                                  
</button>                                                                                                                                 
</div>                                                                                                                                    
    </div>                                                                                                                                
    `;                                                                                                                                    
}).join("");                                                                                                                               
}                                                                                                                                          
<br>                                                                                                                                       
/* =========================                                                                                                              
   ABRIR ADMIN (SEM APP_ID)                                                                                                               
========================= */                                                                                                              
function abrirAdmin(appId, tipo){                                                                                                          
    const sistema = String(tipo || "").toLowerCase().trim();                                                                             
<br>                                                                                                                                       
    if(!sistema){                                                                                                                          
        alert("Tipo do negócio não configurado.");                                                                                         
        return;                                                                                                                            
    }                                                                                                                                      
<br>                                                                                                                                       
    window\.location.href =                                                                                                                
        `/${sistema}/admin.html?app_id=${encodeURIComponent(appId)}`;                                                                   
}                                                                                                                                          
/* =========================                                                                                                              
   LOJA                                                                                                                                    
========================= */                                                                                                              
function abrirLoja(appId, tipo){                                                                                                           
<br>                                                                                                                                       
  const sistema = (tipo || "").toLowerCase().trim();                                                                                     
<br>                                                                                                                                       
  const paginas = {                                                                                                                        
    agua: "/public/agua/",                                                                                                                 
    gas: "/public/agua/",                                                                                                                  
    mercado: "/public/mercado/",                                                                                                           
    agendamento: "/agendamento/",                                                                                                          
    barbearia: "/agendamento/",                                                                                                            
    hotel: "/hotel/",                                                                                                                      
    borracharia: "/borracharia/",                                                                                                          
    hotspot: "/hotspot/"                                                                                                                   
  };                                                                                                                                       
<br>                                                                                                                                       
  const url = paginas[sistema] || "/public/agua/";                                                                                       
<br>                                                                                                                                       
  window\.location.href = `${url}?app_id=${encodeURIComponent(appId)}`;                                                                 
}                                                                                                                                          
<br>                                                                                                                                       
<br>                                                                                                                                       
async function editarNegocio(id, appId, nomeAtual, tipoAtual){                                                                             
<br>                                                                                                                                       
  const nome = prompt("Novo nome do negócio:", nomeAtual);                                                                                 
  if(!nome) return;                                                                                                                        
<br>                                                                                                                                       
  const tipo = prompt("Tipo do sistema (ex: bar, gas, borracharia):", tipoAtual);                                                          
  if(!tipo) return;                                                                                                                        
<br>                                                                                                                                       
  // Atualiza a tabela de negócios                                                                                                         
  const { error } = await db                                                                                                               
    .from("negocios")                                                                                                                      
    .update({                                                                                                                              
      nome: nome.trim(),                                                                                                                   
      tipo: tipo.trim().toLowerCase()                                                                                                      
    })                                                                                                                                     
    .eq("id", id);                                                                                                                         
<br>                                                                                                                                       
  if(error){                                                                                                                               
    alert("Erro ao editar.");                                                                                                              
    console.error(error);                                                                                                                  
    return;                                                                                                                                
  }                                                                                                                                        
<br>                                                                                                                                       
  // Atualiza o Hotspot                                                                                                                    
  const { error: erroHotspot } = await db                                                                                                  
    .from("hotspot_config")                                                                                                               
    .update({                                                                                                                              
      nome_hotspot: nome.trim()                                                                                                           
    })                                                                                                                                     
    .eq("app_id", appId);                                                                                                                 
<br>                                                                                                                                       
  if(erroHotspot){                                                                                                                         
    console.error("Erro hotspot_config:", erroHotspot);                                                                                   
  }                                                                                                                                        
<br>                                                                                                                                       
  // Atualiza o Monitor                                                                                                                    
  const { error: erroMonitor } = await db                                                                                                  
    .from("monitor_config")                                                                                                               
    .update({                                                                                                                              
      nome_empresa: nome.trim()                                                                                                           
    })                                                                                                                                     
    .eq("app_id", appId);                                                                                                                 
<br>                                                                                                                                       
    console.log("APP_ID:", appId);                                                                                                        
console.log("Nome:", nome.trim());                                                                                                         
console.log("Erro monitor:", erroMonitor);                                                                                                 
<br>                                                                                                                                       
const { data } = await db                                                                                                                  
  .from("monitor_config")                                                                                                                 
  .select("*")                                                                                                                            
  .eq("app_id", appId);                                                                                                                   
<br>                                                                                                                                       
console.log("Monitor depois do update:", data);                                                                                            
<br>                                                                                                                                       
  if(erroMonitor){                                                                                                                         
    console.error("Erro monitor_config:", erroMonitor);                                                                                   
  }                                                                                                                                        
<br>                                                                                                                                       
  iniciar();                                                                                                                               
}                                                                                                                                          
<br>                                                                                                                                       
async function deletarNegocio(id, appId){                                                                                                  
  if(!confirm("Excluir este negócio da lista?")) return;                                                                                   
<br>                                                                                                                                       
  const { error } = await db                                                                                                               
    .from("negocios")                                                                                                                      
    .delete()                                                                                                                              
    .eq("id", id)                                                                                                                          
    .eq("app_id", appId);                                                                                                                 
<br>                                                                                                                                       
  if(error){                                                                                                                               
    alert("Erro ao deletar: " + error.message);                                                                                            
    console.error(error);                                                                                                                  
    return;                                                                                                                                
  }                                                                                                                                        
<br>                                                                                                                                       
  alert("Negócio removido da lista.");                                                                                                     
  iniciar();                                                                                                                               
}                                                                                                                                          
<br>                                                                                                                                       
function renovarPlano(appId, nome){                                                                                                        
  const url = `https\://www\.ffsolucoes.com.br/pagamento/renovar?app_id=${encodeURIComponent(appId)}&nome=${encodeURIComponent(nome)}`; 
<br>                                                                                                                                       
  window\.location.href = url;                                                                                                             
}                                                                                                                                          
/* =========================                                                                                                              
   SAIR                                                                                                                                    
========================= */                                                                                                              
async function sair(){                                                                                                                     
  await db.auth.signOut();                                                                                                                 
  window\.location.href = "/auth/login.html";                                                                                              
}                                                                                                                                          
<br>                                                                                                                                       
let cliquesSecretos = 0;                                                                                                                   
let tempoCliqueSecreto = null;                                                                                                             
<br>                                                                                                                                       
document.getElementById("cardMinhasLojas")?.addEventListener("click", () => {                                                              
  cliquesSecretos++;                                                                                                                       
<br>                                                                                                                                       
  clearTimeout(tempoCliqueSecreto);                                                                                                        
<br>                                                                                                                                       
  tempoCliqueSecreto = setTimeout(() => {                                                                                                  
    cliquesSecretos = 0;                                                                                                                   
  }, 2500);                                                                                                                                
<br>                                                                                                                                       
  if(cliquesSecretos >= 20){                                                                                                               
    cliquesSecretos = 0;                                                                                                                   
    window\.location.href = "https\://www\.ffsolucoes.com.br/super/painel-dominios.html";                                                  
  }                                                                                                                                        
});                                                                                                                                                                                                                                                                         
</script>
