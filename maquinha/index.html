<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FF Maquininha</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{box-sizing:border-box;font-family:Arial,sans-serif}
    body{margin:0;background:#f3f4f6;color:#111827}
    .wrap{max-width:520px;margin:auto;padding:16px}
    .card{background:#fff;border-radius:22px;padding:18px;box-shadow:0 8px 28px rgba(0,0,0,.08)}
    h1{font-size:22px;margin:0 0 4px;text-align:center}
    .sub{font-size:13px;color:#667085;text-align:center;margin-bottom:14px}
    .display{background:#101828;color:#fff;border-radius:18px;padding:16px 18px;margin-bottom:12px;text-align:right;min-height:92px}
    .expr{font-size:15px;color:#98a2b3;min-height:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .total{font-size:34px;font-weight:800;margin-top:4px;word-break:break-all}
    .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
    button{border:0;border-radius:15px;min-height:58px;font-size:22px;font-weight:750;cursor:pointer}
    .key{background:#f2f4f7;color:#101828}
    .op{background:#eaf2ff;color:#175cd3}
    .danger{background:#fff1f3;color:#c01048}
    .equal{background:#12b76a;color:white}
    .pix{width:100%;margin-top:14px;background:#08749a;color:#fff;font-size:18px;min-height:58px}
    .pix:disabled{opacity:.55}
    .status{margin-top:14px;padding:12px;border-radius:14px;background:#f9fafb;text-align:center;font-weight:700}
    .hidden{display:none!important}
    .qrbox{text-align:center;margin-top:16px}
    .qrbox img{width:min(270px,80vw);background:#fff;padding:10px;border-radius:16px}
    .copy{font-size:13px;word-break:break-all;background:#f9fafb;padding:12px;border-radius:12px;margin-top:10px}
    .smallbtn{width:100%;margin-top:8px;background:#eaf2ff;color:#175cd3;font-size:15px;min-height:46px}
    .novo{width:100%;margin-top:10px;background:#101828;color:white;font-size:16px}
    .erro{background:#fef3f2;color:#b42318}
    .ok{background:#ecfdf3;color:#027a48}
    .wait{background:#fffaeb;color:#b54708}
    @media(max-width:360px){button{min-height:54px}.total{font-size:29px}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>💳 FF MAQUININHA</h1>
    <div class="sub" id="appInfo">Carregando...</div>

    <div class="display">
      <div class="expr" id="expr">0</div>
      <div class="total" id="total">R$ 0,00</div>
    </div>

    <div class="grid">
      <button class="danger" data-action="clear">C</button>
      <button class="op" data-action="back">⌫</button>
      <button class="op" data-op="/">÷</button>
      <button class="op" data-op="*">×</button>

      <button class="key" data-key="7">7</button>
      <button class="key" data-key="8">8</button>
      <button class="key" data-key="9">9</button>
      <button class="op" data-op="-">−</button>

      <button class="key" data-key="4">4</button>
      <button class="key" data-key="5">5</button>
      <button class="key" data-key="6">6</button>
      <button class="op" data-op="+">+</button>

      <button class="key" data-key="1">1</button>
      <button class="key" data-key="2">2</button>
      <button class="key" data-key="3">3</button>
      <button class="equal" data-action="equals">=</button>

      <button class="key" data-key="0" style="grid-column:span 2">0</button>
      <button class="key" data-key=",">,</button>
      <button class="key" data-key="00">00</button>
    </div>

    <div style="margin-top:14px">
      <label for="descricao" style="display:block;font-size:14px;font-weight:700;margin-bottom:6px">
        Descrição da cobrança
      </label>
      <input id="descricao" type="text" maxlength="120"
        placeholder="Ex.: Venda de camisa, ingresso, consumo..."
        style="width:100%;height:48px;border:1px solid #d0d5dd;border-radius:12px;padding:0 13px;font-size:16px;outline:none">
    </div>

    <button id="btnPix" class="pix">GERAR PIX — R$ 0,00</button>

    <div id="status" class="status hidden"></div>

    <div id="pixArea" class="qrbox hidden">
      <img id="qrImg" alt="QR Code PIX">
      <div class="copy" id="pixCode"></div>
      <button class="smallbtn" id="btnCopy">COPIAR PIX</button>
      <button class="novo" id="btnNovo">NOVA COBRANÇA</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://auzdqapjetmhaokoynzo.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_36kXlyuKU8RMfgSx01h5mw_lOLp1lbX";

const params = new URLSearchParams(location.search);
const APP_ID = params.get("app_id");

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let tokens = [];
let current = "";
let paymentId = null;
let pollTimer = null;
const descricaoEl = document.getElementById("descricao");

const exprEl = document.getElementById("expr");
const totalEl = document.getElementById("total");
const btnPix = document.getElementById("btnPix");
const statusEl = document.getElementById("status");
const pixArea = document.getElementById("pixArea");
const qrImg = document.getElementById("qrImg");
const pixCode = document.getElementById("pixCode");
const appInfo = document.getElementById("appInfo");

function money(v){
  return Number(v || 0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
}

function parseCurrent(){
  if(!current) return null;
  const n = Number(current.replace(",", "."));
  return Number.isFinite(n) ? n : null;
}

function precedence(op){ return (op==="*" || op==="/") ? 2 : 1; }

function applyOp(a,b,op){
  if(op==="+") return a+b;
  if(op==="-") return a-b;
  if(op==="*") return a*b;
  if(op==="/"){
    if(b===0) throw new Error("Não é possível dividir por zero.");
    return a/b;
  }
  return b;
}

function evaluate(items){
  const arr = [...items];
  if(current){
    const n = parseCurrent();
    if(n!==null) arr.push(n);
  }

  if(!arr.length) return 0;
  if(typeof arr[arr.length-1] === "string") arr.pop();
  if(!arr.length) return 0;

  const nums=[], ops=[];
  const calcTop=()=>{
    const b=nums.pop(), a=nums.pop(), op=ops.pop();
    nums.push(applyOp(a,b,op));
  };

  for(const item of arr){
    if(typeof item === "number") nums.push(item);
    else{
      while(ops.length && precedence(ops[ops.length-1]) >= precedence(item)) calcTop();
      ops.push(item);
    }
  }
  while(ops.length) calcTop();
  return nums[0] ?? 0;
}

function expressionText(){
  const parts = tokens.map(x=>{
    if(typeof x==="number") return String(x).replace(".",",");
    return x==="*"?"×":x==="/"?"÷":x;
  });
  if(current) parts.push(current);
  return parts.join(" ") || "0";
}

function refresh(){
  let result = 0;
  try{
    result = evaluate(tokens);
    if(current || tokens.length) result = evaluate(tokens);
    if(result < 0 || !Number.isFinite(result)) result = 0;
  }catch(e){ result = 0; }

  exprEl.textContent = expressionText();
  totalEl.textContent = money(result);
  btnPix.textContent = "GERAR PIX — " + money(result);
}

function digit(k){
  if(k===","){
    if(current.includes(",")) return;
    current = current ? current + "," : "0,";
  }else{
    if(current==="0" && k!=="00") current="";
    current += k;
  }
  refresh();
}

function op(operator){
  const n = parseCurrent();
  if(n!==null){
    tokens.push(n);
    current="";
  }
  if(!tokens.length) return;
  if(typeof tokens[tokens.length-1] === "string"){
    tokens[tokens.length-1] = operator;
  }else{
    tokens.push(operator);
  }
  refresh();
}

function clearCalc(){
  tokens=[]; current=""; refresh();
}

function back(){
  if(current) current=current.slice(0,-1);
  else if(tokens.length) tokens.pop();
  refresh();
}

function equals(){
  try{
    const result = evaluate(tokens);
    if(!current && !tokens.length) return;
    const final = evaluate(tokens);
    let valor = final;
    if(current || tokens.length) valor = evaluate(tokens);
    if(valor < 0 || !Number.isFinite(valor)) throw new Error("Resultado inválido.");
    tokens=[];
    current=String(Math.round(valor*100)/100).replace(".",",");
    refresh();
  }catch(e){ showStatus(e.message,"erro"); }
}

document.querySelectorAll("[data-key]").forEach(b=>b.addEventListener("click",()=>digit(b.dataset.key)));
document.querySelectorAll("[data-op]").forEach(b=>b.addEventListener("click",()=>op(b.dataset.op)));
document.querySelector('[data-action="clear"]').addEventListener("click",clearCalc);
document.querySelector('[data-action="back"]').addEventListener("click",back);
document.querySelector('[data-action="equals"]').addEventListener("click",equals);

function finalValue(){
  try{
    const v = evaluate(tokens);
    if(current || tokens.length) return evaluate(tokens);
    return 0;
  }catch(e){ throw e; }
}

function showStatus(msg,type="wait"){
  statusEl.className="status "+type;
  statusEl.textContent=msg;
}

async function loadConfig(){
  if(!APP_ID){
    appInfo.textContent="APP_ID não informado na URL.";
    showStatus("Abra a maquininha com ?app_id=SEU_APP_ID","erro");
    btnPix.disabled=true;
    return;
  }

  const {data,error}=await sb
    .from("hotspot_config")
    .select("app_id,nome_hotspot")
    .eq("app_id",APP_ID)
    .maybeSingle();

  if(error || !data){
    appInfo.textContent="Aplicação não encontrada.";
    showStatus("APP_ID não encontrado no hotspot_config.","erro");
    btnPix.disabled=true;
    return;
  }

  appInfo.textContent=data.nome_hotspot || "Maquininha conectada";
}

async function gerarPix(){
  if(!APP_ID) return;

  let valor;
  try{ valor=finalValue(); }
  catch(e){ showStatus(e.message,"erro"); return; }

  valor = Math.round(Number(valor)*100)/100;
  if(!Number.isFinite(valor) || valor <= 0){
    showStatus("Digite um valor maior que zero.","erro");
    return;
  }

  btnPix.disabled=true;
  showStatus("Gerando PIX...","wait");

  try{
    const resp=await fetch(`${SUPABASE_URL}/functions/v1/gerar-pix-caixa`,{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "apikey":SUPABASE_ANON_KEY,
        "Authorization":`Bearer ${SUPABASE_ANON_KEY}`
      },
      body:JSON.stringify({
        app_id:APP_ID,
        valor,
        descricao: (descricaoEl.value || "").trim()
      })
    });

    const data=await resp.json();

    if(!resp.ok || !data.success){
      throw new Error(data.error || "Não foi possível gerar o PIX.");
    }

    paymentId=String(data.payment_id);
    qrImg.src=`data:image/png;base64,${data.qr_code_base64}`;
    pixCode.textContent=data.qr_code || "";
    pixArea.classList.remove("hidden");
    showStatus("PIX gerado. Aguardando pagamento...","wait");
    iniciarConsulta();
  }catch(e){
    showStatus(e.message || "Erro ao gerar PIX.","erro");
    btnPix.disabled=false;
  }
}

function iniciarConsulta(){
  if(pollTimer) clearInterval(pollTimer);

  const verificar=async()=>{
    if(!paymentId) return;

    const {data,error}=await sb
      .from("maquininha_pagamentos")
      .select("status,payment_status")
      .eq("payment_id",paymentId)
      .maybeSingle();

    if(error || !data) return;

    const st=(data.status || data.payment_status || "").toLowerCase();
    if(st==="approved"){
      clearInterval(pollTimer);
      pollTimer=null;
      showStatus("✅ PAGAMENTO APROVADO","ok");
      btnPix.disabled=true;
    }else if(st==="rejected" || st==="cancelled"){
      clearInterval(pollTimer);
      pollTimer=null;
      showStatus("Pagamento não aprovado.","erro");
      btnPix.disabled=false;
    }
  };

  verificar();
  pollTimer=setInterval(verificar,4000);
}

btnPix.addEventListener("click",gerarPix);

document.getElementById("btnCopy").addEventListener("click",async()=>{
  const text=pixCode.textContent || "";
  try{
    await navigator.clipboard.writeText(text);
    showStatus("PIX copia e cola copiado.","ok");
  }catch{
    showStatus("Selecione e copie o código PIX manualmente.","wait");
  }
});

document.getElementById("btnNovo").addEventListener("click",()=>{
  if(pollTimer) clearInterval(pollTimer);
  pollTimer=null;
  paymentId=null;
  pixArea.classList.add("hidden");
  statusEl.className="status hidden";
  clearCalc();
  descricaoEl.value="";
  btnPix.disabled=false;
});

refresh();
loadConfig();
</script>
</body>
</html>
