<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - FF Maquininhas</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f7;font-family:Arial,sans-serif}.box{max-width:500px;margin:30px auto;background:#fff;padding:22px;border-radius:18px}
h1{margin-top:0}input{width:100%;padding:14px;margin:7px 0;border:1px solid #ddd;border-radius:10px;font-size:16px}
button{width:100%;padding:15px;margin-top:10px;border:0;border-radius:10px;background:#111;color:#fff;font-weight:bold}
.machine{background:#f5f5f5;padding:12px;border-radius:10px;margin-top:10px}.link{word-break:break-all;font-size:12px;color:#444}
.status{margin-top:12px;font-weight:bold}
</style>
</head>
<body>
<div class="box">
<h1>FF MAQUININHAS</h1>
<p>Cadastre cada maquininha com o Access Token do Mercado Pago dela. Isso é separado do Hotspot.</p>

<input id="nome" placeholder="Nome da maquininha / operador">
<input id="descricao" placeholder="Descrição (opcional)">
<input id="token" type="password" placeholder="Mercado Pago Access Token">

<button onclick="cadastrar()">CADASTRAR MAQUININHA</button>
<div id="status" class="status"></div>
<div id="resultado"></div>
</div>

<script>
const SUPABASE_URL="https://auzdqapjetmhaokoynzo.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_36kXlyuKU8RMfgSx01h5mw_lOLp1lbX";

async function cadastrar(){
  const nome=document.getElementById("nome").value.trim();
  const descricao=document.getElementById("descricao").value.trim();
  const token=document.getElementById("token").value.trim();
  const status=document.getElementById("status");
  const resultado=document.getElementById("resultado");

  if(!nome||!token){status.textContent="Informe o nome e o Access Token.";return}

  status.textContent="Cadastrando...";
  resultado.innerHTML="";

  const r=await fetch(`${SUPABASE_URL}/functions/v1/cadastrar-maquininha`,{
    method:"POST",
    headers:{"Content-Type":"application/json","apikey":SUPABASE_ANON_KEY},
    body:JSON.stringify({nome,descricao,mercado_pago_token:token})
  });
  const d=await r.json();

  if(!r.ok||!d.success){
    status.textContent=d.error||"Erro ao cadastrar.";
    return;
  }

  const id=d.maquininha.id;
  const caixa=`${location.origin}/caixa.html?maquininha_id=${encodeURIComponent(id)}`;

  status.textContent="Maquininha cadastrada com sucesso.";
  resultado.innerHTML=`
    <div class="machine">
      <b>${escapeHtml(d.maquininha.nome)}</b><br>
      ID: <span class="link">${escapeHtml(id)}</span><br><br>
      <a href="${caixa}" target="_blank">ABRIR MAQUININHA</a>
      <p class="link">${escapeHtml(caixa)}</p>
    </div>`;
  document.getElementById("token").value="";
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
</script>
</body>
</html>
